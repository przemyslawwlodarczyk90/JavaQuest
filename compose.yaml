# PostgreSQL dla platformy JavaQuest - dane zgodne z domyslnymi wartosciami w
# src/main/resources/javaquest-platform.properties. Start: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: javaquest-postgres
    environment:
      POSTGRES_DB: pgDB
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - javaquest-pgdata:/var/lib/postgresql/data

volumes:
  javaquest-pgdata:
