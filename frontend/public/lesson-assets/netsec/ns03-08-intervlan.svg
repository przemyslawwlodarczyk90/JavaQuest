<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Porównanie routingu między VLAN-ami: router-on-a-stick z podinterfejsami Gi0/0.10 i Gi0/0.20 na jednym łączu trunk 802.1Q do przełącznika L2, oraz przełącznik L3 z poleceniem ip routing i interfejsami SVI Vlan10 i Vlan20 pełniącymi rolę bram.">
<title>Porównanie routingu między VLAN-ami: router-on-a-stick z podinterfejsami Gi0/0.10 i Gi0/0.20 na jednym łączu trunk 802.1Q do przełącznika L2, oraz przełącznik L3 z poleceniem ip routing i interfejsami SVI Vlan10 i Vlan20 pełniącymi rolę bram.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Routing między VLAN-ami: router-on-a-stick vs SVI na przełączniku L3</text><rect x="40" y="56" width="400" height="330" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="240" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">Router-on-a-stick</text><rect x="170" y="96" width="140" height="44" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="240" y="123" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">router</text><line x1="240" y1="140" x2="240" y2="190" stroke="#c46a12" stroke-width="4"/><text x="250" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14">trunk 802.1Q</text><rect x="160" y="190" width="160" height="44" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="240" y="217" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">switch L2</text><line x1="200" y1="234" x2="120" y2="280" stroke="#6b6257" stroke-width="2"/><line x1="280" y1="234" x2="360" y2="280" stroke="#6b6257" stroke-width="2"/><rect x="60" y="280" width="120" height="40" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="120" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">VLAN 10</text><rect x="300" y="280" width="120" height="40" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="360" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">VLAN 20</text><text x="56" y="344" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14">Gi0/0.10: encapsulation dot1Q 10, 10.10.0.1/24</text><text x="56" y="362" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14">Gi0/0.20: encapsulation dot1Q 20, 10.20.0.1/24</text><text x="56" y="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b">Tani, ale ruch między VLAN-ami idzie dwa razy przez 1 łącze</text><rect x="460" y="56" width="400" height="330" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="660" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">Przełącznik L3 (SVI)</text><rect x="560" y="110" width="200" height="84" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="660" y="136" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">switch L3</text><text x="660" y="158" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">ip routing</text><text x="660" y="178" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">Vlan10 .1 · Vlan20 .1</text><line x1="600" y1="194" x2="540" y2="280" stroke="#6b6257" stroke-width="2"/><line x1="720" y1="194" x2="780" y2="280" stroke="#6b6257" stroke-width="2"/><rect x="480" y="280" width="120" height="40" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="540" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">VLAN 10</text><rect x="720" y="280" width="120" height="40" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="780" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">VLAN 20</text><text x="476" y="344" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14">interface Vlan10: ip address 10.10.0.1 255.255.255.0</text><text x="476" y="362" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14">interface Vlan20: ip address 10.20.0.1 255.255.255.0</text><text x="476" y="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f">Routing sprzętowy z prędkością przełączania — standard w LAN</text>
</svg>
