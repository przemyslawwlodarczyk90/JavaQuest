0.1.70 :9092</text><line x1="282" y1="300" x2="370" y2="120" stroke="#b23b3b" stroke-width="2" marker-end="url(#arr)"/><rect x="370" y="70" width="140" height="300" rx="10" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="440" y="96" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">funkcja hash</text><text x="440" y="114" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">src/dst IP, port</text><text x="440" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">mod liczba łączy</text><line x1="512" y1="120" x2="690" y2="120" stroke="#1f1a14" stroke-width="5"/><text x="600" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">łącze 0 (1G)</text><line x1="512" y1="184" x2="690" y2="184" stroke="#1f1a14" stroke-width="5"/><text x="600" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">łącze 1 (1G)</text><line x1="512" y1="248" x2="690" y2="248" stroke="#1f1a14" stroke-width="5"/><text x="600" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">łącze 2 (1G)</text><line x1="512" y1="312" x2="690" y2="312" stroke="#1f1a14" stroke-width="5"/><text x="600" y="304" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">łącze 3 (1G)</text><rect x="690" y="90" width="170" height="280" rx="10" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="775" y="230" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#2f6fb3" text-anchor="middle" font-weight="700">SW2</text><rect x="30" y="384" width="830" height="26" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="445" y="402" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">Łącze 0 niesie dwa przepływy, inne po jednym — rozkład zależy od różnorodności adresów i portów, nie od obciążenia.</text>
</svg>
