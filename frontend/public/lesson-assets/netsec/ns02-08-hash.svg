<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Pięć przepływów od różnych klientów do serwerów trafia do funkcji hash liczonej z adresów IP i portów modulo liczba łączy; każdy przepływ zostaje przypisany do jednego z czterech łączy 1G, przy czym łącze 0 niesie dwa przepływy. Rozkład zależy od różnorodności nagłówków, a nie od obciążenia.">
<title>Pięć przepływów od różnych klientów do serwerów trafia do funkcji hash liczonej z adresów IP i portów modulo liczba łączy; każdy przepływ zostaje przypisany do jednego z czterech łączy 1G, przy czym łącze 0 niesie dwa przepływy. Rozkład zależy od różnorodności nagłówków, a nie od obciążenia.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
