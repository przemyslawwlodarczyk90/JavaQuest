<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="Drzewo plików pakietu laboratorium: docker-compose.yml, scenario.json, reset.sh, check.sh, tests, expected, config i README z opisem roli każdego elementu">
<title>Drzewo plików pakietu laboratorium: docker-compose.yml, scenario.json, reset.sh, check.sh, tests, expected, config i README z opisem roli każdego elementu</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="410" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Anatomia pakietu laboratorium</text><text x="60" y="70" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" font-weight="700">lab-zero/</text><text x="330" y="70" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14"></text><text x="60" y="106" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2f6fb3" font-weight="700">├── docker-compose.yml</text><text x="330" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">usługi, sieci, wolumeny — środowisko w jednym pliku</text><text x="60" y="142" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#6a4c9c" font-weight="700">├── scenario.json</text><text x="330" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">cel, poziom, kroki, punktacja, mapowanie na egzaminy</text><text x="60" y="178" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c46a12" font-weight="700">├── reset.sh</text><text x="330" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">powrót do stanu początkowego (down -v, up -d, seed danych)</text><text x="60" y="214" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2e7d4f" font-weight="700">├── check.sh</text><text x="330" y="214" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">automatyczne sprawdzenie: czy cel został osiągnięty</text><text x="60" y="250" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2e7d4f" font-weight="700">├── tests/</text><text x="330" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">testy szczegółowe (curl, nc, zapytania, reguły)</text><text x="60" y="286" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#6b6257" font-weight="700">├── expected/</text><text x="330" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">wzorcowe wyniki do porównania (np. hash, liczba alertów)</text><text x="60" y="322" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2f6fb3" font-weight="700">├── config/</text><text x="330" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Caddyfile, application.yml, reguły nftables …</text><text x="60" y="358" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" font-weight="700">└── README.md</text><text x="330" y="358" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">instrukcja, wymagania, sprzątanie, uwagi o bezpieczeństwie</text><text x="450" y="390" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">Zasada: każdy lab da się uruchomić, sprawdzić i zresetować jednym poleceniem — bez ręcznego klikania.</text>
</svg>
