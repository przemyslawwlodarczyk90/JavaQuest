<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Nagłówek IPv6 o stałej długości 40 bajtów: Version, Traffic Class, Flow Label, Payload Length, Next Header, Hop Limit, 128-bitowe adresy źródłowy i docelowy. Brak pól fragmentacji i sumy kontrolnej. Łańcuch nagłówków rozszerzających: IPv6, Hop-by-Hop, Routing, Fragment, TCP — połączonych polem Next Header.">
<title>Nagłówek IPv6 o stałej długości 40 bajtów: Version, Traffic Class, Flow Label, Payload Length, Next Header, Hop Limit, 128-bitowe adresy źródłowy i docelowy. Brak pól fragmentacji i sumy kontrolnej. Łańcuch nagłówków rozszerzających: IPv6, Hop-by-Hop, Routing, Fragment, TCP — połączonych polem Next Header.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">Nagłówek IPv6: stałe 40 B, mniej pól niż IPv4, opcje w nagłówkach rozszerzających</text><rect x="70" y="52" width="100" height="44" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="120" y="79" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="middle" font-weight="700">Version=6</text><rect x="170" y="52" width="200" height="44" rx="3" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="270" y="79" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">Traffic Class</text><rect x="370" y="52" width="500" height="44" rx="3" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="620" y="79" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">Flow Label</text><rect x="70" y="102" width="400" height="44" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="270" y="129" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="middle" font-weight="700">Payload Length</text><rect x="470" y="102" width="200" height="44" rx="3" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="570" y="129" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">Next Header</text><rect x="670" y="102" width="200" height="44" rx="3" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="770" y="129" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">Hop Limit</text><rect x="70" y="152" width="800" height="44" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="470" y="179" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="700">Source Address (128 bitów = 4 wiersze)</text><rect x="70" y="202" width="800" height="44" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="470" y="229" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="700">Destination Address (128 bitów = 4 wiersze)</text><text x="40" y="270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Brak w IPv6: IHL, Identification/Flags/Offset (fragmentuje tylko nadawca — nagłówek Fragment), Header Checksum.</text><text x="40" y="290" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Next Header = numer następnego nagłówka: 6 TCP, 17 UDP, 58 ICMPv6, 0 Hop-by-Hop, 43 Routing, 44 Fragment, 60 Destination Opts.</text><rect x="50" y="318" width="150" height="54" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="125" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">IPv6</text><text x="125" y="362" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">NH=0</text><line x1="202" y1="345" x2="218" y2="345" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="220" y="318" width="150" height="54" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="295" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">Hop-by-Hop</text><text x="295" y="362" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">NH=43</text><line x1="372" y1="345" x2="388" y2="345" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="390" y="318" width="150" height="54" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="465" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">Routing</text><text x="465" y="362" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">NH=44</text><line x1="542" y1="345" x2="558" y2="345" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="318" width="150" height="54" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="635" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">Fragment</text><text x="635" y="362" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">NH=6</text><line x1="712" y1="345" x2="728" y2="345" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="730" y="318" width="150" height="54" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="805" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">TCP</text><text x="805" y="362" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">dane</text><text x="40" y="400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Łańcuch nagłówków rozszerzających: firewalle/IDS muszą go przejść, by znaleźć porty — długie łańcuchy i RH0 (wycofany) to ryzyko;</text><text x="40" y="420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">wiele sieci odrzuca pakiety z nietypowymi extension headers (RFC 7872). Hop Limit = TTL, Flow Label = etykieta przepływu (ECMP).</text>
</svg>
