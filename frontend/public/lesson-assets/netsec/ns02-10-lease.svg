<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Oś czasu dzierżawy 8-godzinnej: do T1 (4 h, 50%) adres używany spokojnie, od T1 do T2 (7 h, 87,5%) klient odnawia dzierżawę unicastem u swojego serwera, od T2 do końca próbuje dowolnego serwera broadcastem; po końcu dzierżawy bez odpowiedzi musi przestać używać adresu.">
<title>Oś czasu dzierżawy 8-godzinnej: do T1 (4 h, 50%) adres używany spokojnie, od T1 do T2 (7 h, 87,5%) klient odnawia dzierżawę unicastem u swojego serwera, od T2 do końca próbuje dowolnego serwera broadcastem; po końcu dzierżawy bez odpowiedzi musi przestać używać adresu.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Cykl życia dzierżawy: T1 = 50%, T2 = 87,5%</text><rect x="60" y="100" width="390" height="40" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="255" y="125" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">adres używany spokojnie</text><rect x="450" y="100" width="292.5" height="40" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="596.25" y="125" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" text-anchor="middle" font-weight="700">RENEWING: unicast do serwera</text><rect x="742.5" y="100" width="97.5" height="40" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="791.25" y="125" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" text-anchor="middle" font-weight="700">REBINDING</text><line x1="60" y1="142" x2="60" y2="160" stroke="#1f1a14" stroke-width="2"/><text x="60" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">0 (ACK)</text><line x1="450" y1="142" x2="450" y2="160" stroke="#1f1a14" stroke-width="2"/><text x="450" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">T1 = 4 h</text><line x1="742.5" y1="142" x2="742.5" y2="160" stroke="#1f1a14" stroke-width="2"/><text x="742.5" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">T2 = 7 h</text><line x1="840" y1="142" x2="840" y2="160" stroke="#1f1a14" stroke-width="2"/><text x="840" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">8 h — koniec</text><rect x="60" y="200" width="780" height="110" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="80" y="226" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">T1: klient wysyła DHCPREQUEST unicastem do serwera, który dał adres — zwykle dostaje ACK i licznik startuje od nowa.</text><text x="80" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">T2: serwer milczy → REQUEST broadcastem do dowolnego serwera (rebinding).</text><text x="80" y="274" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Koniec dzierżawy bez odpowiedzi: klient MUSI przestać używać adresu → zrywa połączenia, wraca do DISCOVER.</text><text x="80" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">Dla aplikacji: awaria serwera DHCP nie wyłącza sieci od razu — dopiero po końcu dzierżaw.</text>
</svg>
