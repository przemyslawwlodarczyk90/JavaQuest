<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Konwersja MAC 00:1a:2b:3c:4d:5e na identyfikator EUI-64: wstawienie ff:fe w środek i odwrócenie bitu U/L daje 21a:2bff:fe3c:4d5e; adres link-local fe80::21a:2bff:fe3c:4d5e i adres SLAAC 2001:db8:abcd:12:21a:2bff:fe3c:4d5e. Solicited-node multicast ff02::1:ff3c:4d5e i MAC 33:33:ff:3c:4d:5e. EUI-64 ujawnia MAC, dlatego stosuje się adresy prywatne i tymczasowe.">
<title>Konwersja MAC 00:1a:2b:3c:4d:5e na identyfikator EUI-64: wstawienie ff:fe w środek i odwrócenie bitu U/L daje 21a:2bff:fe3c:4d5e; adres link-local fe80::21a:2bff:fe3c:4d5e i adres SLAAC 2001:db8:abcd:12:21a:2bff:fe3c:4d5e. Solicited-node multicast ff02::1:ff3c:4d5e i MAC 33:33:ff:3c:4d:5e. EUI-64 ujawnia MAC, dlatego stosuje się adresy prywatne i tymczasowe.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">Identyfikator interfejsu z MAC (EUI-64), solicited-node multicast i MAC 33:33</text><text x="56" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">MAC</text><text x="470" y="72" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" font-weight="700">00:1a:2b:3c:4d:5e</text><text x="56" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">podziel na pół i wstaw ff:fe</text><text x="470" y="112" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2f6fb3" font-weight="700">00:1a:2b:ff:fe:3c:4d:5e</text><line x1="40" y1="92" x2="860" y2="92" stroke="#d9d0c3" stroke-width="1"/><text x="56" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">odwróć 7. bit pierwszego bajtu (U/L): 00 → 02</text><text x="470" y="152" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#6a4c9c" font-weight="700">02:1a:2b:ff:fe:3c:4d:5e</text><line x1="40" y1="132" x2="860" y2="132" stroke="#d9d0c3" stroke-width="1"/><text x="56" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">identyfikator interfejsu (64 bity)</text><text x="470" y="192" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2e7d4f" font-weight="700">21a:2bff:fe3c:4d5e</text><line x1="40" y1="172" x2="860" y2="172" stroke="#d9d0c3" stroke-width="1"/><text x="56" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">adres link-local</text><text x="470" y="232" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2e7d4f" font-weight="700">fe80::21a:2bff:fe3c:4d5e</text><line x1="40" y1="212" x2="860" y2="212" stroke="#d9d0c3" stroke-width="1"/><text x="56" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">adres SLAAC w prefiksie 2001:db8:abcd:12::/64</text><text x="470" y="272" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2e7d4f" font-weight="700">2001:db8:abcd:12:21a:2bff:fe3c:4d5e</text><line x1="40" y1="252" x2="860" y2="252" stroke="#d9d0c3" stroke-width="1"/><rect x="40" y="300" width="820" height="104" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="56" y="324" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Solicited-node multicast (ND zamiast ARP-broadcastu): ff02::1:ff + ostatnie 24 bity adresu → ff02::1:ff3c:4d5e</text><text x="56" y="348" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">MAC dla grupy multicast IPv6: 33:33 + ostatnie 32 bity → 33:33:ff:3c:4d:5e</text><text x="56" y="374" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">EUI-64 ujawnia MAC (śledzenie urządzenia między sieciami) → dziś domyślnie: stabilne adresy prywatne (RFC 7217)</text><text x="56" y="394" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">i adresy tymczasowe (RFC 8981) do połączeń wychodzących.</text>
</svg>
