<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Wodospad czasu dwunastu etapów żądania: największe odcinki to DNS około 12 ms, handshake TCP 20 ms i TLS 21 ms; przetwarzanie w Javie i bazie zajmuje kilka milisekund">
<title>Wodospad czasu dwunastu etapów żądania: największe odcinki to DNS około 12 ms, handshake TCP 20 ms i TLS 21 ms; przetwarzanie w Javie i bazie zajmuje kilka milisekund</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Gdzie mija 75,3 ms? Przykładowy pomiar (RTT ok. 20 ms)</text><text x="290" y="77" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">1. Parsowanie URL</text><rect x="300" y="64" width="3" height="20" rx="3" fill="#2f6fb3" opacity="0.85"/><text x="309" y="78" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">0,1 ms</text><text x="290" y="111" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">2. Cache i HSTS</text><rect x="300.74369189907037" y="98" width="3" height="20" rx="3" fill="#2f6fb3" opacity="0.85"/><text x="309.74369189907037" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">0,2 ms</text><text x="290" y="145" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">3. Rozwiązanie nazwy (DNS)</text><rect x="302.23107569721117" y="132" width="89.24302788844622" height="20" rx="3" fill="#2f6fb3" opacity="0.85"/><text x="397.4741035856574" y="146" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">12 ms</text><text x="290" y="179" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">4. Trasa i ARP</text><rect x="391.4741035856574" y="166" width="7.436918990703852" height="20" rx="3" fill="#c46a12" opacity="0.85"/><text x="404.9110225763613" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">1 ms</text><text x="290" y="213" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">5. Handshake TCP</text><rect x="398.91102257636123" y="200" width="148.73837981407704" height="20" rx="3" fill="#2e7d4f" opacity="0.85"/><text x="553.6494023904382" y="214" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">20 ms</text><text x="290" y="247" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">6. Handshake TLS 1.3</text><rect x="547.6494023904382" y="234" width="156.17529880478088" height="20" rx="3" fill="#6a4c9c" opacity="0.85"/><text x="709.8247011952192" y="248" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">21 ms</text><text x="290" y="281" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">7. Żądanie HTTP/2</text><rect x="703.8247011952192" y="268" width="7.436918990703852" height="20" rx="3" fill="#2f6fb3" opacity="0.85"/><text x="717.261620185923" y="282" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">1 ms</text><text x="290" y="315" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">8. Reverse proxy</text><rect x="711.261620185923" y="302" width="14.873837981407704" height="20" rx="3" fill="#2f6fb3" opacity="0.85"/><text x="732.1354581673307" y="316" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">2 ms</text><text x="290" y="349" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">9. Tomcat i filtry</text><rect x="726.1354581673306" y="336" width="22.310756972111555" height="20" rx="3" fill="#b23b3b" opacity="0.85"/><text x="754.4462151394422" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">3 ms</text><text x="290" y="383" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">10. DispatcherServlet i kontroler</text><rect x="748.4462151394423" y="370" width="7.436918990703852" height="20" rx="3" fill="#b23b3b" opacity="0.85"/><text x="761.8831341301461" y="384" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">1 ms</text><text x="290" y="417" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">11. HikariCP i protokół PostgreSQL</text><rect x="755.8831341301461" y="404" width="44.62151394422311" height="20" rx="3" fill="#2f6fb3" opacity="0.85"/><text x="806.5046480743692" y="418" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">6 ms</text><text x="290" y="451" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">12. Odpowiedź i droga powrotna</text><rect x="800.5046480743692" y="438" width="59.495351925630814" height="20" rx="3" fill="#2f6fb3" opacity="0.85"/><text x="866" y="452" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">8 ms</text><text x="450" y="486" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Największe kawałki: DNS (bez cache), TCP i TLS (po 1 RTT) — sieć, nie Java. Cache DNS i połączenia keep-alive je usuwają.</text>
</svg>
