<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Łańcuch CGNAT: laptop 192.168.1.20, router domowy z adresem WAN 100.72.14.9 z puli 100.64.0.0/10, CGNAT operatora z publicznym 203.0.113.50, serwer widzi tylko adres publiczny. Lista adresów specjalnych IPv6: ::, ::1, ::ffff:0:0/96, 64:ff9b::/96, 2001:db8::/32, 2000::/3, fc00::/7, fe80::/10, ff00::/8.">
<title>Łańcuch CGNAT: laptop 192.168.1.20, router domowy z adresem WAN 100.72.14.9 z puli 100.64.0.0/10, CGNAT operatora z publicznym 203.0.113.50, serwer widzi tylko adres publiczny. Lista adresów specjalnych IPv6: ::, ::1, ::ffff:0:0/96, 64:ff9b::/96, 2001:db8::/32, 2000::/3, fc00::/7, fe80::/10, ff00::/8.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">CGNAT 100.64.0.0/10 i adresy specjalne IPv6</text><rect x="40" y="56" width="820" height="120" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><rect x="60" y="76" width="170" height="80" rx="8" fill="#fbf8f3" stroke="#2e7d4f" stroke-width="1.5"/><text x="145" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">laptop</text><text x="145" y="128" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">192.168.1.20</text><line x1="232" y1="116" x2="258" y2="116" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="260" y="76" width="170" height="80" rx="8" fill="#fbf8f3" stroke="#c46a12" stroke-width="1.5"/><text x="345" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">router domowy</text><text x="345" y="128" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">WAN 100.72.14.9</text><line x1="432" y1="116" x2="458" y2="116" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="460" y="76" width="170" height="80" rx="8" fill="#fbf8f3" stroke="#6a4c9c" stroke-width="1.5"/><text x="545" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">CGNAT operatora</text><text x="545" y="128" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">publiczny 203.0.113.50</text><line x1="632" y1="116" x2="658" y2="116" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="76" width="170" height="80" rx="8" fill="#fbf8f3" stroke="#2f6fb3" stroke-width="1.5"/><text x="745" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">serwer</text><text x="745" y="128" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">widzi 203.0.113.50</text><text x="60" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Skutki: setki klientów pod jednym publicznym adresem — blokada po IP uderza w niewinnych; brak przekierowania portów;</text><text x="60" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">logi serwera muszą zapisywać port źródłowy (operator identyfikuje klienta po IP + porcie + czasie).</text><text x="60" y="246" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3" font-weight="700">::/128</text><text x="260" y="246" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">adres nieokreślony (jak 0.0.0.0)</text><text x="60" y="266" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3" font-weight="700">::1/128</text><text x="260" y="266" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">pętla zwrotna</text><text x="60" y="286" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3" font-weight="700">::ffff:0:0/96</text><text x="260" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IPv4 mapowany na IPv6</text><text x="60" y="306" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3" font-weight="700">64:ff9b::/96</text><text x="260" y="306" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">NAT64 (prefiks dobrze znany)</text><text x="60" y="326" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3" font-weight="700">2001:db8::/32</text><text x="260" y="326" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">dokumentacyjny</text><text x="60" y="346" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3" font-weight="700">2000::/3</text><text x="260" y="346" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">globalne unicast (GUA)</text><text x="60" y="366" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3" font-weight="700">fc00::/7</text><text x="260" y="366" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">unikalne lokalne (ULA, w praktyce fd00::/8)</text><text x="60" y="386" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3" font-weight="700">fe80::/10</text><text x="260" y="386" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">link-local</text><text x="60" y="406" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3" font-weight="700">ff00::/8</text><text x="260" y="406" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">multicast</text>
</svg>
