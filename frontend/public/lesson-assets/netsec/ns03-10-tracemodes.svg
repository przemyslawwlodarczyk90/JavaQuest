<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" role="img" aria-label="Porównanie trybów traceroute: UDP na porty 33434 i wyżej kończony Port Unreachable, często blokowany; ICMP Echo kończony Echo Reply; TCP SYN na port usługi kończony SYN-ACK lub RST, przechodzi tam, gdzie działa usługa; mtr łączy traceroute z ciągłym pomiarem strat i opóźnień.">
<title>Porównanie trybów traceroute: UDP na porty 33434 i wyżej kończony Port Unreachable, często blokowany; ICMP Echo kończony Echo Reply; TCP SYN na port usługi kończony SYN-ACK lub RST, przechodzi tam, gdzie działa usługa; mtr łączy traceroute z ciągłym pomiarem strat i opóźnień.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="392" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">traceroute UDP, ICMP i TCP — który przejdzie przez firewall?</text><rect x="40" y="52" width="820" height="70" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="56" y="74" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" font-weight="700">UDP (domyślny Linux traceroute)</text><text x="56" y="94" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">UDP na porty 33434+; koniec = ICMP Port Unreachable</text><text x="56" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">firewalle często blokują wysokie porty UDP → gwiazdki na końcu</text><rect x="40" y="130" width="820" height="70" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="56" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" font-weight="700">ICMP (Windows tracert, traceroute -I)</text><text x="56" y="172" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">ICMP Echo Request; koniec = Echo Reply</text><text x="56" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">blokowany tam, gdzie ktoś „wyciął ping”</text><rect x="40" y="208" width="820" height="70" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="56" y="230" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" font-weight="700">TCP (traceroute -T -p 443, tcptraceroute)</text><text x="56" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">SYN na port usługi; koniec = SYN-ACK lub RST</text><text x="56" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">przechodzi tam, gdzie działa usługa — najlepszy do HTTPS/baz</text><rect x="40" y="286" width="820" height="70" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="56" y="308" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700">mtr (traceroute + ping ciągły)</text><text x="56" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">statystyka strat i opóźnień per skok (mtr -T -P 443 -c 100 -r)</text><text x="56" y="346" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">raport do zgłoszenia u operatora: mtr -rwzbc 100</text><text x="40" y="372" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Windows: tracert / Test-NetConnection -TraceRoute; pathping = tracert + statystyka strat (odpowiednik mtr).</text>
</svg>
