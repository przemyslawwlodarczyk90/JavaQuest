<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Pięć kroków skoordynowanego ujawniania podatności: odkrycie bez eksploatacji, zgłoszenie oficjalnym kanałem, potwierdzenie przez właściciela, naprawa i publikacja po naprawie lub w ustalonym terminie">
<title>Pięć kroków skoordynowanego ujawniania podatności: odkrycie bez eksploatacji, zgłoszenie oficjalnym kanałem, potwierdzenie przez właściciela, naprawa i publikacja po naprawie lub w ustalonym terminie</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Skoordynowane ujawnianie podatności (CVD)</text><rect x="30" y="70" width="156" height="150" rx="10" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><circle cx="108" cy="100" r="18" fill="#c46a12"/><text x="108" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="108" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">Odkrycie</text><text x="108" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">bez eksploatacji</text><text x="108" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">i bez kopiowania danych</text><line x1="187" y1="145" x2="201" y2="145" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="202" y="70" width="156" height="150" rx="10" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><circle cx="280" cy="100" r="18" fill="#2f6fb3"/><text x="280" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="280" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">Zgłoszenie</text><text x="280" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">security.txt, VDP</text><text x="280" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">lub CERT Polska</text><line x1="359" y1="145" x2="373" y2="145" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="374" y="70" width="156" height="150" rx="10" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><circle cx="452" cy="100" r="18" fill="#6a4c9c"/><text x="452" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="452" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">Potwierdzenie</text><text x="452" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">właściciel potwierdza</text><text x="452" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">i ocenia ryzyko</text><line x1="531" y1="145" x2="545" y2="145" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="546" y="70" width="156" height="150" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="624" cy="100" r="18" fill="#2e7d4f"/><text x="624" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="624" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Naprawa</text><text x="624" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">poprawka, test,</text><text x="624" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">wdrożenie</text><line x1="703" y1="145" x2="717" y2="145" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="718" y="70" width="156" height="150" rx="10" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><circle cx="796" cy="100" r="18" fill="#1f1a14"/><text x="796" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="796" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">Publikacja</text><text x="796" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">po naprawie lub</text><text x="796" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">w terminie (np. 90 dni)</text><text x="450" y="260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">Nigdy: żądanie zapłaty za nieujawnienie, „dowód” przez pobranie danych, publikacja przed naprawą bez uzgodnienia.</text><text x="450" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">Zawsze: minimalny dowód, dokumentacja czasu i czynności, kanał oficjalny, poufność do czasu publikacji.</text>
</svg>
