<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Dwa przełączniki SW1 i SW2 połączone łączem trunk 802.1Q przenoszącym VLAN 10 i 20 ze znacznikami VID 10 i VID 20 oraz ramki bez znacznika w native VLAN; do każdego przełącznika podłączone są dwa komputery na portach access w VLAN 10 i VLAN 20. Host na porcie access nie widzi znacznika — dodaje i zdejmuje go przełącznik.">
<title>Dwa przełączniki SW1 i SW2 połączone łączem trunk 802.1Q przenoszącym VLAN 10 i 20 ze znacznikami VID 10 i VID 20 oraz ramki bez znacznika w native VLAN; do każdego przełącznika podłączone są dwa komputery na portach access w VLAN 10 i VLAN 20. Host na porcie access nie widzi znacznika — dodaje i zdejmuje go przełącznik.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Porty access i trunk: gdzie znacznik się pojawia, a gdzie znika</text><rect x="190" y="154" width="120" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="250" y="175" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">SW1</text><rect x="590" y="154" width="120" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="650" y="175" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">SW2</text><line x1="310" y1="170" x2="590" y2="170" stroke="#6a4c9c" stroke-width="6"/><text x="450" y="150" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">trunk 802.1Q (VLAN 10, 20)</text><rect x="330" y="184" width="110" height="26" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="385" y="202" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">tag VID 10</text><rect x="460" y="184" width="110" height="26" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="515" y="202" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">tag VID 20</text><rect x="395" y="216" width="110" height="26" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="450" y="234" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">bez tagu</text><text x="450" y="260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" text-anchor="middle" font-weight="700">↑ native VLAN (domyślnie 1)</text><line x1="250" y1="186" x2="120" y2="284" stroke="#c46a12" stroke-width="3"/><rect x="86" y="284" width="68" height="32" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="120" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">PC-A</text><text x="120" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">access VLAN 10</text><line x1="250" y1="186" x2="330" y2="284" stroke="#2e7d4f" stroke-width="3"/><rect x="296" y="284" width="68" height="32" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="330" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">PC-C</text><text x="330" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">access VLAN 20</text><line x1="650" y1="186" x2="570" y2="284" stroke="#c46a12" stroke-width="3"/><rect x="536" y="284" width="68" height="32" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="570" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">PC-B</text><text x="570" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">access VLAN 10</text><line x1="650" y1="186" x2="780" y2="284" stroke="#2e7d4f" stroke-width="3"/><rect x="746" y="284" width="68" height="32" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="780" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">PC-D</text><text x="780" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">access VLAN 20</text><text x="450" y="372" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Host na porcie access wysyła i odbiera ramki BEZ znacznika — tag dodaje i zdejmuje przełącznik.</text>
</svg>
