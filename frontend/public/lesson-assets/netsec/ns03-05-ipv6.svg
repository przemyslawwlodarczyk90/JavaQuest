<title>Adres 2001:0db8:abcd:0012:0000:0000:0000:0001 podzielony na grupy: pierwsze dwie grupy to prefiks /32 dostawcy, trzecia dopełnia /48 lokalizacji, czwarta wybiera podsieć /64, ostatnie cztery grupy to identyfikator interfejsu. /48 mieści 65 536 podsieci /64 lub 256 podsieci /56; /56 mieści 256 podsieci /64.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">IPv6: liczy się w grupach po 4 bity (cyfrach hex), a LAN to zawsze /64</text><rect x="60" y="56" width="92" height="40" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="106" y="82" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">2001</text><text x="106" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">0–15</text><rect x="160" y="56" width="92" height="40" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="206" y="82" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">0db8</text><text x="206" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">16–31</text><rect x="260" y="56" width="92" height="40" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="306" y="82" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">abcd</text><text x="306" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">32–47</text><rect x="360" y="56" width="92" height="40" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="406" y="82" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">0012</text><text x="406" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">48–63</text><rect x="460" y="56" width="92" height="40" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="506" y="82" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">0000</text><text x="506" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">64–79</text><rect x="560" y="56" width="92" height="40" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="606" y="82" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">0000</text><text x="606" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">80–95</text><rect x="660" y="56" width="92" height="40" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="706" y="82" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">0000</text><text x="706" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">96–111</text><rect x="760" y="56" width="92" height="40" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="806" y="82" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">0001</text><text x="806" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">112–127</text><line x1="64" y1="128" x2="248" y2="128" stroke="#6a4c9c" stroke-width="3"/><text x="156" y="146" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">/32 — dostawca (RIR → ISP)</text><line x1="264" y1="128" x2="348" y2="128" stroke="#2f6fb3" stroke-width="3"/><text x="306" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2f6fb3" text-anchor="middle" font-weight="700">/48 — lokalizacja</text><line x1="364" y1="128" x2="448" y2="128" stroke="#2e7d4f" stroke-width="3"/><text x="406" y="146" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">/64 — podsieć</text><line x1="464" y1="128" x2="848" y2="128" stroke="#c46a12" stroke-width="3"/><text x="656" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">identyfikator interfejsu (64 bity)</text><rect x="40" y="180" width="820" height="200" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="208" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">/48 → /64: 65 536 podsieci (4. grupa: 0000–ffff)</text><text x="60" y="236" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">/48 → /56: 256 podsieci (np. dla klientów lub budynków), każda /56 → 256 × /64</text><text x="60" y="264" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">/56 → /64: 256 podsieci — tyle typowo dostaje klient domowy</text><text x="60" y="292" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">podsieć nr 18 (0x12) /64 w 2001:db8:abcd::/48 → 2001:db8:abcd:12::/64</text><text x="60" y="320" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">podsieć nr 3 /56 w 2001:db8:abcd::/48 → 2001:db8:abcd:300::/56</text><text x="60" y="348" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" font-weight="700">Granica na pełnej cyfrze hex (wielokrotność 4 bitów) = liczenie bez binarnego: /52, /56, /60, /64.</text>
</svg>
