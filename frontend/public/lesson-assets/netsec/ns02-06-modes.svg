<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Hierarchia trybów Cisco IOS: User EXEC ze znakiem SW1&gt;, polecenie enable przechodzi do Privileged EXEC SW1#, configure terminal do trybu konfiguracji globalnej SW1(config)#, a z niego do podtrybów interfejsu, linii vty, VLAN-u i routera; exit cofa o poziom, end wraca do trybu uprzywilejowanego.">
<title>Hierarchia trybów Cisco IOS: User EXEC ze znakiem SW1&gt;, polecenie enable przechodzi do Privileged EXEC SW1#, configure terminal do trybu konfiguracji globalnej SW1(config)#, a z niego do podtrybów interfejsu, linii vty, VLAN-u i routera; exit cofa o poziom, end wraca do trybu uprzywilejowanego.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Tryby Cisco IOS: znak zachęty mówi, gdzie jesteś</text><rect x="250" y="60" width="400" height="64" rx="10" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="270" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#1f1a14" font-weight="700">User EXEC</text><text x="630" y="86" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1f1a14" text-anchor="end" font-weight="700">SW1&gt;</text><text x="270" y="110" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">podgląd: ping, show (ograniczone)</text><rect x="250" y="150" width="400" height="64" rx="10" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="270" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2f6fb3" font-weight="700">Privileged EXEC</text><text x="630" y="176" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1f1a14" text-anchor="end" font-weight="700">SW1#</text><text x="270" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">pełne show, debug, copy, reload</text><rect x="250" y="240" width="400" height="64" rx="10" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="270" y="266" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#c46a12" font-weight="700">Global configuration</text><text x="630" y="266" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1f1a14" text-anchor="end" font-weight="700">SW1(config)#</text><text x="270" y="290" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">hostname, enable secret, vlan, ip route</text><line x1="450" y1="124" x2="450" y2="150" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="462" y="142" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2e7d4f" font-weight="700">enable</text><line x1="450" y1="214" x2="450" y2="240" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="462" y="232" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2e7d4f" font-weight="700">configure terminal</text><text x="240" y="142" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#b23b3b" text-anchor="end" font-weight="700">disable</text><text x="240" y="232" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#b23b3b" text-anchor="end" font-weight="700">end / Ctrl+Z</text><line x1="450" y1="304" x2="140" y2="344" stroke="#6a4c9c" stroke-width="2"/><rect x="40" y="346" width="200" height="56" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="140" y="368" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">interface Gi1/0/1</text><text x="140" y="390" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6a4c9c" text-anchor="middle">SW1(config-if)#</text><line x1="450" y1="304" x2="350" y2="344" stroke="#6a4c9c" stroke-width="2"/><rect x="250" y="346" width="200" height="56" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="350" y="368" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">line vty 0 15</text><text x="350" y="390" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6a4c9c" text-anchor="middle">SW1(config-line)#</text><line x1="450" y1="304" x2="560" y2="344" stroke="#6a4c9c" stroke-width="2"/><rect x="460" y="346" width="200" height="56" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="560" y="368" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">vlan 10</text><text x="560" y="390" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6a4c9c" text-anchor="middle">SW1(config-vlan)#</text><line x1="450" y1="304" x2="770" y2="344" stroke="#6a4c9c" stroke-width="2"/><rect x="670" y="346" width="200" height="56" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="770" y="368" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">router ospf 1</text><text x="770" y="390" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6a4c9c" text-anchor="middle">R1(config-router)#</text><text x="450" y="426" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">exit — poziom w górę · end — prosto do SW1# · do &lt;polecenie EXEC&gt; — show z trybu konfiguracji</text>
</svg>
