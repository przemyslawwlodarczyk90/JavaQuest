<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Ramka LLDP: MAC docelowy 01:80:c2:00:00:0e, MAC źródłowy, EtherType 0x88CC, obowiązkowe TLV Chassis ID, Port ID i TTL, opcjonalne TLV 4–127 i TLV End. Nagłówek TLV ma 7 bitów typu i 9 bitów długości; przykład: System Name o długości 13 bajtów ma nagłówek 0x0A0D, TTL 120 sekund nagłówek 0x0602.">
<title>Ramka LLDP: MAC docelowy 01:80:c2:00:00:0e, MAC źródłowy, EtherType 0x88CC, obowiązkowe TLV Chassis ID, Port ID i TTL, opcjonalne TLV 4–127 i TLV End. Nagłówek TLV ma 7 bitów typu i 9 bitów długości; przykład: System Name o długości 13 bajtów ma nagłówek 0x0A0D, TTL 120 sekund nagłówek 0x0602.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Ramka LLDP: lista TLV (typ · długość · wartość)</text><rect x="20" y="60" width="107" height="54" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="75" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">MAC dst</text><text x="75" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">01:80:c2:00:00:0e</text><rect x="130" y="60" width="107" height="54" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="185" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">MAC src</text><text x="185" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">MAC portu</text><rect x="240" y="60" width="87" height="54" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="285" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">EtherType</text><text x="285" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">0x88CC</text><rect x="330" y="60" width="127" height="54" rx="4" fill="#dcefe3" stroke="#1f1a14" stroke-width="1.5"/><text x="395" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">TLV 1 Chassis ID</text><text x="395" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">obowiązkowe</text><rect x="460" y="60" width="107" height="54" rx="4" fill="#dcefe3" stroke="#1f1a14" stroke-width="1.5"/><text x="515" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">TLV 2 Port ID</text><text x="515" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">obowiązkowe</text><rect x="570" y="60" width="87" height="54" rx="4" fill="#dcefe3" stroke="#1f1a14" stroke-width="1.5"/><text x="615" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">TLV 3 TTL</text><text x="615" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">obowiązkowe</text><rect x="660" y="60" width="107" height="54" rx="4" fill="#e9e1f5" stroke="#1f1a14" stroke-width="1.5"/><text x="715" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">TLV 4…127</text><text x="715" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">opcjonalne</text><rect x="770" y="60" width="67" height="54" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="805" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">TLV 0 End</text><text x="805" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle"></text><rect x="120" y="150" width="660" height="60" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><rect x="120" y="150" width="150" height="60" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="195" y="175" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">typ</text><text x="195" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">7 bitów (0–127)</text><rect x="270" y="150" width="190" height="60" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="365" y="175" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">długość</text><text x="365" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">9 bitów (0–511 B)</text><text x="620" y="175" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">wartość</text><text x="620" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">„długość” bajtów</text><text x="450" y="236" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">Nagłówek TLV = 2 bajty: (typ &lt;&lt; 9) | długość</text><rect x="40" y="256" width="820" height="106" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="280" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">Przykład: System Name „SW-WAW-ACC-01” (13 B): typ 5 → (5 &lt;&lt; 9) | 13 = 0x0A0D</text><text x="60" y="302" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">TTL 120 s (2 B): typ 3 → (3 &lt;&lt; 9) | 2 = 0x0602, wartość 0x0078</text><text x="60" y="324" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">TLV 127 (organizacyjne): OUI 00-80-C2 (802.1: VLAN), 00-12-0F (802.3: MAC/PHY, PoE), 00-12-BB (LLDP-MED)</text><text x="60" y="346" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">Ten sam format TLV zobaczysz w wielu protokołach (BGP, RADIUS, TLS) — warto go rozpoznawać.</text>
</svg>
