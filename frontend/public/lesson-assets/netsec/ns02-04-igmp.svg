="#2e7d4f" stroke-width="1.5"/><text x="560" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">H3</text><text x="560" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">IGMP join 239.1.1.1</text><line x1="450" y1="206" x2="720" y2="284" stroke="#d9d0c3" stroke-width="1" stroke-dasharray="6 5"/><circle cx="720" cy="300" r="18" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="720" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">H4</text><text x="720" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">nie zapisany</text><text x="610" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c">Membership Query (co ~125 s)</text><text x="450" y="372" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Strumień do 239.1.1.1 trafia tylko do H1 i H3; bez snoopingu przełącznik zalałby nim wszystkie porty.</text>
