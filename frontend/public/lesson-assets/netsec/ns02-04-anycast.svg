<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Trzy lokalizacje resolvera DNS we Frankfurcie, Warszawie i Londynie z tym samym adresem IP; użytkownicy z Krakowa, Paryża i Dublina trafiają do najbliższej lokalizacji wybranej przez routing BGP">
<title>Trzy lokalizacje resolvera DNS we Frankfurcie, Warszawie i Londynie z tym samym adresem IP; użytkownicy z Krakowa, Paryża i Dublina trafiają do najbliższej lokalizacji wybranej przez routing BGP</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Anycast: ten sam adres w wielu miejscach, BGP wybiera najbliższe</text><rect x="120" y="94" width="160" height="52" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="200" y="116" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">resolver Frankfurt</text><text x="200" y="134" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">9.9.9.9 (ten sam!)</text><rect x="370" y="64" width="160" height="52" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="450" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">resolver Warszawa</text><text x="450" y="104" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">9.9.9.9 (ten sam!)</text><rect x="620" y="94" width="160" height="52" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="700" y="116" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">resolver Londyn</text><text x="700" y="134" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">9.9.9.9 (ten sam!)</text><rect x="360" y="268" width="180" height="44" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="450" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">użytkownik w Krakowie</text><line x1="450" y1="266" x2="450" y2="118" stroke="#2e7d4f" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="268" width="180" height="44" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="200" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">użytkownik w Paryżu</text><line x1="200" y1="266" x2="200" y2="148" stroke="#2e7d4f" stroke-width="3" marker-end="url(#arr)"/><rect x="610" y="268" width="180" height="44" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="700" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">użytkownik w Dublinie</text><line x1="700" y1="266" x2="700" y2="148" stroke="#2e7d4f" stroke-width="3" marker-end="url(#arr)"/><text x="450" y="352" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Zastosowania: serwery główne DNS, publiczne resolvery, CDN, ochrona przed DDoS (atak rozkłada się na wiele lokalizacji).</text>
</svg>
