<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Dwa panele: po lewej objawy ARP spoofingu u ofiary — zmiana MAC bramy w cache, seria niezamówionych odpowiedzi ARP i ostrzeżenie Wiresharka o zduplikowanym użyciu adresu; po prawej wykrywanie i obrona: DHCP snooping, Dynamic ARP Inspection, arpwatch i Zeek, IDS, statyczne wpisy, 802.1X i TLS; pod spodem odpowiedniki dla IPv6: RA Guard i ND Inspection">
<title>Dwa panele: po lewej objawy ARP spoofingu u ofiary — zmiana MAC bramy w cache, seria niezamówionych odpowiedzi ARP i ostrzeżenie Wiresharka o zduplikowanym użyciu adresu; po prawej wykrywanie i obrona: DHCP snooping, Dynamic ARP Inspection, arpwatch i Zeek, IDS, statyczne wpisy, 802.1X i TLS; pod spodem odpowiedniki dla IPv6: RA Guard i ND Inspection</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">ARP spoofing: jak go zobaczyć i zatrzymać</text><rect x="30" y="56" width="400" height="230" rx="10" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="230" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">Co widzi ofiara</text><text x="46" y="108" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">przed:  192.168.1.1 → 00:1a:2b:3c:4d:5e (brama)</text><text x="46" y="130" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">po:     192.168.1.1 → 66:77:88:99:aa:bb (napastnik)</text><text x="46" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14"></text><text x="46" y="174" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">w przechwyceniu: seria niezamówionych ARP Reply</text><text x="46" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">„192.168.1.1 is-at 66:77:…” co kilka sekund</text><text x="46" y="218" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14"></text><text x="46" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Wireshark Expert Info:</text><text x="46" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">„duplicate use of 192.168.1.1 detected!”</text><rect x="470" y="56" width="400" height="230" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="670" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Wykrywanie i obrona</text><text x="486" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">DHCP snooping — tablica wiązań IP ↔ MAC ↔ port</text><text x="486" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Dynamic ARP Inspection (DAI) — odrzuca ARP</text><text x="486" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">   niezgodne z tablicą wiązań</text><text x="486" y="174" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">arpwatch / Zeek — alert na zmianę MAC bramy</text><text x="486" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IDS (Suricata) — reguły na anomalie ARP</text><text x="486" y="218" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">statyczny wpis ARP bramy na krytycznych hostach</text><text x="486" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">802.1X — tylko uwierzytelnione urządzenia w sieci</text><text x="486" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">TLS wszędzie — MITM nie odczyta ani nie zmieni treści</text><text x="450" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">IPv6: odpowiednik to fałszywe Neighbor Advertisement i Router Advertisement (rogue RA)</text><text x="450" y="344" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">→ obrona: RA Guard, ND Inspection / SAVI, DHCPv6 Guard na przełącznikach</text><text x="450" y="384" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Ćwiczenie ataku tylko między kontenerami w izolowanym labie (rozdział 20) — tu uczymy się śladów i kontroli.</text>
</svg>
