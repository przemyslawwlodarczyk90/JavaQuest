<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="Tabela domyślnej polityki RFC 6724: ::1 precedence 50, ::/0 (IPv6) 40, ::ffff:0:0/96 (IPv4) 35, 6to4 30, Teredo 5, ULA 3. Reguły: unikanie nieosiągalnych, zgodny zakres, wyższa precedence, najdłuższy wspólny prefiks. Konfiguracja: /etc/gai.conf i netsh prefixpolicies.">
<title>Tabela domyślnej polityki RFC 6724: ::1 precedence 50, ::/0 (IPv6) 40, ::ffff:0:0/96 (IPv4) 35, 6to4 30, Teredo 5, ULA 3. Reguły: unikanie nieosiągalnych, zgodny zakres, wyższa precedence, najdłuższy wspólny prefiks. Konfiguracja: /etc/gai.conf i netsh prefixpolicies.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="390" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">Wybór adresu docelowego (RFC 6724) — dlaczego system „woli” IPv6, a czasem IPv4</text><text x="60" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" font-weight="700">prefiks</text><text x="240" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" font-weight="700">precedence</text><text x="360" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" font-weight="700">rodzaj</text><rect x="40" y="68" width="520" height="24" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="86" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">::1/128</text><text x="240" y="86" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">50</text><text x="360" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">loopback</text><rect x="40" y="94" width="520" height="24" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="112" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">::/0</text><text x="240" y="112" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">40</text><text x="360" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IPv6 (GUA)</text><rect x="40" y="120" width="520" height="24" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="138" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">::ffff:0:0/96</text><text x="240" y="138" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">35</text><text x="360" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IPv4 (mapowane)</text><rect x="40" y="146" width="520" height="24" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="164" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">2002::/16</text><text x="240" y="164" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">30</text><text x="360" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">6to4</text><rect x="40" y="172" width="520" height="24" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="190" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">2001::/32</text><text x="240" y="190" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">5</text><text x="360" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Teredo</text><rect x="40" y="198" width="520" height="24" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="216" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">fc00::/7</text><text x="240" y="216" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">3</text><text x="360" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">ULA</text><rect x="40" y="224" width="520" height="24" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="242" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">::/96</text><text x="240" y="242" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">1</text><text x="360" y="242" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IPv4-compatible (przestarzałe)</text><rect x="580" y="50" width="280" height="210" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="596" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">Najważniejsze reguły:</text><text x="596" y="97" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• unikaj adresów nieosiągalnych</text><text x="596" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• preferuj zgodny zakres (scope)</text><text x="596" y="139" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• preferuj wyższą precedence</text><text x="596" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">  (IPv6 GUA 40 &gt; IPv4 35)</text><text x="596" y="181" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• preferuj najdłuższy wspólny</text><text x="596" y="202" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">  prefiks ze źródłem</text><text x="596" y="223" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Linux: /etc/gai.conf</text><text x="596" y="244" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Windows: netsh int ipv6 show prefixpolicies</text><text x="40" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Skutek: gdy nazwa ma AAAA (GUA) i A, system próbuje najpierw IPv6. Gdy AAAA wskazuje ULA, a A — IPv4, wybierze IPv4 (3 &lt; 35).</text><text x="40" y="324" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Zmiana polityki (np. preferuj IPv4): w gai.conf „precedence ::ffff:0:0/96 100” — to obejście, nie naprawa zepsutego IPv6.</text><text x="40" y="352" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">Właściwa naprawa: działające IPv6 albo brak AAAA; po stronie klienta — Happy Eyeballs i krótkie timeouty.</text>
</svg>
