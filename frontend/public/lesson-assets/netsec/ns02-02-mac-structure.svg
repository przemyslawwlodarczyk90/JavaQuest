<title>Adres MAC 3C:52:82:1A:F0:07 podzielony na OUI producenta i numer karty; pierwszy bajt rozpisany bitowo z zaznaczonymi bitami U/L i I/G oraz opisem ich znaczenia i przykładami adresów</title>
