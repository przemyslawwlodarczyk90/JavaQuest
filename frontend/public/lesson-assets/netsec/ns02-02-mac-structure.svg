"700">OUI — identyfikator producenta (24 bity)</text><text x="585" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" text-anchor="middle" font-weight="700">numer karty nadany przez producenta (24 bity)</text><text x="150" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">pierwszy bajt 0x3C =</text><rect x="320" y="158" width="38" height="38" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="339" y="183" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#1f1a14" text-anchor="middle">0</text><rect x="364" y="158" width="38" height="38" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="383" y="183" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#1f1a14" text-anchor="middle">0</text><rect x="408" y="158" width="38" height="38" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="427" y="183" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#1f1a14" text-anchor="middle">1</text><rect x="452" y="158" width="38" height="38" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="471" y="183" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#1f1a14" text-anchor="middle">1</text><rect x="496" y="158" width="38" height="38" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="515" y="183" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#1f1a14" text-anchor="middle">1</text><rect x="540" y="158" width="38" height="38" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="559" y="183" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#1f1a14" text-anchor="middle">1</text><rect x="584" y="158" width="38" height="38" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="603" y="183" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#6a4c9c" text-anchor="middle" font-weight="700">0</text><rect x="628" y="158" width="38" height="38" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="647" y="183" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#6a4c9c" text-anchor="middle" font-weight="700">0</text><text x="603" y="218" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">U/L</text><text x="647" y="218" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">I/G</text><rect x="40" y="240" width="820" height="140" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="56" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">bit I/G (najmłodszy bit 1. bajtu)</text><text x="330" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">0 = unicast (jedna karta), 1 = grupowy (multicast/broadcast)</text><text x="56" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">bit U/L (drugi najmłodszy)</text><text x="330" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">0 = globalnie unikalny (nadany przez producenta), 1 = lokalnie administrowany</text><text x="56" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">przykłady</text><text x="330" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">02:42:… Docker (lokalny), 33:33:… multicast IPv6, 01:00:5e:… multicast IPv4, ff:ff:ff:ff:ff:ff broadcast</text><text x="56" y="358" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">losowe MAC</text><text x="330" y="358" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Android, iOS, Windows i macOS dla Wi-Fi: lokalnie administrowane (bit U/L = 1), inne w każdej sieci</text>
</svg>
