<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Datagram 4000 bajtów z 3980 bajtami danych dzielony na trzy fragmenty dla MTU 1500: 1480 bajtów danych z offsetem 0, 1480 bajtów z offsetem 185 i 1020 bajtów z offsetem 370; MF=1 w dwóch pierwszych. Offset w jednostkach 8 bajtów, składa odbiorca.">
<title>Datagram 4000 bajtów z 3980 bajtami danych dzielony na trzy fragmenty dla MTU 1500: 1480 bajtów danych z offsetem 0, 1480 bajtów z offsetem 185 i 1020 bajtów z offsetem 370; MF=1 w dwóch pierwszych. Offset w jednostkach 8 bajtów, składa odbiorca.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Fragmentacja IPv4: datagram 4000 B przez łącze o MTU 1500</text><rect x="60" y="56" width="780" height="40" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="450" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">dane 3980 B (Total Length 4000 = 20 B nagłówka + 3980 B)</text><rect x="60" y="120" width="288.0502512562814" height="46" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="205.0251256281407" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">fragment 1</text><rect x="60" y="200" width="780" height="32" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="76" y="221" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">fragment 1: Total Length 1500, dane 1480 B, Fragment Offset 0 (= 0 B), MF=1, to samo ID</text><rect x="350.0502512562814" y="120" width="288.0502512562814" height="46" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="495.0753768844221" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">fragment 2</text><rect x="60" y="238" width="780" height="32" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="76" y="259" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">fragment 2: Total Length 1500, dane 1480 B, Fragment Offset 185 (= 1480 B), MF=1, to samo ID</text><rect x="640.1005025125628" y="120" width="197.8994974874372" height="46" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="740.0502512562814" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">fragment 3</text><rect x="60" y="276" width="780" height="32" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="76" y="297" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">fragment 3: Total Length 1040, dane 1020 B, Fragment Offset 370 (= 2960 B), MF=0, to samo ID</text><text x="60" y="330" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Offset w jednostkach 8 B → dane w każdym fragmencie (poza ostatnim) to wielokrotność 8: (1500 − 20) = 1480 = 185 × 8.</text><text x="60" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Składa zawsze ODBIORCA (nie routery po drodze). Utrata jednego fragmentu = utrata całego datagramu.</text>
</svg>
