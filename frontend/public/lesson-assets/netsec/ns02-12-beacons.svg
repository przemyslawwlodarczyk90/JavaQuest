<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Wykres słupkowy narzutu beaconów na czas antenowy dla różnych liczb SSID i słyszalnych AP: przy prędkości podstawowej 1 Mb/s narzut rośnie od 2,8% dla jednego SSID i jednego AP do 89% dla 8 SSID i 4 AP, przy 24 Mb/s pozostaje rzędu pojedynczych procent. Wniosek: ograniczać liczbę SSID i wyłączać najniższe prędkości.">
<title>Wykres słupkowy narzutu beaconów na czas antenowy dla różnych liczb SSID i słyszalnych AP: przy prędkości podstawowej 1 Mb/s narzut rośnie od 2,8% dla jednego SSID i jednego AP do 89% dla 8 SSID i 4 AP, przy 24 Mb/s pozostaje rzędu pojedynczych procent. Wniosek: ograniczać liczbę SSID i wyłączać najniższe prędkości.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">Każdy SSID to beacon co 102,4 ms z każdego AP — przy niskiej prędkości to dużo</text><text x="40" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">1 SSID × 1 AP w zasięgu</text><rect x="220" y="68" width="16.799999999999997" height="16" rx="2" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="242.8" y="81" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">2.8% (1 Mb/s)</text><rect x="220" y="86" width="2" height="12" rx="2" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="228" y="97" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f">0.2% (24 Mb/s)</text><text x="40" y="128" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">3 SSID × 1 AP w zasięgu</text><rect x="220" y="110" width="49.800000000000004" height="16" rx="2" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="275.8" y="123" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">8.3% (1 Mb/s)</text><rect x="220" y="128" width="3" height="12" rx="2" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="229" y="139" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f">0.5% (24 Mb/s)</text><text x="40" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">5 SSID × 1 AP w zasięgu</text><rect x="220" y="152" width="83.4" height="16" rx="2" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="309.4" y="165" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">13.9% (1 Mb/s)</text><rect x="220" y="170" width="4.8" height="12" rx="2" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="230.8" y="181" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f">0.8% (24 Mb/s)</text><text x="40" y="212" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">3 SSID × 3 AP w zasięgu</text><rect x="220" y="194" width="150" height="16" rx="2" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="376" y="207" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">25% (1 Mb/s)</text><rect x="220" y="212" width="9" height="12" rx="2" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="235" y="223" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f">1.5% (24 Mb/s)</text><text x="40" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">5 SSID × 3 AP w zasięgu</text><rect x="220" y="236" width="250.20000000000002" height="16" rx="2" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="476.20000000000005" y="249" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">41.7% (1 Mb/s)</text><rect x="220" y="254" width="14.4" height="12" rx="2" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="240.4" y="265" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f">2.4% (24 Mb/s)</text><text x="40" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">8 SSID × 4 AP w zasięgu</text><rect x="220" y="278" width="534.5999999999999" height="16" rx="2" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="760.5999999999999" y="291" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">89.1% (1 Mb/s)</text><rect x="220" y="296" width="31.200000000000003" height="12" rx="2" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="257.2" y="307" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f">5.2% (24 Mb/s)</text><rect x="40" y="318" width="820" height="50" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Model: beacon 350 B, ~9,77 beaconu/s na SSID na AP, + 50 µs narzutu. Wyłączenie najniższych prędkości</text><text x="60" y="360" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">i ograniczenie liczby SSID zwracają czas antenowy klientom. Powyżej 100% kanał jest nasycony samymi beaconami.</text>
</svg>
