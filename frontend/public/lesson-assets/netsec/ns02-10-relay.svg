<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Klient w VLAN 10 wysyła broadcast DHCP do routera z funkcją relay (ip helper-address 10.20.0.2), który przekazuje go unicastem do serwera DHCP w VLAN 20 i zwraca odpowiedź. Pole giaddr 10.10.0.1 wskazuje serwerowi pulę, opcja 82 dodaje port i VLAN klienta.">
<title>Klient w VLAN 10 wysyła broadcast DHCP do routera z funkcją relay (ip helper-address 10.20.0.2), który przekazuje go unicastem do serwera DHCP w VLAN 20 i zwraca odpowiedź. Pole giaddr 10.10.0.1 wskazuje serwerowi pulę, opcja 82 dodaje port i VLAN klienta.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="360" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">DHCP relay: broadcast nie przejdzie przez router, więc router go przekazuje</text><rect x="40" y="120" width="170" height="60" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="125" y="146" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">klient</text><text x="125" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">VLAN 10</text><rect x="340" y="110" width="220" height="80" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="450" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">router / L3 (relay)</text><text x="450" y="158" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">Vlan10: 10.10.0.1</text><text x="450" y="176" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">ip helper-address 10.20.0.2</text><rect x="690" y="120" width="170" height="60" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="775" y="146" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">serwer DHCP</text><text x="775" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">10.20.0.2 (VLAN 20)</text><line x1="212" y1="140" x2="338" y2="140" stroke="#c46a12" stroke-width="2" marker-end="url(#arr)"/><text x="275" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">broadcast</text><line x1="562" y1="140" x2="688" y2="140" stroke="#6a4c9c" stroke-width="2" marker-end="url(#arr)"/><text x="625" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">unicast</text><line x1="688" y1="165" x2="562" y2="165" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><line x1="338" y1="165" x2="212" y2="165" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="220" width="780" height="120" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="80" y="246" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">giaddr = 10.10.0.1 → serwer wybiera pulę 10.10.0.0/24 (z której podsieci przyszło żądanie).</text><text x="80" y="270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Opcja 82 (Relay Agent Information): przełącznik/relay dopisuje port i VLAN klienta — pula, polityka, ślad audytowy.</text><text x="80" y="294" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Jeden serwer (lub para z failoverem) obsługuje setki VLAN-ów; firewall musi przepuszczać UDP 67/68 między relay a serwerem.</text><text x="80" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">IPv6: DHCPv6 relay (ipv6 dhcp relay destination), multicast ff02::1:2 na łączu klienta.</text>
</svg>
