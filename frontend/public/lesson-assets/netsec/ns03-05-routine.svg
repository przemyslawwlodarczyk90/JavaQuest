<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Plan treningu w czterech rundach: bez limitu czasu ze 100% poprawności, 30 sekund na zadanie, 15 sekund z agregacją i VLSM, egzaminacyjna mieszanka z IPv6. Dziennik typowych błędów: zły oktet, broadcast mylony z następną siecią, brak odejmowania dwóch hostów, niewyrównany blok, zbyt szeroki agregat. Kalkulator dopiero po odpowiedzi.">
<title>Plan treningu w czterech rundach: bez limitu czasu ze 100% poprawności, 30 sekund na zadanie, 15 sekund z agregacją i VLSM, egzaminacyjna mieszanka z IPv6. Dziennik typowych błędów: zły oktet, broadcast mylony z następną siecią, brak odejmowania dwóch hostów, niewyrównany blok, zbyt szeroki agregat. Kalkulator dopiero po odpowiedzi.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="360" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Jak trenować: tempo, poprawność i dziennik błędów</text><rect x="40" y="56" width="196" height="150" rx="10" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="138" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#2f6fb3" text-anchor="middle" font-weight="700">Runda 1</text><text x="138" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">bez limitu czasu</text><text x="138" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">przynależność, hosty, maski</text><text x="138" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">cel: 100% poprawnie</text><line x1="238" y1="131" x2="248" y2="131" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="250" y="56" width="196" height="150" rx="10" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="348" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#c46a12" text-anchor="middle" font-weight="700">Runda 2</text><text x="348" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">30 s / zadanie</text><text x="348" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">+ podział i nakładanie</text><text x="348" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">cel: ≥ 90%</text><line x1="448" y1="131" x2="458" y2="131" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="460" y="56" width="196" height="150" rx="10" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="558" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#6a4c9c" text-anchor="middle" font-weight="700">Runda 3</text><text x="558" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">15 s / zadanie</text><text x="558" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">+ agregacja i VLSM</text><text x="558" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">cel: ≥ 90%</text><line x1="658" y1="131" x2="668" y2="131" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="670" y="56" width="196" height="150" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="768" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#2e7d4f" text-anchor="middle" font-weight="700">Egzamin</text><text x="768" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">≤ 1 min na trudne</text><text x="768" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">mieszanka + IPv6</text><text x="768" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">cel: odruch</text><rect x="40" y="226" width="820" height="116" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">Dziennik błędów — po każdej rundzie zapisz, CO pomyliłeś, nie tylko ile:</text><text x="60" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• zły oktet (liczysz w 4., a prefiks kończy się w 3.)   • broadcast = następna sieć zamiast −1</text><text x="60" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• hosty bez −2 (albo −2 w AWS zamiast −5)   • blok niewyrównany (/20 od .8.0)   • agregat obejmuje cudze sieci</text><text x="60" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Kalkulator (ipcalc, Python ipaddress) — dopiero PO odpowiedzi, jako sędzia, nigdy zamiast liczenia.</text>
</svg>
