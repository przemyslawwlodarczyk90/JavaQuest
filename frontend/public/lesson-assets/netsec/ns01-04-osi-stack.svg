<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Siedem warstw modelu OSI z jednostkami danych, przykładowymi protokołami i urządzeniami">
<title>Siedem warstw modelu OSI z jednostkami danych, przykładowymi protokołami i urządzeniami</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Model OSI: siedem warstw, PDU, protokoły i urządzenia</text><text x="38" y="70" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">Warstwa</text><text x="208" y="70" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">PDU</text><text x="388" y="70" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">Przykłady</text><text x="688" y="70" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">Urządzenia / elementy</text><rect x="30" y="82" width="840" height="48" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="46" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#6a4c9c" font-weight="700">7</text><text x="72" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#6a4c9c" font-weight="700">Aplikacji</text><text x="208" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">dane / wiadomość</text><text x="388" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">HTTP, DNS, SMTP, SSH, DHCP, SNMP</text><text x="688" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">reverse proxy, WAF, API gateway</text><rect x="30" y="138" width="840" height="48" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="46" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#6a4c9c" font-weight="700">6</text><text x="72" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#6a4c9c" font-weight="700">Prezentacji</text><text x="208" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">dane</text><text x="388" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">TLS*, kodowanie znaków, kompresja, JSON/JPEG</text><text x="688" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">terminator TLS</text><rect x="30" y="194" width="840" height="48" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="46" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#6a4c9c" font-weight="700">5</text><text x="72" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#6a4c9c" font-weight="700">Sesji</text><text x="208" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">dane</text><text x="388" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">sesje RPC, NetBIOS, SOCKS, zarządzanie dialogiem</text><text x="688" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">—</text><rect x="30" y="250" width="840" height="48" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="46" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#2e7d4f" font-weight="700">4</text><text x="72" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2e7d4f" font-weight="700">Transportowa</text><text x="208" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">segment / datagram</text><text x="388" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">TCP, UDP, QUIC*; porty</text><text x="688" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">firewall stanowy, load balancer L4</text><rect x="30" y="306" width="840" height="48" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="46" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#2f6fb3" font-weight="700">3</text><text x="72" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2f6fb3" font-weight="700">Sieciowa</text><text x="208" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">pakiet</text><text x="388" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">IPv4, IPv6, ICMP, IPsec, OSPF</text><text x="688" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">router, przełącznik L3</text><rect x="30" y="362" width="840" height="48" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="46" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#c46a12" font-weight="700">2</text><text x="72" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#c46a12" font-weight="700">Łącza danych</text><text x="208" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">ramka</text><text x="388" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Ethernet (MAC), 802.11, ARP, VLAN 802.1Q, PPP</text><text x="688" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">przełącznik, AP, karta NIC</text><rect x="30" y="418" width="840" height="48" rx="8" fill="#ece7df" stroke="#6b6257" stroke-width="1.5"/><text x="46" y="448" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#6b6257" font-weight="700">1</text><text x="72" y="448" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#6b6257" font-weight="700">Fizyczna</text><text x="208" y="448" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">bity / symbole</text><text x="388" y="448" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">skrętka, światłowód, radio; złącza, napięcia</text><text x="688" y="448" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">hub, repeater, kabel</text><text x="30" y="486" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">* TLS zwykle przypisuje się warstwie 6 (szyfrowanie, reprezentacja), choć działa nad TCP; QUIC łączy transport z TLS 1.3 nad UDP.</text><text x="30" y="506" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">Warstwy 5–7 w praktyce realizuje jedna aplikacja (np. Spring Boot + biblioteka TLS); 1–4 — system operacyjny i sprzęt.</text>
</svg>
