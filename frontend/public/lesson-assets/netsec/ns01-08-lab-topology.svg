<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Topologia labu: laptop w sieci lan, router z NAT między lan i wan, reverse proxy między wan i app oraz aplikacja Spring Boot w sieci app; punkty przechwytywania P1, P2 i P3">
<title>Topologia labu: laptop w sieci lan, router z NAT między lan i wan, reverse proxy między wan i app oraz aplikacja Spring Boot w sieci app; punkty przechwytywania P1, P2 i P3</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Lab „Packet Journey”: trzy sieci, trzy punkty przechwytywania</text><rect x="20" y="56" width="280" height="250" rx="12" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="160" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">lan 10.10.1.0/24</text><rect x="300" y="56" width="280" height="250" rx="12" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="440" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">wan 10.20.0.0/24</text><rect x="600" y="56" width="280" height="250" rx="12" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="740" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">app 10.30.0.0/24</text><rect x="35" y="146" width="150" height="68" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="110" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">laptop</text><text x="110" y="186" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">10.10.1.10</text><text x="110" y="202" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257" text-anchor="middle">brama 10.10.1.1</text><rect x="225" y="146" width="150" height="68" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="300" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">router + NAT</text><text x="300" y="186" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">10.10.1.1 | 10.20.0.2</text><text x="300" y="202" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257" text-anchor="middle">masquerade na eth1</text><rect x="525" y="146" width="150" height="68" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="600" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">reverse proxy</text><text x="600" y="186" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">10.20.0.10 | 10.30.0.10</text><text x="600" y="202" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257" text-anchor="middle">Caddy :80 → app:8080</text><rect x="725" y="146" width="150" height="68" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="800" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">Spring Boot</text><text x="800" y="186" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">10.30.0.20:8080</text><text x="800" y="202" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257" text-anchor="middle">GET /users/{id}</text><line x1="185" y1="180" x2="225" y2="180" stroke="#c46a12" stroke-width="3"/><line x1="375" y1="180" x2="525" y2="180" stroke="#2f6fb3" stroke-width="3"/><line x1="675" y1="180" x2="725" y2="180" stroke="#6a4c9c" stroke-width="3"/><circle cx="205" cy="150" r="14" fill="#b23b3b"/><text x="205" y="155" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">P1</text><circle cx="450" cy="150" r="14" fill="#b23b3b"/><text x="450" y="155" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">P2</text><circle cx="700" cy="150" r="14" fill="#b23b3b"/><text x="700" y="155" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">P3</text><text x="450" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">P1: przed NAT · P2: po NAT, przed proxy · P3: nowe połączenie proxy → aplikacja</text><text x="450" y="360" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Wszystkie sieci internal: true — lab nie ma wyjścia do Internetu; jedyna droga laptopa do aplikacji prowadzi przez router i proxy.</text><text x="450" y="382" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Zadanie: przechwycić ARP, ICMP i TCP/HTTP w P1, P2, P3 i wyjaśnić każdą zmianę adresów, portów i TTL.</text>
</svg>
