<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Topologia R1–R4 z łączami 1 Gb/s (R1–R2, R2–R4), 100 Mb/s (R1–R3, R3–R4) i 10 Mb/s (R2–R3). Przy domyślnej referencji 100 Mb/s łącza 1 Gb/s i 100 Mb/s mają koszt 1, więc R1 rozkłada ruch do R4 na dwie ścieżki (także wolną). Przy referencji 10 000 Mb/s koszty to 10 i 100, wybierana jest tylko ścieżka przez R2.">
<title>Topologia R1–R4 z łączami 1 Gb/s (R1–R2, R2–R4), 100 Mb/s (R1–R3, R3–R4) i 10 Mb/s (R2–R3). Przy domyślnej referencji 100 Mb/s łącza 1 Gb/s i 100 Mb/s mają koszt 1, więc R1 rozkłada ruch do R4 na dwie ścieżki (także wolną). Przy referencji 10 000 Mb/s koszty to 10 i 100, wybierana jest tylko ścieżka przez R2.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">Koszt OSPF = referencyjna przepustowość / przepustowość łącza — pułapka domyślnych 100 Mb/s</text><text x="230" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">auto-cost reference-bandwidth 100 (domyślnie)</text><line x1="90" y1="200" x2="230" y2="110" stroke="#2e7d4f" stroke-width="4"/><rect x="117.6" y="145" width="84.80000000000001" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="160" y="159" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">1G · koszt 1</text><line x1="230" y1="110" x2="370" y2="200" stroke="#2e7d4f" stroke-width="4"/><rect x="257.6" y="145" width="84.80000000000001" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="300" y="159" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">1G · koszt 1</text><line x1="90" y1="200" x2="230" y2="290" stroke="#2e7d4f" stroke-width="4"/><rect x="111.19999999999999" y="235" width="97.60000000000001" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="160" y="249" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">100M · koszt 1</text><line x1="230" y1="290" x2="370" y2="200" stroke="#2e7d4f" stroke-width="4"/><rect x="251.2" y="235" width="97.60000000000001" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="300" y="249" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">100M · koszt 1</text><line x1="230" y1="110" x2="230" y2="290" stroke="#d9d0c3" stroke-width="2"/><rect x="238" y="190" width="97.60000000000001" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="286.8" y="204" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle" font-weight="700">10M · koszt 10</text><rect x="62" y="182" width="56" height="36" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="90" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R1</text><rect x="202" y="92" width="56" height="36" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="230" y="115" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R2</text><rect x="202" y="272" width="56" height="36" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="230" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R3</text><rect x="342" y="182" width="56" height="36" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="370" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R4</text><text x="230" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">R1 → R4: R1→R2→R4  i  R1→R3→R4 (koszt 2)</text><text x="670" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">auto-cost reference-bandwidth 10000</text><line x1="530" y1="200" x2="670" y2="110" stroke="#2e7d4f" stroke-width="4"/><rect x="554.4" y="145" width="91.2" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="600" y="159" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">1G · koszt 10</text><line x1="670" y1="110" x2="810" y2="200" stroke="#2e7d4f" stroke-width="4"/><rect x="694.4" y="145" width="91.2" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="740" y="159" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">1G · koszt 10</text><line x1="530" y1="200" x2="670" y2="290" stroke="#d9d0c3" stroke-width="2"/><rect x="544.8" y="235" width="110.4" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="600" y="249" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle" font-weight="700">100M · koszt 100</text><line x1="670" y1="290" x2="810" y2="200" stroke="#d9d0c3" stroke-width="2"/><rect x="684.8" y="235" width="110.4" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="740" y="249" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle" font-weight="700">100M · koszt 100</text><line x1="670" y1="110" x2="670" y2="290" stroke="#d9d0c3" stroke-width="2"/><rect x="678" y="190" width="110.4" height="18" rx="4" fill="#fbf8f3" stroke="#fbf8f3" stroke-width="1.5"/><text x="733.2" y="204" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle" font-weight="700">10M · koszt 1000</text><rect x="502" y="182" width="56" height="36" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="530" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R1</text><rect x="642" y="92" width="56" height="36" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="670" y="115" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R2</text><rect x="642" y="272" width="56" height="36" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="670" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R3</text><rect x="782" y="182" width="56" height="36" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="810" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R4</text><text x="670" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">R1 → R4: R1→R2→R4 (koszt 20)</text><rect x="40" y="362" width="820" height="54" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="56" y="384" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Domyślnie wszystko ≥ 100 Mb/s ma koszt 1 (1G: 1, 10G: 1) → ECMP także przez wolne 100 Mb/s. Z referencją 10 Gb/s: 1G = 10, 100M = 100.</text><text x="56" y="404" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Ustaw tę samą referencję na WSZYSTKICH routerach obszaru (FRR/Cisco: auto-cost reference-bandwidth &lt;Mb/s&gt;).</text>
</svg>
