<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Oś czasu VRRP: master wysyła ogłoszenia co 1 sekundę; po ich ustaniu backup czeka Master_Down_Interval równy 3 sekundy plus skew 609.4 ms i staje się masterem, wysyłając gratuitous ARP. Przy ogłoszeniach co 100 ms przełączenie trwa ok. 361 ms. HSRP domyślnie do 10 s. Połączenia do VIP reverse proxy są zrywane.">
<title>Oś czasu VRRP: master wysyła ogłoszenia co 1 sekundę; po ich ustaniu backup czeka Master_Down_Interval równy 3 sekundy plus skew 609.4 ms i staje się masterem, wysyłając gratuitous ARP. Przy ogłoszeniach co 100 ms przełączenie trwa ok. 361 ms. HSRP domyślnie do 10 s. Połączenia do VIP reverse proxy są zrywane.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Ile trwa przełączenie VRRP i co widzi klient</text><line x1="60" y1="200" x2="840" y2="200" stroke="#1f1a14" stroke-width="2"/><text x="60" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">0 s</text><line x1="60" y1="195" x2="60" y2="205" stroke="#1f1a14" stroke-width="2"/><text x="216" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">1 s</text><line x1="216" y1="195" x2="216" y2="205" stroke="#1f1a14" stroke-width="2"/><text x="372" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">2 s</text><line x1="372" y1="195" x2="372" y2="205" stroke="#1f1a14" stroke-width="2"/><text x="528" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">3 s</text><line x1="528" y1="195" x2="528" y2="205" stroke="#1f1a14" stroke-width="2"/><text x="684" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">4 s</text><line x1="684" y1="195" x2="684" y2="205" stroke="#1f1a14" stroke-width="2"/><text x="840" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">5 s</text><line x1="840" y1="195" x2="840" y2="205" stroke="#1f1a14" stroke-width="2"/><line x1="60" y1="120" x2="60" y2="195" stroke="#2e7d4f" stroke-width="2"/><text x="64" y="116" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f">advert</text><line x1="216" y1="120" x2="216" y2="195" stroke="#2e7d4f" stroke-width="2"/><text x="220" y="116" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f">advert</text><text x="60" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" font-weight="700">ogłoszenia mastera (ostatnie w 1 s, potem awaria)</text><rect x="216" y="140" width="563.0663999999999" height="40" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="497.53319999999997" y="165" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">Master_Down_Interval = 3 × 1 s + skew 609,4 ms = 3609,4 ms</text><line x1="779.0663999999999" y1="120" x2="779.0663999999999" y2="195" stroke="#6a4c9c" stroke-width="3"/><text x="773.0663999999999" y="116" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="end" font-weight="700">backup → MASTER, GARP</text><rect x="40" y="240" width="820" height="126" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="264" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">VRRPv3 (RFC 5798): domyślnie advert co 1 s → przełączenie ok. 3,6 s po ostatnim ogłoszeniu; advert 100 ms → 360,9 ms.</text><text x="60" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">HSRP: hello 3 s, hold 10 s → do 10 s (można skrócić do milisekund). Wykrycie awarii łącza + BFD/tracking — szybciej.</text><text x="60" y="312" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Klient Java: istniejące połączenia TCP przez bramę zwykle przeżyją (retransmisje), jeśli przerwa &lt; timeoutu;</text><text x="60" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">połączenia przez reverse proxy na VIP (keepalived) zostaną ZERWANE — stan TCP był na starym węźle → potrzebny retry.</text><text x="60" y="356" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Bez GARP hosty trzymają stary MAC w cache ARP do wygaśnięcia — przerwa rośnie do dziesiątek sekund.</text>
</svg>
