<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Macierz trybów kanału: active, passive, on, desirable, auto. Kanał LACP powstaje dla active z active i active z passive, PAgP dla desirable z desirable i desirable z auto, statyczny tylko dla on z on; passive z passive i auto z auto nie tworzą kanału, a on z trybem negocjowanym grozi pętlą lub utratą ruchu.">
