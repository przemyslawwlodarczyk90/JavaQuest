<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="PMTUD black hole: małe pakiety SYN, SYN-ACK i ClientHello przechodzą przez tunel o MTU 1420, a duża odpowiedź serwera 1500 bajtów z DF jest odrzucana; komunikat ICMP fragmentation needed jest blokowany przez firewall, więc serwer retransmituje bez końca, a klient zgłasza timeout handshake TLS.">
<title>PMTUD black hole: małe pakiety SYN, SYN-ACK i ClientHello przechodzą przez tunel o MTU 1420, a duża odpowiedź serwera 1500 bajtów z DF jest odrzucana; komunikat ICMP fragmentation needed jest blokowany przez firewall, więc serwer retransmituje bez końca, a klient zgłasza timeout handshake TLS.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">PMTUD black hole: ICMP zablokowany — handshake TCP przechodzi, TLS wisi</text><rect x="60" y="56" width="140" height="40" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="130" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">klient</text><rect x="700" y="56" width="140" height="40" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="770" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">serwer</text><rect x="390" y="56" width="120" height="40" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="450" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">tunel 1420</text><text x="450" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#b23b3b" text-anchor="middle" font-weight="700">ICMP DROP</text><line x1="130" y1="130" x2="770" y2="130" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="124" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">SYN (60 B)  ✓</text><line x1="770" y1="166" x2="130" y2="166" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">SYN-ACK (60 B)  ✓</text><line x1="130" y1="202" x2="770" y2="202" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">ACK + ClientHello (~600 B)  ✓</text><line x1="770" y1="238" x2="130" y2="238" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="450" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">ServerHello + Certificate + … (1500 B, DF=1)  ✕</text><text x="450" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">… ICMP 3/4 od routera tunelu → zablokowany przez firewall</text><line x1="770" y1="310" x2="130" y2="310" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="450" y="304" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">retransmisje 1500 B … timeout (klient: „TLS handshake timeout”)  ✕</text><rect x="40" y="352" width="820" height="56" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="376" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Objawy: ping OK, curl -v wisi po „Client hello”, SSH loguje się, ale scp/git clone stoi, małe API OK, duże odpowiedzi nie.</text><text x="60" y="398" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">Naprawa: przepuść ICMP 3/4 i Packet Too Big; MSS clamping na routerze tunelu; mniejsze MTU interfejsu; PLPMTUD.</text>
</svg>
