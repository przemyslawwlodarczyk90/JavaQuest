<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Sześć kroków diagnozy sieci lokalnej z poleceniami: łącze (ip -br link, ethtool), adres (ip -br addr), sąsiad (ip neigh, arping), brama i trasa (ip route get), ścieżka i MTU (ping -M do -s, tracepath), nazwy i usługa (resolvectl, ss, curl -v). Zatrzymaj się na pierwszym kroku, który zawodzi.">
<title>Sześć kroków diagnozy sieci lokalnej z poleceniami: łącze (ip -br link, ethtool), adres (ip -br addr), sąsiad (ip neigh, arping), brama i trasa (ip route get), ścieżka i MTU (ping -M do -s, tracepath), nazwy i usługa (resolvectl, ss, curl -v). Zatrzymaj się na pierwszym kroku, który zawodzi.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Metodyka: od kabla w górę — każdy krok ma jedno polecenie i jedno pytanie</text><rect x="60" y="56" width="190" height="44" rx="8" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="155" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">1. Łącze</text><rect x="270" y="56" width="250" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="285" y="84" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">ip -br link · ethtool</text><text x="540" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">czy interfejs jest UP i LOWER_UP?</text><line x1="155" y1="100" x2="155" y2="112" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="112" width="190" height="44" rx="8" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="155" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">2. Adres</text><rect x="270" y="112" width="250" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="285" y="140" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">ip -br addr</text><text x="540" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">czy adres i maska są właściwe? duplikat?</text><line x1="155" y1="156" x2="155" y2="168" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="168" width="190" height="44" rx="8" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="155" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">3. Sąsiad</text><rect x="270" y="168" width="250" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="285" y="196" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">ip neigh · arping</text><text x="540" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">czy ARP do celu/bramy dostaje odpowiedź?</text><line x1="155" y1="212" x2="155" y2="224" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="224" width="190" height="44" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="155" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">4. Brama/trasa</text><rect x="270" y="224" width="250" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="285" y="252" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">ip route get &lt;cel&gt;</text><text x="540" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">którędy pójdzie pakiet? brama w podsieci?</text><line x1="155" y1="268" x2="155" y2="280" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="280" width="190" height="44" rx="8" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="155" y="308" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">5. Ścieżka/MTU</text><rect x="270" y="280" width="250" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="285" y="308" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">ping -M do -s · tracepath</text><text x="540" y="308" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">czy duże pakiety przechodzą?</text><line x1="155" y1="324" x2="155" y2="336" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="336" width="190" height="44" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="155" y="364" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">6. Nazwy i usługa</text><rect x="270" y="336" width="250" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="285" y="364" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">resolvectl · ss · curl -v</text><text x="540" y="364" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">DNS, port, aplikacja — dopiero teraz</text><text x="450" y="404" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">Zatrzymaj się na pierwszym kroku, który zawodzi — reszta jest jego skutkiem.</text>
</svg>
