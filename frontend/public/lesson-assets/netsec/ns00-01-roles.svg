<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="Osiem ról bezpieczeństwa (AppSec, DevSecOps, analityk SOC, detection engineer, incident responder, cloud security, threat intelligence, architekt) z numerami rozdziałów toru, które do nich przygotowują">
<title>Osiem ról bezpieczeństwa (AppSec, DevSecOps, analityk SOC, detection engineer, incident responder, cloud security, threat intelligence, architekt) z numerami rozdziałów toru, które do nich przygotowują</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="450" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Dokąd prowadzi tor: role, w których przewaga Java developera jest największa</text><rect x="40" y="56" width="400" height="68" rx="10" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><rect x="40" y="56" width="10" height="68" rx="4" fill="#6a4c9c"/><text x="66" y="85" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#6a4c9c" font-weight="700">AppSec / Product Security</text><text x="66" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">rozdz. 15, 17, 23, 24, 36</text><rect x="460" y="56" width="400" height="68" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><rect x="460" y="56" width="10" height="68" rx="4" fill="#2e7d4f"/><text x="486" y="85" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2e7d4f" font-weight="700">DevSecOps / Platform Security</text><text x="486" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">rozdz. 10, 22, 24, 25</text><rect x="40" y="138" width="400" height="68" rx="10" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><rect x="40" y="138" width="10" height="68" rx="4" fill="#2f6fb3"/><text x="66" y="167" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2f6fb3" font-weight="700">Analityk SOC (L1–L3)</text><text x="66" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">rozdz. 18–20, 26, 28, 31</text><rect x="460" y="138" width="400" height="68" rx="10" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><rect x="460" y="138" width="10" height="68" rx="4" fill="#2f6fb3"/><text x="486" y="167" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2f6fb3" font-weight="700">Detection Engineer</text><text x="486" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">rozdz. 26, 27, 30, 35</text><rect x="40" y="220" width="400" height="68" rx="10" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><rect x="40" y="220" width="10" height="68" rx="4" fill="#b23b3b"/><text x="66" y="249" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#b23b3b" font-weight="700">Incident Responder / DFIR</text><text x="66" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">rozdz. 32, 33, 34</text><rect x="460" y="220" width="400" height="68" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><rect x="460" y="220" width="10" height="68" rx="4" fill="#2e7d4f"/><text x="486" y="249" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2e7d4f" font-weight="700">Cloud Security Engineer</text><text x="486" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">rozdz. 10, 16, 25</text><rect x="40" y="302" width="400" height="68" rx="10" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><rect x="40" y="302" width="10" height="68" rx="4" fill="#c46a12"/><text x="66" y="331" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#c46a12" font-weight="700">Threat Intelligence / Hunter</text><text x="66" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">rozdz. 29, 30, 39</text><rect x="460" y="302" width="400" height="68" rx="10" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><rect x="460" y="302" width="10" height="68" rx="4" fill="#6a4c9c"/><text x="486" y="331" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#6a4c9c" font-weight="700">Network / Security Architect</text><text x="486" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">rozdz. 13, 14, 21, 38</text><text x="450" y="400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">Wspólny fundament wszystkich ról: sieci (część I), Linux i Windows, logi, myślenie o zagrożeniach.</text><text x="450" y="424" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Rozdział 40 pomaga zaplanować przejście na wybraną rolę i zbudować portfolio.</text>
</svg>
