roke="#d9d0c3" stroke-width="1.5"/><text x="608" y="110" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">ruch jawny w eterze</text><rect x="30" y="126" width="186" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="38" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">WEP / WPA (TKIP)</text><rect x="220" y="126" width="226" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="228" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">klucz statyczny</text><rect x="450" y="126" width="146" height="34" rx="3" fill="#f6dcdc" stroke="#d9d0c3" stroke-width="1.5"/><text x="458" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">NIE</text><rect x="600" y="126" width="246" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="608" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">złamane, wycofane</text><rect x="30" y="164" width="186" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="38" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">WPA2-Personal</text><rect x="220" y="164" width="226" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="228" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">PSK (hasło)</text><rect x="450" y="164" width="146" height="34" rx="3" fill="#fbe6cf" stroke="#d9d0c3" stroke-width="1.5"/><text x="458" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">warunkowo</text><rect x="600" y="164" width="246" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="608" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">atak słownikowy offline</text><rect x="30" y="202" width="186" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="38" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">WPA2-Enterprise</text><rect x="220" y="202" width="226" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="228" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">802.1X / RADIUS</text><rect x="450" y="202" width="146" height="34" rx="3" fill="#dcefe3" stroke="#d9d0c3" stroke-width="1.5"/><text x="458" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">TAK</text><rect x="600" y="202" width="246" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="608" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">weryfikuj certyfikat serwera!</text><rect x="30" y="240" width="186" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="38" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">WPA3-Personal</text><rect x="220" y="240" width="226" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="228" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">SAE (Dragonfly)</text><rect x="450" y="240" width="146" height="34" rx="3" fill="#dcefe3" stroke="#d9d0c3" stroke-width="1.5"/><text x="458" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">TAK</text><rect x="600" y="240" width="246" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="608" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">odporne na słownik offline</text><rect x="30" y="278" width="186" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="38" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">WPA3-Enterprise</text><rect x="220" y="278" width="226" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="228" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">802.1X (+192-bit)</text><rect x="450" y="278" width="146" height="34" rx="3" fill="#dcefe3" stroke="#d9d0c3" stroke-width="1.5"/><text x="458" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">TAK</text><rect x="600" y="278" width="246" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="608" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">standard w firmach</text><rect x="30" y="316" width="186" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="38" y="338" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">OWE (Enhanced Open)</text><rect x="220" y="316" width="226" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="228" y="338" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">brak, ale szyfrowanie</text><rect x="450" y="316" width="146" height="34" rx="3" fill="#e9e1f5" stroke="#d9d0c3" stroke-width="1.5"/><text x="458" y="338" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">częściowo</text><rect x="600" y="316" width="246" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="608" y="338" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">hotspoty: szyfr bez hasła</text><text x="450" y="372" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">PMF (802.11w) chroni ramki zarządzające przed fałszywym rozłączaniem — obowiązkowe w WPA3.</text><text x="450" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle">W sieci publicznej i tak zakładaj, że sieć jest wroga: TLS wszędzie, VPN, brak zaufania do captive portali.</text>
</svg>
