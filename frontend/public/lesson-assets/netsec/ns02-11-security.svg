<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Tabela trybów zabezpieczeń Wi-Fi: sieć otwarta i WEP/WPA z TKIP niebezpieczne; WPA2-Personal z PSK warunkowo (atak słownikowy offline); WPA2-Enterprise z 802.1X bezpieczne przy weryfikacji certyfikatu; WPA3-Personal z SAE i WPA3-Enterprise bezpieczne; OWE szyfruje bez hasła. PMF chroni ramki zarządzające.">
<title>Tabela trybów zabezpieczeń Wi-Fi: sieć otwarta i WEP/WPA z TKIP niebezpieczne; WPA2-Personal z PSK warunkowo (atak słownikowy offline); WPA2-Enterprise z 802.1X bezpieczne przy weryfikacji certyfikatu; WPA3-Personal z SAE i WPA3-Enterprise bezpieczne; OWE szyfruje bez hasła. PMF chroni ramki zarządzające.</title>
