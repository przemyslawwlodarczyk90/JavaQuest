<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Trzy panele: autonomiczne AP konfigurowane osobno przez administratora (dom, mała firma); lightweight AP połączone tunelami CAPWAP z kontrolerem WLC, który zapewnia RRM, roaming, WIPS i polityki; AP zarządzane z chmury przez HTTPS, z ruchem danych pozostającym lokalnie (wiele lokalizacji).">
<title>Trzy panele: autonomiczne AP konfigurowane osobno przez administratora (dom, mała firma); lightweight AP połączone tunelami CAPWAP z kontrolerem WLC, który zapewnia RRM, roaming, WIPS i polityki; AP zarządzane z chmury przez HTTPS, z ruchem danych pozostającym lokalnie (wiele lokalizacji).</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Trzy architektury Wi-Fi: autonomiczna, z kontrolerem, z chmury</text><rect x="30" y="56" width="270" height="300" rx="10" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="165" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">Autonomiczne AP</text><rect x="50" y="160" width="70" height="34" rx="6" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="85" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP1</text><line x1="165" y1="128" x2="85" y2="158" stroke="#c46a12" stroke-width="1.5" marker-end="url(#arr)"/><rect x="132" y="160" width="70" height="34" rx="6" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="167" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP2</text><line x1="165" y1="128" x2="167" y2="158" stroke="#c46a12" stroke-width="1.5" marker-end="url(#arr)"/><rect x="214" y="160" width="70" height="34" rx="6" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="249" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP3</text><line x1="165" y1="128" x2="249" y2="158" stroke="#c46a12" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125" y="100" width="80" height="28" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="165" y="119" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">admin</text><text x="46" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• każdy AP konfigurowany osobno</text><text x="46" y="266" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• brak wspólnego roamingu/RRM</text><text x="46" y="292" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• dom, mała firma, 1–3 AP</text><text x="165" y="336" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c46a12" text-anchor="middle">admin → AP1, AP2, AP3</text><rect x="315" y="56" width="270" height="300" rx="10" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="450" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">Kontroler WLC (lightweight)</text><rect x="400" y="100" width="100" height="30" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="450" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">WLC</text><rect x="335" y="170" width="70" height="34" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="370" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP1</text><line x1="450" y1="132" x2="370" y2="168" stroke="#2f6fb3" stroke-width="2.5"/><rect x="417" y="170" width="70" height="34" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="452" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP2</text><line x1="450" y1="132" x2="452" y2="168" stroke="#2f6fb3" stroke-width="2.5"/><rect x="499" y="170" width="70" height="34" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="534" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP3</text><line x1="450" y1="132" x2="534" y2="168" stroke="#2f6fb3" stroke-width="2.5"/><text x="450" y="155" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2f6fb3" text-anchor="middle" font-weight="700">CAPWAP</text><text x="331" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• AP bez własnej konfiguracji</text><text x="331" y="266" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• CAPWAP do kontrolera</text><text x="331" y="292" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• RRM, roaming, WIPS, polityki</text><text x="450" y="336" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2f6fb3" text-anchor="middle">WLC ⇄ CAPWAP ⇄ AP</text><rect x="600" y="56" width="270" height="300" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="735" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Zarządzanie z chmury</text><ellipse cx="735" cy="115" rx="60" ry="20" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="735" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">chmura</text><rect x="620" y="170" width="70" height="34" rx="6" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="655" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP1</text><line x1="735" y1="136" x2="655" y2="168" stroke="#2e7d4f" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="702" y="170" width="70" height="34" rx="6" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="737" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP2</text><line x1="735" y1="136" x2="737" y2="168" stroke="#2e7d4f" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="784" y="170" width="70" height="34" rx="6" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="819" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP3</text><line x1="735" y1="136" x2="819" y2="168" stroke="#2e7d4f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="805" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f" text-anchor="middle" font-weight="700">tylko zarządzanie</text><text x="616" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• AP pobiera konfigurację z chmury</text><text x="616" y="266" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• ruch danych zostaje lokalnie</text><text x="616" y="292" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• oddziały, wiele lokalizacji</text><text x="735" y="336" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2e7d4f" text-anchor="middle">chmura ⇢ HTTPS ⇢ AP</text><text x="450" y="384" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">Przykłady: Cisco Catalyst 9800 (WLC), Aruba, Juniper Mist i Cisco Meraki (chmura), UniFi (kontroler programowy).</text>
</svg>
