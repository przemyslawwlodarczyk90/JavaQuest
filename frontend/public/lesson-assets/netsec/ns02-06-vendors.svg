e</text><rect x="620" y="162" width="246" height="32" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="628" y="183" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">show ethernet-switching table</text><rect x="30" y="198" width="186" height="32" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="38" y="219" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">zatwierdzenie zmian</text><rect x="220" y="198" width="206" height="32" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="228" y="219" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">(od razu w RAM)</text><rect x="430" y="198" width="186" height="32" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="438" y="219" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">(od razu) / sesje</text><rect x="620" y="198" width="246" height="32" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="628" y="219" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">commit</text><rect x="30" y="234" width="186" height="32" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="38" y="255" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">zapis na stałe</text><rect x="220" y="234" width="206" height="32" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="228" y="255" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">copy run start</text><rect x="430" y="234" width="186" height="32" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="438" y="255" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill