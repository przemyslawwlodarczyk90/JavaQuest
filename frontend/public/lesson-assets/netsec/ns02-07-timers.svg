<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Oś czasu: w 802.1D port przechodzi przez blocking do 20 s (max age), listening 15 s i learning 15 s, więc forwarding zaczyna się po 30–50 s; w RSTP dzięki proposal/agreement port przechodzi do forwarding w około sekundę, a port brzegowy natychmiast. Skutki dla aplikacji: timeouty DHCP, zerwane połączenia TCP, błędy health-checków.">
<title>Oś czasu: w 802.1D port przechodzi przez blocking do 20 s (max age), listening 15 s i learning 15 s, więc forwarding zaczyna się po 30–50 s; w RSTP dzięki proposal/agreement port przechodzi do forwarding w około sekundę, a port brzegowy natychmiast. Skutki dla aplikacji: timeouty DHCP, zerwane połączenia TCP, błędy health-checków.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="360" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Ile trwa, zanim port zacznie przekazywać ruch</text><text x="40" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#1f1a14" font-weight="700">802.1D</text><text x="40" y="110" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">awaria pośrednia</text><rect x="170" y="76" width="260" height="40" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="300" y="101" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">blocking (max age)</text><rect x="430" y="76" width="195" height="40" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="527.5" y="101" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" text-anchor="middle" font-weight="700">listening</text><rect x="625" y="76" width="195" height="40" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="722.5" y="101" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">learning</text><rect x="820" y="76" width="70" height="40" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="855" y="101" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">forwarding</text><line x1="170" y1="120" x2="170" y2="130" stroke="#6b6257" stroke-width="2"/><text x="170" y="145" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">0 s</text><line x1="430" y1="120" x2="430" y2="130" stroke="#6b6257" stroke-width="2"/><text x="430" y="145" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">20 s</text><line x1="625" y1="120" x2="625" y2="130" stroke="#6b6257" stroke-width="2"/><text x="625" y="145" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">35 s</text><line x1="820" y1="120" x2="820" y2="130" stroke="#6b6257" stroke-width="2"/><text x="820" y="145" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">50 s</text><text x="40" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#1f1a14" font-weight="700">RSTP</text><text x="40" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">802.1w</text><rect x="170" y="176" width="26" height="40" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><rect x="196" y="176" width="70" height="40" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="231" y="201" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">forwarding</text><text x="286" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">proposal/agreement lub alternate → root: ~1 s;</text><text x="286" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">port edge (PortFast) — natychmiast</text><rect x="40" y="246" width="820" height="96" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Co widzi aplikacja: przez 30–50 s ramki nie przechodzą — DHCP timeout, zerwane połączenia TCP,</text><text x="60" y="290" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">błędy health-checków, failover klastra. Do tego TCN skraca czas życia tablic MAC → chwilowy flooding.</text><text x="60" y="316" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">Rozwiązanie: RSTP (rapid-pvst / MST) + PortFast na portach brzegowych + stabilne łącza.</text>
</svg>
