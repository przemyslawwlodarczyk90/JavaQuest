<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Porównanie: bez FHRP awaria jedynej bramy R1 odcina hosty; z VRRP lub HSRP routery R1 (master, priorytet 110) i R2 (backup, priorytet 100) dzielą wirtualny adres 10.0.10.1 z wirtualnym MAC 00:00:5e:00:01:0a; po awarii R2 przejmuje adres i MAC oraz wysyła gratuitous ARP, hosty nie zmieniają konfiguracji.">
<title>Porównanie: bez FHRP awaria jedynej bramy R1 odcina hosty; z VRRP lub HSRP routery R1 (master, priorytet 110) i R2 (backup, priorytet 100) dzielą wirtualny adres 10.0.10.1 z wirtualnym MAC 00:00:5e:00:01:0a; po awarii R2 przejmuje adres i MAC oraz wysyła gratuitous ARP, hosty nie zmieniają konfiguracji.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">Jedna brama = pojedynczy punkt awarii. FHRP: dwa routery, jeden wirtualny adres</text><rect x="40" y="56" width="390" height="320" rx="10" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="235" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">Bez FHRP</text><rect x="165" y="100" width="140" height="50" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="235" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">R1 10.0.10.1</text><text x="235" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">brama domyślna</text><text x="320" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" font-weight="700">✕ awaria</text><line x1="235" y1="152" x2="235" y2="220" stroke="#6b6257" stroke-width="2"/><rect x="120" y="220" width="230" height="46" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="235" y="248" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">hosty: default via 10.0.10.1</text><text x="60" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">R1 pada → wszystkie hosty bez bramy,</text><text x="60" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">mimo że obok stoi sprawny R2.</text><text x="60" y="344" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Zmiana bramy na hostach = ręczna praca.</text><rect x="470" y="56" width="390" height="320" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="665" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">VRRP / HSRP</text><rect x="490" y="100" width="160" height="56" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="570" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">R1 .2 — MASTER</text><text x="570" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">priorytet 110</text><rect x="680" y="100" width="160" height="56" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="760" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">R2 .3 — BACKUP</text><text x="760" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">priorytet 100</text><rect x="560" y="180" width="210" height="46" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="665" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">wirtualny 10.0.10.1</text><text x="665" y="218" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">MAC 00:00:5e:00:01:0a</text><line x1="570" y1="158" x2="620" y2="180" stroke="#2e7d4f" stroke-width="2"/><line x1="760" y1="158" x2="710" y2="180" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><line x1="665" y1="228" x2="665" y2="252" stroke="#6b6257" stroke-width="2"/><rect x="550" y="252" width="230" height="40" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="665" y="277" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">hosty: default via 10.0.10.1</text><text x="490" y="316" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Master odpowiada na ARP o 10.0.10.1 wirtualnym MAC.</text><text x="490" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Po awarii R2 przejmuje IP i MAC, wysyła GARP —</text><text x="490" y="356" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">hosty niczego nie zmieniają.</text>
</svg>
