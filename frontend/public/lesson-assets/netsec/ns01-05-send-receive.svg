<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Dwa stosy: u nadawcy dane schodzą od aplikacji przez TCP i IP do karty sieciowej, u odbiorcy wędrują w górę z kontrolami FCS, adresu i portu">
<title>Dwa stosy: u nadawcy dane schodzą od aplikacji przez TCP i IP do karty sieciowej, u odbiorcy wędrują w górę z kontrolami FCS, adresu i portu</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="460" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Droga przez stos: write() u nadawcy, read() u odbiorcy</text><rect x="40" y="70" width="200" height="56" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="140" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">Aplikacja (JVM)</text><rect x="660" y="70" width="200" height="56" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="760" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">Aplikacja (JVM)</text><text x="250" y="94" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">out.write(bajty) → bufor gniazda</text><text x="650" y="114" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">in.read() ← bufor gniazda</text><rect x="40" y="152" width="200" height="56" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="140" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">TCP</text><rect x="660" y="152" width="200" height="56" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="760" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">TCP</text><text x="250" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">dzieli na segmenty ≤ MSS, nadaje seq</text><text x="650" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">porządkuje seq, wysyła ACK, port → gniazdo</text><rect x="40" y="234" width="200" height="56" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="140" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">IP</text><rect x="660" y="234" width="200" height="56" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="760" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">IP</text><text x="250" y="258" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">dodaje IP, wybiera trasę i next hop</text><text x="650" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">czy IP docelowy mój? protokół 6 → TCP</text><rect x="40" y="316" width="200" height="56" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="140" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">Ethernet / karta</text><rect x="660" y="316" width="200" height="56" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="760" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">Ethernet / karta</text><text x="250" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">ARP → MAC next hopa, ramka + FCS</text><text x="650" y="360" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="end">FCS OK? MAC mój? EtherType 0x0800 → IP</text><line x1="30" y1="80" x2="30" y2="380" stroke="#2e7d4f" stroke-width="3" marker-end="url(#arr)"/><text x="30" y="400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">enkapsulacja</text><line x1="870" y1="380" x2="870" y2="80" stroke="#2f6fb3" stroke-width="3" marker-end="url(#arr)"/><text x="870" y="400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" text-anchor="end" font-weight="700">dekapsulacja</text><line x1="140" y1="382" x2="760" y2="382" stroke="#1f1a14" stroke-width="4" marker-end="url(#arr)"/><text x="450" y="410" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">bity na medium (kabel, światłowód, radio)</text><text x="450" y="440" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">Uwaga: jeden write() nie oznacza jednego segmentu ani jednego read() — TCP to strumień bajtów.</text>
</svg>
