<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Cztery źródła dowodów jednego żądania: pcap w P1, tabela conntrack routera, log reverse proxy i log aplikacji Spring Boot, połączone czasem, tabelą NAT, X-Forwarded-For i identyfikatorem żądania">
<title>Cztery źródła dowodów jednego żądania: pcap w P1, tabela conntrack routera, log reverse proxy i log aplikacji Spring Boot, połączone czasem, tabelą NAT, X-Forwarded-For i identyfikatorem żądania</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Jedno żądanie, cztery źródła dowodów — jak je połączyć</text><rect x="40" y="60" width="220" height="52" rx="8" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="150" y="91" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">pcap P1</text><rect x="280" y="60" width="580" height="52" rx="8" fill="#fbf8f3" stroke="#c46a12" stroke-width="1.5"/><text x="296" y="91" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">10.10.1.10:45678 → 10.20.0.10:80</text><line x1="150" y1="114" x2="150" y2="126" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="130" width="220" height="52" rx="8" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="150" y="161" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">conntrack routera</text><rect x="280" y="130" width="580" height="52" rx="8" fill="#fbf8f3" stroke="#2f6fb3" stroke-width="1.5"/><text x="296" y="161" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">10.10.1.10:45678 ⇄ 10.20.0.2:45678 (NAT)</text><line x1="150" y1="184" x2="150" y2="196" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="200" width="220" height="52" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="150" y="231" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">log Caddy (proxy)</text><rect x="280" y="200" width="580" height="52" rx="8" fill="#fbf8f3" stroke="#2e7d4f" stroke-width="1.5"/><text x="296" y="231" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">remote_ip=10.20.0.2 uri=/users/42 id=7f3a…</text><line x1="150" y1="254" x2="150" y2="266" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="270" width="220" height="52" rx="8" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="150" y="301" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">log Spring Boot</text><rect x="280" y="270" width="580" height="52" rx="8" fill="#fbf8f3" stroke="#6a4c9c" stroke-width="1.5"/><text x="296" y="301" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">remoteAddr=10.30.0.10 XFF=10.20.0.2 traceId=7f3a…</text><text x="450" y="352" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">Klucze korelacji: czas (NTP!), tabela NAT, porty, X-Forwarded-For i identyfikator żądania (traceparent / X-Request-ID).</text><text x="450" y="376" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Bez tabeli NAT nikt poza routerem nie wie, że 10.20.0.2 to laptop 10.10.1.10.</text>
