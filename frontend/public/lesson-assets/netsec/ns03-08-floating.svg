<title>Topologia labu: r1 połączony z r2 i r3, oba połączone z serwerem w sieci 198.51.100.0/24. Normalnie w RIB r1 jest trasa statyczna AD 1 przez r2, a trasa przez r3 z AD 250 czeka nieaktywna. Po wyłączeniu łącza r1–r2 trasa główna znika i instalowana jest pływająca przez r3.</title>
