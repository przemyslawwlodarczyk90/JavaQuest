<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Schemat ataku SSRF: atakujący podaje aplikacji URL do 169.254.169.254, aplikacja pobiera metadane instancji, w IMDSv1 łącznie z kluczami roli IAM. Obrona: IMDSv2 z tokenem i hop limitem 1, allow-lista hostów, blokada adresów specjalnych po rozwiązaniu DNS, filtrowanie ruchu wychodzącego.">
<title>Schemat ataku SSRF: atakujący podaje aplikacji URL do 169.254.169.254, aplikacja pobiera metadane instancji, w IMDSv1 łącznie z kluczami roli IAM. Obrona: IMDSv2 z tokenem i hop limitem 1, allow-lista hostów, blokada adresów specjalnych po rozwiązaniu DNS, filtrowanie ruchu wychodzącego.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">169.254.169.254: metadane instancji — i dlaczego to cel ataków SSRF</text><rect x="40" y="60" width="200" height="70" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="140" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">Atakujący</text><text x="140" y="112" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">?url=http://169.254…</text><rect x="350" y="60" width="220" height="70" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="460" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">Aplikacja (EC2/pod)</text><text x="460" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">pobiera podany URL</text><rect x="680" y="60" width="180" height="70" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="770" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">IMDS</text><text x="770" y="108" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">169.254.169.254</text><line x1="242" y1="95" x2="348" y2="95" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><line x1="572" y1="95" x2="678" y2="95" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="625" y="150" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#b23b3b" text-anchor="middle">GET /latest/meta-data/iam/security-credentials/rola</text><rect x="40" y="176" width="400" height="226" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="60" y="202" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" font-weight="700">IMDSv1 (stary)</text><text x="60" y="228" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Zwykły GET bez nagłówków zwraca dane,</text><text x="60" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">w tym tymczasowe klucze roli IAM.</text><text x="60" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Jedno SSRF = przejęcie uprawnień</text><text x="60" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">instancji (incydent Capital One, 2019).</text><rect x="460" y="176" width="400" height="226" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="480" y="202" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" font-weight="700">Obrona</text><text x="480" y="226" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IMDSv2: najpierw PUT po token (nagłówek</text><text x="480" y="247" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">X-aws-ec2-metadata-token-ttl-seconds),</text><text x="480" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">potem GET z tokenem; hop limit 1.</text><text x="480" y="289" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Wymuś: HttpTokens=required.</text><text x="480" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">W aplikacji: allow-lista hostów, blokada</text><text x="480" y="331" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">adresów specjalnych PO rozwiązaniu DNS,</text><text x="480" y="352" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">bez przekierowań do adresów wewnętrznych.</text><text x="480" y="373" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Egress: blokuj 169.254.169.254 z podów.</text>
</svg>
