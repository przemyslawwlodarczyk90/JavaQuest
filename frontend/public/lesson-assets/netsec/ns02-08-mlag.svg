<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Dwa przełączniki LEAF-A i LEAF-B połączone peer-linkiem i keepalive tworzą parę MLAG; serwer z bondingiem LACP ma po jednym łączu do każdego z nich i widzi je jako jednego partnera LACP. Awaria całego przełącznika nie odcina serwera. Odpowiedniki: vPC, StackWise Virtual, MC-LAG, EVPN multihoming.">
<title>Dwa przełączniki LEAF-A i LEAF-B połączone peer-linkiem i keepalive tworzą parę MLAG; serwer z bondingiem LACP ma po jednym łączu do każdego z nich i widzi je jako jednego partnera LACP. Awaria całego przełącznika nie odcina serwera. Odpowiedniki: vPC, StackWise Virtual, MC-LAG, EVPN multihoming.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">MLAG / vPC: jeden agregat do dwóch przełączników</text><rect x="170" y="70" width="200" height="50" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="270" y="101" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">LEAF-A</text><rect x="530" y="70" width="200" height="50" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="630" y="101" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">LEAF-B</text><line x1="370" y1="88" x2="530" y2="88" stroke="#6a4c9c" stroke-width="5"/><line x1="370" y1="104" x2="530" y2="104" stroke="#6a4c9c" stroke-width="5"/><text x="450" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">peer-link</text><text x="450" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle">+ keepalive</text><rect x="350" y="250" width="200" height="56" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="450" y="274" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">serwer</text><text x="450" y="294" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">bond0 (LACP, mode 4)</text><line x1="270" y1="122" x2="410" y2="248" stroke="#2e7d4f" stroke-width="4"/><line x1="630" y1="122" x2="490" y2="248" stroke="#2e7d4f" stroke-width="4"/><ellipse cx="450" cy="200" rx="110" ry="24" fill="none" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="6 4"/><text x="580" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" font-weight="700">serwer widzi jednego partnera LACP</text><text x="450" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Awaria całego przełącznika nie odcina serwera, oba łącza aktywne, brak blokowania przez STP.</text><text x="450" y="362" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">Nazwy: MLAG (Arista), vPC (Cisco Nexus), StackWise Virtual/VSS (Catalyst), MC-LAG (Juniper), EVPN multihoming (standard).</text>
</svg>
