<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Ścieżka laptop, router domowy, tunel VPN z MTU 1420 i serwer; trzy próby ping z flagą DF: 1472 bajty danych za duże, 1392 przechodzi, 1393 za duże — MTU ścieżki wynosi 1420">
<title>Ścieżka laptop, router domowy, tunel VPN z MTU 1420 i serwer; trzy próby ping z flagą DF: 1472 bajty danych za duże, 1392 przechodzi, 1393 za duże — MTU ścieżki wynosi 1420</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Szukanie MTU ścieżki: ping z flagą DF</text><rect x="10" y="70" width="140" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="80" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">laptop</text><rect x="230" y="70" width="140" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="300" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">router domowy</text><rect x="450" y="70" width="140" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="520" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">tunel VPN</text><rect x="710" y="70" width="140" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="780" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">serwer</text><text x="190" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">MTU 1500</text><text x="410" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">MTU 1500</text><text x="650" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">MTU 1420</text><line x1="150" y1="95" x2="230" y2="95" stroke="#1f1a14" stroke-width="3"/><line x1="370" y1="95" x2="450" y2="95" stroke="#1f1a14" stroke-width="3"/><line x1="590" y1="95" x2="710" y2="95" stroke="#b23b3b" stroke-width="3"/><rect x="40" y="180" width="820" height="46" rx="8" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="56" y="200" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" font-weight="700">ping -M do -s 1472 serwer</text><text x="56" y="218" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b">1472 + 8 (ICMP) + 20 (IP) = 1500 → „Frag needed and DF set (mtu = 1420)” lub cisza</text><rect x="40" y="236" width="820" height="46" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="56" y="256" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" font-weight="700">ping -M do -s 1392 serwer</text><text x="56" y="274" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f">1392 + 28 = 1420 → odpowiedź OK</text><rect x="40" y="292" width="820" height="46" rx="8" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="56" y="312" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" font-weight="700">ping -M do -s 1393 serwer</text><text x="56" y="330" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b">1393 + 28 = 1421 → za duży: MTU ścieżki = 1420</text><text x="450" y="362" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Windows: ping -f -l 1392 serwer · Linux: tracepath serwer (pokazuje pmtu na każdym skoku)</text>
</svg>
