<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Automat stanów wpisu sąsiada w Linuksie: INCOMPLETE po zapytaniu, REACHABLE po odpowiedzi, STALE po upływie czasu, DELAY przy wysłaniu ruchu, PROBE przy aktywnym sprawdzaniu i FAILED przy braku odpowiedzi; przykład wyniku ip neigh">
<title>Automat stanów wpisu sąsiada w Linuksie: INCOMPLETE po zapytaniu, REACHABLE po odpowiedzi, STALE po upływie czasu, DELAY przy wysłaniu ruchu, PROBE przy aktywnym sprawdzaniu i FAILED przy braku odpowiedzi; przykład wyniku ip neigh</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Stany wpisów sąsiadów w Linuksie (ip neigh)</text><rect x="15" y="80" width="210" height="60" rx="10" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="120" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">INCOMPLETE</text><text x="120" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">wysłano zapytanie, brak odpowiedzi</text><rect x="295" y="80" width="210" height="60" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="400" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">REACHABLE</text><text x="400" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">potwierdzony niedawno</text><rect x="575" y="80" width="210" height="60" rx="10" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="680" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6b6257" text-anchor="middle" font-weight="700">STALE</text><text x="680" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">nieaktualny — używany, ale do sprawdzenia</text><rect x="575" y="230" width="210" height="60" rx="10" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="680" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">DELAY</text><text x="680" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">czeka chwilę na potwierdzenie z TCP</text><rect x="295" y="230" width="210" height="60" rx="10" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="400" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">PROBE</text><text x="400" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">aktywnie sprawdza (unicast)</text><rect x="15" y="230" width="210" height="60" rx="10" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="120" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">FAILED</text><text x="120" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">brak odpowiedzi — host nieosiągalny</text><line x1="225" y1="110" x2="293" y2="110" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="260" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">odpowiedź</text><line x1="505" y1="110" x2="573" y2="110" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="540" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">upływ czasu</text><line x1="680" y1="140" x2="680" y2="228" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="690" y="188" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14">wysłanie ruchu</text><line x1="573" y1="260" x2="507" y2="260" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="540" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">brak potwierdzenia</text><line x1="400" y1="230" x2="400" y2="142" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="410" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14">odpowiedź</text><line x1="293" y1="260" x2="227" y2="260" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="260" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">brak</text><line x1="120" y1="140" x2="120" y2="228" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="130" y="188" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14">brak odp.</text><text x="450" y="336" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">$ ip neigh</text><text x="450" y="358" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">192.168.1.1 dev eth0 lladdr 00:1a:2b:3c:4d:5e REACHABLE   ·   192.168.1.77 dev eth0 FAILED</text><text x="450" y="382" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">FAILED / INCOMPLETE dla bramy = problem warstwy 2 (VLAN, kabel, brama wyłączona, zła podsieć).</text>
</svg>
