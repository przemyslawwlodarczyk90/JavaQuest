<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Mechanizm traceroute: pakiet z TTL 1 wygasa w R1, który odsyła ICMP Time Exceeded; TTL 2 wygasa w R2; TTL 3 w R3; pakiet z TTL 4 dociera do serwera, który odpowiada Port Unreachable dla UDP lub Echo Reply dla ICMP. Gwiazdka oznacza brak odpowiedzi.">
<title>Mechanizm traceroute: pakiet z TTL 1 wygasa w R1, który odsyła ICMP Time Exceeded; TTL 2 wygasa w R2; TTL 3 w R3; pakiet z TTL 4 dociera do serwera, który odpowiada Port Unreachable dla UDP lub Echo Reply dla ICMP. Gwiazdka oznacza brak odpowiedzi.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Traceroute: wysyłaj z TTL = 1, 2, 3… i zbieraj komunikaty Time Exceeded</text><rect x="20" y="60" width="100" height="40" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="70" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">laptop</text><line x1="122" y1="80" x2="208" y2="80" stroke="#6b6257" stroke-width="2"/><rect x="210" y="60" width="100" height="40" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="260" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R1</text><line x1="312" y1="80" x2="398" y2="80" stroke="#6b6257" stroke-width="2"/><rect x="400" y="60" width="100" height="40" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="450" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R2</text><line x1="502" y1="80" x2="588" y2="80" stroke="#6b6257" stroke-width="2"/><rect x="590" y="60" width="100" height="40" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="640" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R3</text><line x1="692" y1="80" x2="778" y2="80" stroke="#6b6257" stroke-width="2"/><rect x="780" y="60" width="100" height="40" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="830" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">serwer</text><text x="20" y="178" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">TTL=1</text><line x1="80" y1="174" x2="206" y2="174" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><line x1="206" y1="188" x2="80" y2="188" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="214" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">TTL→0 w R1: ICMP Time Exceeded (typ 11)</text><text x="20" y="232" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">TTL=2</text><line x1="80" y1="228" x2="396" y2="228" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><line x1="396" y1="242" x2="80" y2="242" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="404" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">TTL→0 w R2: ICMP Time Exceeded (typ 11)</text><text x="20" y="286" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">TTL=3</text><line x1="80" y1="282" x2="586" y2="282" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><line x1="586" y1="296" x2="80" y2="296" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="594" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">TTL→0 w R3: ICMP Time Exceeded (typ 11)</text><text x="20" y="340" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">TTL=4</text><line x1="80" y1="336" x2="776" y2="336" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><line x1="776" y1="350" x2="80" y2="350" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="770" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="end" font-weight="700">cel: Port Unreachable (UDP) / Echo Reply (ICMP)</text><text x="40" y="404" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Każdy skok pokazuje adres routera, który odesłał ICMP, i czas tam i z powrotem (3 próby). Gwiazdka * = brak odpowiedzi w czasie.</text>
</svg>
