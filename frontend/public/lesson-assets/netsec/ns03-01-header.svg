<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Układ nagłówka IPv4 w pięciu 32-bitowych wierszach: Version i IHL po 4 bity, DSCP 6 bitów, ECN 2 bity, Total Length 16 bitów; Identification 16, Flags 3, Fragment Offset 13; TTL 8, Protocol 8, Header Checksum 16; adres źródłowy 32 bity; adres docelowy 32 bity; opcjonalne opcje do 40 bajtów.">
<title>Układ nagłówka IPv4 w pięciu 32-bitowych wierszach: Version i IHL po 4 bity, DSCP 6 bitów, ECN 2 bity, Total Length 16 bitów; Identification 16, Flags 3, Fragment Offset 13; TTL 8, Protocol 8, Header Checksum 16; adres źródłowy 32 bity; adres docelowy 32 bity; opcjonalne opcje do 40 bajtów.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Nagłówek IPv4 (RFC 791): 5 wierszy po 32 bity = 20 bajtów bez opcji</text><text x="82.5" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">0</text><text x="182.5" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">4</text><text x="282.5" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">8</text><text x="482.5" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">16</text><text x="557.5" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">19</text><text x="682.5" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">24</text><text x="857.5" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">31</text><text x="58" y="99" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">0</text><rect x="70" y="68" width="100" height="46" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="120" y="97" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="middle" font-weight="700">Version</text><rect x="170" y="68" width="100" height="46" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="220" y="97" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="middle" font-weight="700">IHL</text><rect x="270" y="68" width="150" height="46" rx="3" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="345" y="97" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">DSCP</text><rect x="420" y="68" width="50" height="46" rx="3" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="445" y="97" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">ECN</text><rect x="470" y="68" width="400" height="46" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="670" y="97" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="middle" font-weight="700">Total Length</text><text x="58" y="151" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">4</text><rect x="70" y="120" width="400" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="270" y="149" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="700">Identification</text><rect x="470" y="120" width="75" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="507.5" y="149" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="700">Flags</text><rect x="545" y="120" width="325" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="707.5" y="149" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="700">Fragment Offset</text><text x="58" y="203" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">8</text><rect x="70" y="172" width="200" height="46" rx="3" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="170" y="201" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">TTL</text><rect x="270" y="172" width="200" height="46" rx="3" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="370" y="201" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">Protocol</text><rect x="470" y="172" width="400" height="46" rx="3" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="670" y="201" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">Header Checksum</text><text x="58" y="255" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">12</text><rect x="70" y="224" width="800" height="46" rx="3" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="470" y="253" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">Source Address (adres źródłowy)</text><text x="58" y="307" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">16</text><rect x="70" y="276" width="800" height="46" rx="3" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="470" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">Destination Address (adres docelowy)</text><rect x="70" y="328" width="800" height="34" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="470" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Options (0–40 B, rzadkie) — wtedy IHL &gt; 5</text><text x="58" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="end">bajt</text><text x="70" y="402" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• IHL = długość nagłówka w słowach 32-bit (5 → 20 B)</text><text x="70" y="420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• Flags: 0 | DF (nie fragmentuj) | MF (więcej fragmentów)</text><text x="70" y="438" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• TTL: każdy router −1, przy 0 pakiet ginie (ICMP Time Exceeded)</text><text x="70" y="456" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• Protocol: 1 ICMP, 6 TCP, 17 UDP, 50 ESP, 89 OSPF</text>
</svg>
