<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Tabela siedmiu warstw z przykładowymi zagrożeniami i odpowiadającymi im zabezpieczeniami">
<title>Tabela siedmiu warstw z przykładowymi zagrożeniami i odpowiadającymi im zabezpieczeniami</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Obrona w głąb według warstw: zagrożenie → zabezpieczenie</text><text x="260" y="68" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">Zagrożenia (rozpoznaj i wykryj)</text><text x="660" y="68" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Zabezpieczenia</text><rect x="30" y="82" width="130" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="95" y="113" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">7 Aplikacji</text><rect x="170" y="82" width="340" height="50" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="182" y="113" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">SQL injection, XSS, BOLA, przejęcie konta</text><line x1="512" y1="107" x2="556" y2="107" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="82" width="310" height="50" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="572" y="113" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">walidacja, WAF, autoryzacja, MFA, logi</text><rect x="30" y="142" width="130" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="95" y="173" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">6 Prezentacji</text><rect x="170" y="142" width="340" height="50" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="182" y="173" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">downgrade TLS, słabe szyfry, SSL stripping</text><line x1="512" y1="167" x2="556" y2="167" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="142" width="310" height="50" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="572" y="173" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">TLS 1.3, HSTS, poprawne certyfikaty</text><rect x="30" y="202" width="130" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="95" y="233" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">5 Sesji</text><rect x="170" y="202" width="340" height="50" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="182" y="233" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">przejęcie sesji, kradzież tokenu</text><line x1="512" y1="227" x2="556" y2="227" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="202" width="310" height="50" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="572" y="233" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">krótkie sesje, wiązanie tokenu, wylogowanie</text><rect x="30" y="262" width="130" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="95" y="293" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">4 Transportowa</text><rect x="170" y="262" width="340" height="50" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="182" y="293" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">SYN flood, skanowanie portów</text><line x1="512" y1="287" x2="556" y2="287" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="262" width="310" height="50" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="572" y="293" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">firewall stanowy, SYN cookies, limity</text><rect x="30" y="322" width="130" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="95" y="353" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">3 Sieciowa</text><rect x="170" y="322" width="340" height="50" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="182" y="353" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">IP spoofing, ICMP flood, przejęcie trasy</text><line x1="512" y1="347" x2="556" y2="347" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="322" width="310" height="50" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="572" y="353" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">ACL, uRPF, filtrowanie, RPKI</text><rect x="30" y="382" width="130" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="95" y="413" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">2 Łącza danych</text><rect x="170" y="382" width="340" height="50" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="182" y="413" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">ARP spoofing, MAC flooding, VLAN hopping</text><line x1="512" y1="407" x2="556" y2="407" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="382" width="310" height="50" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="572" y="413" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">802.1X, port security, DAI, DHCP snooping</text><rect x="30" y="442" width="130" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="95" y="473" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">1 Fizyczna</text><rect x="170" y="442" width="340" height="50" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="182" y="473" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">podpięcie do gniazda, zagłuszanie, podsłuch kabla</text><line x1="512" y1="467" x2="556" y2="467" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="442" width="310" height="50" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="572" y="473" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">zamki, kontrola dostępu, nieużywane porty off</text>
</svg>
