<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Pasek ramki z nagłówkami Ethernet, IP, TCP, TLS i HTTP oraz zakres, który odczytuje hub, przełącznik, router, firewall stanowy i reverse proxy">
<title>Pasek ramki z nagłówkami Ethernet, IP, TCP, TLS i HTTP oraz zakres, który odczytuje hub, przełącznik, router, firewall stanowy i reverse proxy</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Które nagłówki „czyta” które urządzenie?</text><rect x="240" y="60" width="120" height="42" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="300" y="87" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">Ethernet</text><rect x="360" y="60" width="100" height="42" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="410" y="87" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">IP</text><rect x="460" y="60" width="100" height="42" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="510" y="87" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">TCP</text><rect x="560" y="60" width="100" height="42" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="610" y="87" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">TLS</text><rect x="660" y="60" width="210" height="42" rx="4" fill="#f3eefb" stroke="#6a4c9c" stroke-width="1.5"/><text x="765" y="87" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">HTTP + dane</text><text x="230" y="87" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" text-anchor="end">ramka:</text><text x="230" y="146" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" text-anchor="end" font-weight="700">Hub / repeater (L1)</text><text x="240" y="145" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257">∿∿∿ bity ∿∿∿</text><text x="240" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">tylko sygnał — nie rozumie żadnego nagłówka</text><text x="230" y="208" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="end" font-weight="700">Przełącznik (L2)</text><rect x="240" y="192" width="120" height="20" rx="4" fill="#c46a12" opacity="0.25"/><line x1="240" y1="202" x2="360" y2="202" stroke="#c46a12" stroke-width="3"/><text x="240" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">MAC docelowy → port; VLAN</text><text x="230" y="270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="end" font-weight="700">Router (L3)</text><rect x="240" y="254" width="220" height="20" rx="4" fill="#2f6fb3" opacity="0.25"/><line x1="240" y1="264" x2="460" y2="264" stroke="#2f6fb3" stroke-width="3"/><text x="240" y="294" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">adres IP → trasa; zmienia nagłówek Ethernet i TTL</text><text x="230" y="332" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="end" font-weight="700">Firewall stanowy / LB L4</text><rect x="240" y="316" width="320" height="20" rx="4" fill="#2e7d4f" opacity="0.25"/><line x1="240" y1="326" x2="560" y2="326" stroke="#2e7d4f" stroke-width="3"/><text x="240" y="356" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">IP + porty + stan połączenia TCP</text><text x="230" y="394" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="end" font-weight="700">Reverse proxy / WAF / LB L7</text><rect x="240" y="378" width="630" height="20" rx="4" fill="#6a4c9c" opacity="0.25"/><line x1="240" y1="388" x2="870" y2="388" stroke="#6a4c9c" stroke-width="3"/><text x="240" y="418" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">kończy TLS, czyta HTTP: ścieżka, nagłówki, treść</text><text x="450" y="455" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">Im wyżej sięga urządzenie, tym więcej widzi — i tym więcej może zepsuć, zablokować lub zalogować.</text>
</svg>
