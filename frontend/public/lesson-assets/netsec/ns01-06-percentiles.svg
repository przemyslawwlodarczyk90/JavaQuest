" fill="#c46a12" opacity="0.8"/><rect x="691" y="317.1" width="24" height="2.9" fill="#c46a12" opacity="0.8"/><rect x="718" y="317.1" width="24" height="2.9" fill="#c46a12" opacity="0.8"/><rect x="745" y="317.1" width="24" height="2.9" fill="#c46a12" opacity="0.8"/><rect x="772" y="317.1" width="24" height="2.9" fill="#c46a12" opacity="0.8"/><rect x="799" y="317.1" width="24" height="2.9" fill="#c46a12" opacity="0.8"/><line x1="70" y1="320" x2="826" y2="320" stroke="#1f1a14" stroke-width="2"/><text x="70" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">0 ms</text><text x="826" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="end">1400 ms</text><line x1="183.4" y1="62" x2="183.4" y2="320" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="6 5"/><text x="187.4" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" font-weight="700">p50 = 210 ms</text><line x1="226.6" y1="62" x2="226.6" y2="320" stroke="#6b6257" stroke-width="2" stroke-dasharray="6 5"/><text x="230.6" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">średnia = 290 ms</text><line x1="415.6" y1="62" x2="415.6" y2="320" stroke="#c46a12" stroke-width="2" stroke-dasharray="6 5"/><text x="419.6" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" font-weight="700">p95 = 640 ms</text><line x1="707.2" y1="62" x2="707.2" y2="320" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5"/><text x="711.2" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" font-weight="700">p99 = 1180 ms</text><text x="450" y="362" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">Średnia nie opisuje żadnego realnego użytkownika: połowa ma szybciej niż 210 ms, a co setne żądanie trwa ponad sekundę.</text><text x="450" y="386" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">Strona wołająca 50 usług trafi choć raz w p99 z prawdopodobieństwem 1 − 0,99^50 ≈ 39,5%.</text>
