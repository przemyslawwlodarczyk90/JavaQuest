<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="Tabela typów ICMP: 0 Echo Reply, 3/0 net unreachable, 3/1 host unreachable, 3/3 port unreachable, 3/4 fragmentation needed (nie wolno blokować — PMTUD), 3/13 administratively prohibited, 5 Redirect, 8 Echo Request, 11/0 TTL exceeded, 11/1 reassembly time exceeded. ICMPv6 jest obowiązkowy.">
<title>Tabela typów ICMP: 0 Echo Reply, 3/0 net unreachable, 3/1 host unreachable, 3/3 port unreachable, 3/4 fragmentation needed (nie wolno blokować — PMTUD), 3/13 administratively prohibited, 5 Redirect, 8 Echo Request, 11/0 TTL exceeded, 11/1 reassembly time exceeded. ICMPv6 jest obowiązkowy.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="450" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Najważniejsze komunikaty ICMP (IPv4) — i których nie wolno blokować</text><rect x="40" y="52" width="820" height="28" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="52" y="71" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">0/0</text><text x="110" y="71" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Echo Reply</text><text x="850" y="71" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">odpowiedź na ping</text><rect x="40" y="84" width="820" height="28" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="52" y="103" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">3/0</text><text x="110" y="103" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Destination Unreachable — net unreachable</text><text x="850" y="103" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">router nie ma trasy do sieci</text><rect x="40" y="116" width="820" height="28" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="52" y="135" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">3/1</text><text x="110" y="135" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Destination Unreachable — host unreachable</text><text x="850" y="135" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">ostatni router nie dostał odpowiedzi ARP/ND od hosta</text><rect x="40" y="148" width="820" height="28" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="52" y="167" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">3/3</text><text x="110" y="167" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Destination Unreachable — port unreachable</text><text x="850" y="167" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">host nie słucha na porcie UDP (traceroute UDP: koniec trasy)</text><rect x="40" y="180" width="820" height="28" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="52" y="199" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">3/4</text><text x="110" y="199" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">Destination Unreachable — fragmentation needed (DF set)</text><text x="850" y="199" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">pakiet za duży, a DF=1 — podstawa PMTUD</text><rect x="40" y="212" width="820" height="28" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="52" y="231" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">3/13</text><text x="110" y="231" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Destination Unreachable — communication administratively prohibited</text><text x="850" y="231" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">odrzucone przez ACL/firewall (REJECT)</text><rect x="40" y="244" width="820" height="28" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="52" y="263" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">5/1</text><text x="110" y="263" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Redirect — for host</text><text x="850" y="263" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">użyj innej bramy (lekcja 02/13)</text><rect x="40" y="276" width="820" height="28" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="52" y="295" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">8/0</text><text x="110" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Echo Request</text><text x="850" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">ping</text><rect x="40" y="308" width="820" height="28" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="52" y="327" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">11/0</text><text x="110" y="327" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Time Exceeded — TTL exceeded in transit</text><text x="850" y="327" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">TTL spadł do 0 — na tym działa traceroute</text><rect x="40" y="340" width="820" height="28" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="52" y="359" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">11/1</text><text x="110" y="359" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Time Exceeded — fragment reassembly time exceeded</text><text x="850" y="359" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">nie dotarły wszystkie fragmenty</text><text x="40" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Czerwony: blokada „fragmentation needed” = PMTUD black hole (TLS wisi, ping działa) — lekcja 11.</text><text x="40" y="414" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Zielone: komunikaty błędów potrzebne do diagnozy; Echo można ograniczać (rate limit), ale nie wycinać wszystkiego.</text><text x="40" y="436" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">IPv6: ICMPv6 jest obowiązkowy (ND, RA, Packet Too Big) — blokada całego ICMPv6 wyłącza IPv6 (RFC 4890).</text>
</svg>
