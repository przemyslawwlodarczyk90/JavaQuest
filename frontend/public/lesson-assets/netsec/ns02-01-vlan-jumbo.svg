t-anchor="middle">pakiet IP</text><rect x="722" y="80" width="44" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="744" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">FCS</text><text x="744" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">4 B</text><text x="40" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">z tagiem VLAN: maks. 1522 B (+4 B: TPID 2 B, TCI = PCP + DEI + VLAN ID 2 B)</text><rect x="40" y="180" width="66" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="73" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">MAC dst</text><text x="73" y="217" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">6 B</text><rect x="106" y="180" width="66" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="139" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">MAC src</text><text x="139" y="217" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">6 B</text><rect x="172" y="180" width="55" height="46" rx="3" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="199.5" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">TPID</text><text x="199.5" y="217" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">0x8100</text><rect x="227" y="180" width="55" height="46" rx="3" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="254.5" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">TCI</text><text x="254.5" y="217" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">VLAN ID</text><rect x="282" y="180" width="44" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="304" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">Type</text><text x="304" y="217" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">2 B</text><rect x="326" y="180" width="396" height="46" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="524" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2f6fb3" text-anchor="middle" font-weight="700">dane ≤ 1500 B</text><text x="524" y="217" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">pakiet IP</text><rect x="722" y="180" width="44" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="744" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">FCS</text><text x="744" y="217" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">4 B</text><text x="450" y="290" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Jumbo frames: dane do ok. 9000 B (MTU 9000; w AWS w VPC 9001) — mniej ramek i przerwań, ale wszystkie urządzenia w drodze muszą je obsługiwać.</text><text x="450" y="312" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Tag VLAN nie zmienia MTU (1500 dla pakietu IP) — rośnie ramka, nie miejsce na dane.</text>
</svg>
