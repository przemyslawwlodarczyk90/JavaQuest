<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Porównanie ramki zwykłej do 1518 bajtów i ramki z tagiem 802.1Q do 1522 bajtów: tag zawiera TPID 0x8100 oraz pola PCP, DEI i VLAN ID; adnotacja o jumbo frames do 9000 bajtów danych">
<title>Porównanie ramki zwykłej do 1518 bajtów i ramki z tagiem 802.1Q do 1522 bajtów: tag zawiera TPID 0x8100 oraz pola PCP, DEI i VLAN ID; adnotacja o jumbo frames do 9000 bajtów danych</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#fbf8f3"/>
