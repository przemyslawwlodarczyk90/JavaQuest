<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Po lewej dwa łącza 1G między SW1 i SW2 bez agregacji: STP blokuje jedno z nich, więc aktywne jest tylko jedno. Po prawej Port-channel1 z LACP: oba łącza aktywne jako jedno łącze logiczne, które STP traktuje jak jeden port. Pojedynczy przepływ TCP nadal korzysta z jednego kabla.">
<title>Po lewej dwa łącza 1G między SW1 i SW2 bez agregacji: STP blokuje jedno z nich, więc aktywne jest tylko jedno. Po prawej Port-channel1 z LACP: oba łącza aktywne jako jedno łącze logiczne, które STP traktuje jak jeden port. Pojedynczy przepływ TCP nadal korzysta z jednego kabla.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Dwa kable między przełącznikami: STP blokuje jeden, EtherChannel używa obu</text><rect x="40" y="56" width="400" height="250" rx="10" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="240" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">Bez agregacji: 1 × 1G aktywne</text><rect x="170" y="100" width="140" height="40" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="240" y="125" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">SW1</text><rect x="170" y="230" width="140" height="40" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="240" y="255" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">SW2</text><line x1="210" y1="142" x2="210" y2="228" stroke="#2e7d4f" stroke-width="4"/><line x1="270" y1="142" x2="270" y2="228" stroke="#d9d0c3" stroke-width="4" stroke-dasharray="6 5"/><rect x="258" y="172" width="24" height="24" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="270" y="189" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">✕</text><text x="292" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" font-weight="700">STP: alternate</text><text x="240" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">awaria aktywnego kabla = przebudowa STP</text><rect x="460" y="56" width="400" height="250" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="660" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Port-channel1 (LACP): 2 × 1G aktywne</text><rect x="590" y="100" width="140" height="40" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="660" y="125" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">SW1</text><rect x="590" y="230" width="140" height="40" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="660" y="255" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">SW2</text><line x1="630" y1="142" x2="630" y2="228" stroke="#2e7d4f" stroke-width="4"/><line x1="690" y1="142" x2="690" y2="228" stroke="#2e7d4f" stroke-width="4"/><ellipse cx="660" cy="185" rx="62" ry="22" fill="none" stroke="#6a4c9c" stroke-width="2"/><text x="750" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" font-weight="700">jedno łącze logiczne</text><text x="660" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">STP widzi Po1 jako jeden port · awaria kabla = brak zmiany topologii</text><text x="450" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Agregat zwiększa sumaryczną przepustowość i odporność — ale pojedynczy przepływ TCP nadal jedzie jednym kablem.</text>
</svg>
