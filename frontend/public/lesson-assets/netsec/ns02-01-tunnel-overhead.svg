t><text x="795.88" y="198" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" font-weight="700">−24 B</text><text x="260" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="end" font-weight="700">VXLAN (K8s overlay)</text><rect x="270" y="234" width="478.5" height="30" rx="3" fill="#2f6fb3" opacity="0.8"/><rect x="748.5" y="234" width="60" height="30" rx="3" fill="#b23b3b" opacity="0.85"/><text x="509.25" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">MTU wewnątrz: 1450</text><text x="818.5" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" font-weight="700">−50 B</text><text x="260" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="end" font-weight="700">IPsec ESP (tryb tunelowy, typowo)</text><rect x="270" y="290" width="470.91" height="30" rx="3" fill="#2f6fb3" opacity="0.8"/><rect x="740.9100000000001" y="290" width="87.6" height="30" rx="3" fill="#b23b3b" opacity="0.85"/><text x="505.45500000000004" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">MTU wewnątrz: 1427</text><text x="838.5100000000001" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" font-weight="700">−73 B</text><text x="260" y="366" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="end" font-weight="700">WireGuard (rezerwa na IPv6)</text><rect x="270" y="346" width="468.6" height="30" rx="3" fill="#2f6fb3" opacity="0.8"/><rect x="738.6" y="346" width="96" height="30" rx="3" fill="#b23b3b" opacity="0.85"/><text x="504.3" y="366" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">MTU wewnątrz: 1420</text><text x="844.6" y="366" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" font-weight="700">−80 B</text><text x="450" y="404" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">Czerwony fragment (w powiększeniu) to nagłówki tunelu. Za duże pakiety bez działającego PMTUD giną po cichu.</text>
