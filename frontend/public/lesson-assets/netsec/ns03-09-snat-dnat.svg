<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="SNAT: pakiet 192.168.1.20:51000 do 93.184.216.34:443 po przejściu przez router ma źródło 203.0.113.5:51000, a odpowiedź jest tłumaczona z powrotem dzięki conntrack. DNAT: pakiet z 198.51.100.9 do 203.0.113.5:8443 jest przekierowany na 192.168.1.30:443. Masquerade to SNAT na adres interfejsu.">
<title>SNAT: pakiet 192.168.1.20:51000 do 93.184.216.34:443 po przejściu przez router ma źródło 203.0.113.5:51000, a odpowiedź jest tłumaczona z powrotem dzięki conntrack. DNAT: pakiet z 198.51.100.9 do 203.0.113.5:8443 jest przekierowany na 192.168.1.30:443. Masquerade to SNAT na adres interfejsu.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="460" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">SNAT (wyjście) i DNAT (port forwarding): co router zmienia w nagłówkach</text><text x="40" y="70" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700">SNAT / PAT — laptop łączy się z serwerem w Internecie</text><rect x="40" y="84" width="240" height="54" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="52" y="106" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">src 192.168.1.20:51000</text><text x="52" y="126" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">dst 93.184.216.34:443</text><rect x="330" y="84" width="200" height="54" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="430" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">router NAT</text><text x="430" y="128" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">conntrack zapamiętuje</text><rect x="620" y="84" width="240" height="54" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="632" y="106" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#b23b3b" font-weight="700">src 203.0.113.5:51000</text><text x="632" y="126" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">dst 93.184.216.34:443</text><line x1="282" y1="111" x2="328" y2="111" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><line x1="532" y1="111" x2="618" y2="111" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="860" y="158" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="end">odpowiedź na :51000 → router odwraca translację</text><text x="40" y="206" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" font-weight="700">DNAT / port forwarding — klient z Internetu łączy się z usługą w LAN</text><rect x="40" y="220" width="240" height="54" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="52" y="242" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">src 198.51.100.9:60111</text><text x="52" y="262" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">dst 203.0.113.5:8443</text><rect x="330" y="220" width="200" height="54" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="430" y="244" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">router NAT</text><text x="430" y="264" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">reguła: :8443 → .30:443</text><rect x="620" y="220" width="240" height="54" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="632" y="242" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">src 198.51.100.9:60111</text><text x="632" y="262" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#b23b3b" font-weight="700">dst 192.168.1.30:443</text><line x1="282" y1="247" x2="328" y2="247" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><line x1="532" y1="247" x2="618" y2="247" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="304" width="820" height="140" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="330" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Masquerade = SNAT na adres interfejsu wyjściowego (dynamiczny adres, np. z DHCP operatora).</text><text x="60" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Router przelicza sumy kontrolne IP i TCP/UDP (zmienił adres/port) i zapisuje przepływ w tablicy conntrack.</text><text x="60" y="378" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Serwer widzi tylko adres publiczny routera — nie zna 192.168.1.20 (dlatego za NAT/proxy „IP klienta” to adres NAT).</text><text x="60" y="402" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14">iptables -t nat -A POSTROUTING -o wan0 -j MASQUERADE</text><text x="60" y="422" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14">iptables -t nat -A PREROUTING -i wan0 -p tcp --dport 8443 -j DNAT --to-destination 192.168.1.30:443</text>
</svg>
