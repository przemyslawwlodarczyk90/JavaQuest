<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Elementy dokumentu zakresu: strony i podpisy, cel, zakres, wyłączenia, okno czasowe, dozwolone metody, kontakty i eskalacja, dane i poufność, raport">
<title>Elementy dokumentu zakresu: strony i podpisy, cel, zakres, wyłączenia, okno czasowe, dozwolone metody, kontakty i eskalacja, dane i poufność, raport</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Dokument zakresu i zasady zaangażowania (rules of engagement)</text><rect x="30" y="56" width="230" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="77" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Strony i podpisy</text><text x="274" y="77" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">zleceniodawca (właściciel systemu), wykonawca, osoba upoważniona do zgody</text><rect x="30" y="96" width="230" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Cel</text><text x="274" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">co sprawdzamy i po co (np. odporność API, skuteczność detekcji SOC)</text><rect x="30" y="136" width="230" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="157" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Zakres (in scope)</text><text x="274" y="157" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">adresy, domeny, aplikacje, konta testowe — wyliczone jawnie</text><rect x="30" y="176" width="230" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="197" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Wyłączenia (out of scope)</text><text x="274" y="197" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">systemy produkcyjne krytyczne, systemy stron trzecich, DoS, socjotechnika</text><rect x="30" y="216" width="230" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="237" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Okno czasowe</text><text x="274" y="237" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">daty, godziny, strefa czasowa; procedura przerwania testu</text><rect x="30" y="256" width="230" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="277" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Dozwolone metody</text><text x="274" y="277" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">narzędzia, intensywność, dane testowe; czego nie wolno (np. eksfiltracja danych)</text><rect x="30" y="296" width="230" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="317" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Kontakty i eskalacja</text><text x="274" y="317" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">kto odbiera telefon o 2:00 i co robić przy znalezisku krytycznym</text><rect x="30" y="336" width="230" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="357" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Dane i poufność</text><text x="274" y="357" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">jak przechowywać i usuwać dowody, NDA, RODO</text><rect x="30" y="376" width="230" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="397" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Raport</text><text x="274" y="397" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">format, termin, retest</text>
</svg>
