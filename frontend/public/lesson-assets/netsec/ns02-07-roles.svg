="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" text-anchor="middle" font-weight="700">p2 ALT</text><rect x="170" y="80" width="160" height="60" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="250" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">CORE1 (root)</text><text x="250" y="120" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1f1a14" text-anchor="middle">prio 24576 · 00:01</text><text x="250" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">koszt do roota: 0</text><rect x="570" y="80" width="160" height="60" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="650" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">CORE2</text><text x="650" y="120" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1f1a14" text-anchor="middle">prio 28672 · 00:02</text><text x="650" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">koszt do roota: 2</text><rect x="170" y="300" width="160" height="60" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="250" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">ACC1</text><text x="250" y="340" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1f1a14" text-anchor="middle">prio 32768 · 00:01</text><text x="250" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">koszt do roota: 4</text><rect x="570" y="300" width="160" height="60" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="650" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">ACC2</text><text x="650" y="340" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1f1a14" text-anchor="middle">prio 32768 · 00:02</text><text x="650" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">koszt do roota: 4</text><rect x="40" y="395" width="820" height="60" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="450" y="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">Łącza ukośne: 1G (koszt 4). Koszty STP w trybie short: 10G = 2, 1G = 4, 100M = 19.</text><text x="60" y="418" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">RP — root port (najtańsza droga do roota) · DP — designated port (jeden na segment, przekazuje w stronę od roota)</text><text x="60" y="440" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">ALT — alternate: zablokowany zapasowy root port; w RSTP przejmuje ruch w ~1 s po awarii RP</text>
