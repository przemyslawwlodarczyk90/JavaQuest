<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Topologia czterech przełączników: CORE1 (priorytet 24576, root), CORE2, ACC1 i ACC2, z łączami 10G między rdzeniami i 1G do przełączników dostępowych. Wyliczone role: wszystkie porty CORE1 designated, CORE2 port 1 root, ACC1 i ACC2 mają root port w stronę CORE1, a porty w stronę CORE2 są alternate (zablokowane); koszty do roota: CORE2 2, ACC1 4, ACC2 4.">
<title>Topologia czterech przełączników: CORE1 (priorytet 24576, root), CORE2, ACC1 i ACC2, z łączami 10G między rdzeniami i 1G do przełączników dostępowych. Wyliczone role: wszystkie porty CORE1 designated, CORE2 port 1 root, ACC1 i ACC2 mają root port w stronę CORE1, a porty w stronę CORE2 są alternate (zablokowane); koszty do roota: CORE2 2, ACC1 4, ACC2 4.</title>
