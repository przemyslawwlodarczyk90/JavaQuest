<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Schemat decyzji hosta: ta sama sieć czy brama domyślna">
<title>Schemat decyzji hosta: ta sama sieć czy brama domyślna</title>
<rect width="820" height="400" rx="14" fill="#fbf8f3"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs><text x="410" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Maska rozstrzyga: dostarczyć bezpośrednio czy oddać bramie?</text><rect x="30" y="60" width="250" height="92" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="155" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">Host A wysyła pakiet</text><text x="155" y="110" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="middle">mój adres: 192.168.1.10/24</text><text x="155" y="132" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="middle">cel: 192.168.1.77 lub 8.8.8.8</text><line x1="280" y1="106" x2="318" y2="106" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="320" y="60" width="250" height="92" rx="10" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="445" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">Policz adresy sieci</text><text x="445" y="110" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">moja = 192.168.1.10 AND maska</text><text x="445" y="132" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">celu = adres celu AND maska</text><line x1="570" y1="106" x2="618" y2="106" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><polygon points="690,62 760,106 690,150 620,106" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="690" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">sieci</text><text x="690" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">równe?</text><line x1="690" y1="150" x2="690" y2="186" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="702" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" font-weight="700">TAK</text><rect x="520" y="188" width="280" height="120" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="660" y="214" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Ta sama sieć (192.168.1.77)</text><text x="660" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">1. ARP: „kto ma 192.168.1.77?”</text><text x="660" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">2. ramka na MAC odbiorcy</text><text x="660" y="284" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" text-anchor="middle">switch dostarcza ją w LAN</text><path d="M620,106 L600,106 L600,170 L180,170 L180,186" fill="none" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="392" y="162" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">NIE</text><rect x="30" y="188" width="300" height="120" rx="10" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="180" y="214" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">Inna sieć (8.8.8.8)</text><text x="180" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">1. ARP o MAC bramy 192.168.1.1</text><text x="180" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">2. ramka na MAC bramy,</text><text x="180" y="284" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" text-anchor="middle">w pakiecie IP nadal cel 8.8.8.8</text><text x="410" y="345" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6b6257" text-anchor="middle">Maska nie jest wysyłana w pakiecie — każdy host stosuje ją lokalnie.</text><text x="410" y="370" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6b6257" text-anchor="middle">Dlatego zła maska na jednym hoście psuje komunikację tylko „w jedną stronę”.</text>
</svg>
