<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="System szesnastkowy: bajt 0xC0 jako dwa nibble, cyfry A-F, MAC i IPv6 w hex">
<title>System szesnastkowy: bajt 0xC0 jako dwa nibble, cyfry A-F, MAC i IPv6 w hex</title>
<rect width="820" height="380" rx="14" fill="#fbf8f3"/>
<text x="410" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Szesnastkowy: jedna cyfra hex = 4 bity (nibble)</text><rect x="40" y="60" width="360" height="140" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="220" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">Bajt 192 = 0xC0</text><rect x="70" y="100" width="140" height="40" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="140" y="127" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#2f6fb3" text-anchor="middle" font-weight="700">1100</text><rect x="230" y="100" width="140" height="40" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="300" y="127" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#c46a12" text-anchor="middle" font-weight="700">0000</text><text x="140" y="168" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle">8+4 = 12 = C</text><text x="300" y="168" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle">0</text><text x="220" y="190" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6b6257" text-anchor="middle">C·16 + 0 = 192</text><rect x="420" y="60" width="360" height="140" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="600" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">Cyfry 10–15</text><text x="440" y="116" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14">A = 10 = 1010</text><text x="552" y="116" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14">B = 11 = 1011</text><text x="664" y="116" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14">C = 12 = 1100</text><text x="440" y="156" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14">D = 13 = 1101</text><text x="552" y="156" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14">E = 14 = 1110</text><text x="664" y="156" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14">F = 15 = 1111</text><rect x="40" y="220" width="740" height="64" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="246" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">MAC (48 bitów = 6 bajtów = 12 cyfr hex):</text><text x="60" y="270" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">02:42:AC:11:00:02   — MAC kontenera Dockera; AC.11.00.02 hex = 172.17.0.2</text><rect x="40" y="296" width="740" height="64" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">IPv6 (128 bitów = 8 grup po 16 bitów = 4 cyfry hex w grupie):</text><text x="60" y="346" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">2001:0db8:0000:0000:0000:ff00:0042:8329  →  2001:db8::ff00:42:8329</text>
</svg>
