<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Podział 192.168.10.0/24 metodą VLSM: Biuro 100 hostów → /25 (.0–.127), Magazyn 50 → /26 (.128), Serwery 20 → /27 (.192), Zarządzanie 10 → /28 (.224), łącze punkt-punkt 2 → /30 (.240); wolne 12 adresów.">
<title>Podział 192.168.10.0/24 metodą VLSM: Biuro 100 hostów → /25 (.0–.127), Magazyn 50 → /26 (.128), Serwery 20 → /27 (.192), Zarządzanie 10 → /28 (.224), łącze punkt-punkt 2 → /30 (.240); wolne 12 adresów.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="360" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">VLSM: 192.168.10.0/24 podzielone według potrzeb — od największej podsieci</text><rect x="50" y="60" width="399" height="70" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="250" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="middle" font-weight="700">Biuro</text><text x="250" y="110" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">/25</text><text x="50" y="172" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Biuro: potrzeba 100 → 192.168.10.0/25 (126 hostów: 192.168.10.1 – 192.168.10.126)</text><rect x="450" y="60" width="199" height="70" rx="3" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="550" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">Magazyn</text><text x="550" y="110" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">/26</text><text x="50" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f">Magazyn: potrzeba 50 → 192.168.10.128/26 (62 hostów: 192.168.10.129 – 192.168.10.190)</text><rect x="650" y="60" width="99" height="70" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="700" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="700">Serwery</text><text x="700" y="110" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">/27</text><text x="50" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12">Serwery: potrzeba 20 → 192.168.10.192/27 (30 hostów: 192.168.10.193 – 192.168.10.222)</text><rect x="750" y="60" width="49" height="70" rx="3" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="50" y="244" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c">Zarządzanie: potrzeba 10 → 192.168.10.224/28 (14 hostów: 192.168.10.225 – 192.168.10.238)</text><rect x="800" y="60" width="11.5" height="70" rx="3" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="50" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b">Łącze P2P: potrzeba 2 → 192.168.10.240/30 (2 hostów: 192.168.10.241 – 192.168.10.242)</text><rect x="812.5" y="60" width="37.5" height="70" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="831.25" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">wolne</text><text x="50" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257">.0</text><text x="450" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">.128</text><text x="650" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">.192</text><text x="850" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="end">.255</text><text x="50" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Zajęte 244 z 256 adresów, wolne 12 (192.168.10.244/30, .248/29) — na kolejne łącza P2P.</text><text x="50" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" font-weight="700">Bez VLSM (wszystko /25): tylko 2 podsieci. Kolejność „od największej” gwarantuje wyrównanie granic.</text>
</svg>
