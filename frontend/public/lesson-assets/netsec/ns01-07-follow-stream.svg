<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Okno Follow TCP Stream: żądanie GET klienta na czerwono i odpowiedź JSON serwera na niebiesko, z uwagą, że przechwycony ruch jawny zawiera dane osobowe">
<title>Okno Follow TCP Stream: żądanie GET klienta na czerwono i odpowiedź JSON serwera na niebiesko, z uwagą, że przechwycony ruch jawny zawiera dane osobowe</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Follow TCP Stream: rozmowa złożona z wielu segmentów</text><rect x="30" y="56" width="840" height="260" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="82" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#b23b3b">GET /users/42 HTTP/1.1</text><text x="50" y="107" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#b23b3b">Host: api.javaquest.local</text><text x="50" y="132" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#b23b3b">Accept: application/json</text><text x="50" y="157" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#b23b3b">·</text><text x="50" y="182" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2f6fb3">HTTP/1.1 200</text><text x="50" y="207" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2f6fb3">Content-Type: application/json</text><text x="50" y="232" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2f6fb3">Content-Length: 51</text><text x="50" y="257" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2f6fb3">·</text><text x="50" y="282" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2f6fb3">{&quot;id&quot;:42,&quot;login&quot;:&quot;anna&quot;,&quot;email&quot;:&quot;anna@example.com&quot;}</text><rect x="600" y="70" width="250" height="54" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="725" y="93" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">czerwony: klient → serwer</text><text x="725" y="112" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">filtr: tcp.stream eq 3</text><rect x="600" y="136" width="250" height="40" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="725" y="161" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" text-anchor="middle" font-weight="700">niebieski: serwer → klient</text><rect x="600" y="228" width="250" height="76" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="725" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" text-anchor="middle" font-weight="700">Uwaga: dane osobowe!</text><text x="725" y="270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">pcap z ruchem jawnym to</text><text x="725" y="288" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">dane wrażliwe (RODO)</text><text x="450" y="346" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">Wireshark skleja segmenty w strumień po czwórce adresów i portów — widzisz to, co zobaczyła aplikacja.</text><text x="450" y="368" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">Przy HTTPS bez kluczy sesji zobaczysz tylko rekordy TLS (Application Data).</text>
</svg>
