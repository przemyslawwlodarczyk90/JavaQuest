<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Tabela porównawcza: HSRP (Cisco, active/standby, MAC 00:00:0c:07:ac:XX, hello 3 s hold 10 s, preempt wyłączony), VRRP (IETF RFC 5798, master/backup, MAC 00:00:5e:00:01:XX, advert 1 s, preempt włączony, adres może należeć do routera), GLBP (Cisco, AVG i do czterech AVF, równoważenie ruchu przez różne MAC). Na Linuksie keepalived.">
<title>Tabela porównawcza: HSRP (Cisco, active/standby, MAC 00:00:0c:07:ac:XX, hello 3 s hold 10 s, preempt wyłączony), VRRP (IETF RFC 5798, master/backup, MAC 00:00:5e:00:01:XX, advert 1 s, preempt włączony, adres może należeć do routera), GLBP (Cisco, AVG i do czterech AVF, równoważenie ruchu przez różne MAC). Na Linuksie keepalived.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">HSRP vs VRRP vs GLBP</text><text x="50" y="64" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" font-weight="700"></text><text x="260" y="64" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700">HSRP</text><text x="480" y="64" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" font-weight="700">VRRP</text><text x="690" y="64" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" font-weight="700">GLBP</text><line x1="40" y1="72" x2="860" y2="72" stroke="#d9d0c3" stroke-width="1"/><text x="50" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">standard</text><text x="260" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Cisco (RFC 2281, v2)</text><text x="480" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IETF (RFC 5798, v3)</text><text x="690" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Cisco</text><line x1="40" y1="102" x2="860" y2="102" stroke="#d9d0c3" stroke-width="1"/><text x="50" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">role</text><text x="260" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">active / standby</text><text x="480" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">master / backup</text><text x="690" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">AVG + do 4 AVF</text><line x1="40" y1="132" x2="860" y2="132" stroke="#d9d0c3" stroke-width="1"/><text x="50" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">wirtualny MAC</text><text x="260" y="152" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">00:00:0c:07:ac:0a (v1)</text><text x="480" y="152" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">00:00:5e:00:01:0a</text><text x="690" y="152" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">00:07:b4:0X:XX:YY</text><text x="50" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700"></text><text x="260" y="182" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">00:00:0c:9f:f0:0a (v2)</text><text x="480" y="182" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">00:00:5e:00:02:XX (IPv6)</text><text x="690" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14"></text><line x1="40" y1="192" x2="860" y2="192" stroke="#d9d0c3" stroke-width="1"/><text x="50" y="212" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">multicast</text><text x="260" y="212" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">224.0.0.2 / .102 (v2)</text><text x="480" y="212" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">224.0.0.18, ff02::12</text><text x="690" y="212" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">224.0.0.102</text><line x1="40" y1="222" x2="860" y2="222" stroke="#d9d0c3" stroke-width="1"/><text x="50" y="242" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">timery domyślne</text><text x="260" y="242" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">hello 3 s / hold 10 s</text><text x="480" y="242" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">advert 1 s / ~3,6 s</text><text x="690" y="242" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">hello 3 s / hold 10 s</text><line x1="40" y1="252" x2="860" y2="252" stroke="#d9d0c3" stroke-width="1"/><text x="50" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">preempt domyślnie</text><text x="260" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">wyłączony</text><text x="480" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">włączony</text><text x="690" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">wyłączony (AVG)</text><line x1="40" y1="282" x2="860" y2="282" stroke="#d9d0c3" stroke-width="1"/><text x="50" y="302" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">adres = adres routera</text><text x="260" y="302" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">nie</text><text x="480" y="302" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">tak (owner, prio 255)</text><text x="690" y="302" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">nie</text><line x1="40" y1="312" x2="860" y2="312" stroke="#d9d0c3" stroke-width="1"/><text x="50" y="332" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">równoważenie ruchu</text><text x="260" y="332" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">nie (kilka grup)</text><text x="480" y="332" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">nie (kilka grup)</text><text x="690" y="332" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">tak — różne MAC w ARP</text><text x="40" y="376" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">Linux: keepalived (VRRP) — standard przed parą HAProxy/Nginx, bramami VPN i bazami (wirtualny IP).</text>
</svg>
