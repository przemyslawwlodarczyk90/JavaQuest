<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Router Advertisement z prefiksem 2001:db8:10::/64 i flagami A (SLAAC), M (adresy z DHCPv6), O (inne informacje z DHCPv6) oraz RDNSS. Obliczenie EUI-64 z MAC 52:54:00:12:34:56: wstawienie ff:fe i odwrócenie bitu U/L daje identyfikator 5054:ff:fe12:3456 i adres 2001:db8:10::5054:ff:fe12:3456. Uwagi o prywatności, DAD i RA Guard.">
<title>Router Advertisement z prefiksem 2001:db8:10::/64 i flagami A (SLAAC), M (adresy z DHCPv6), O (inne informacje z DHCPv6) oraz RDNSS. Obliczenie EUI-64 z MAC 52:54:00:12:34:56: wstawienie ff:fe i odwrócenie bitu U/L daje identyfikator 5054:ff:fe12:3456 i adres 2001:db8:10::5054:ff:fe12:3456. Uwagi o prywatności, DAD i RA Guard.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">IPv6 bez DHCP: Router Advertisement + SLAAC</text><rect x="40" y="56" width="820" height="110" rx="8" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="60" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" font-weight="700">RA od routera (ICMPv6 134, ff02::1): prefiks 2001:db8:10::/64, flagi M, O, A, brama = adres link-local routera</text><rect x="60" y="96" width="190" height="56" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="155" y="118" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">A=1</text><text x="155" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">host sam tworzy adres (SLAAC)</text><rect x="260" y="96" width="190" height="56" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="355" y="118" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">M=1</text><text x="355" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">adresy z DHCPv6 (stanowy)</text><rect x="460" y="96" width="190" height="56" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="555" y="118" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">O=1</text><text x="555" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">inne informacje (DNS) z DHCPv6</text><rect x="660" y="96" width="190" height="56" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="755" y="118" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">RDNSS</text><text x="755" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">DNS wprost w RA (RFC 8106)</text><text x="60" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">EUI-64 z MAC 52:54:00:12:34:56:</text><rect x="60" y="214" width="190" height="64" rx="6" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="155" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">MAC</text><text x="155" y="262" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">52:54:00 | 12:34:56</text><rect x="260" y="214" width="190" height="64" rx="6" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="355" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">wstaw ff:fe w środek</text><text x="355" y="262" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">52:54:00:ff:fe:12:34:56</text><rect x="460" y="214" width="190" height="64" rx="6" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="555" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">odwróć bit U/L (0x02 w 1. bajcie)</text><text x="555" y="262" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">50:54:00:ff:fe:12:34:56</text><rect x="660" y="214" width="190" height="64" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="755" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">identyfikator interfejsu</text><text x="755" y="262" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">5054:ff:fe12:3456</text><rect x="40" y="296" width="820" height="110" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="60" y="322" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" font-weight="700">adres globalny: 2001:db8:10::5054:ff:fe12:3456   link-local: fe80::5054:ff:fe12:3456</text><text x="60" y="348" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Prywatność: EUI-64 zdradza MAC (śledzenie urządzenia) → systemy używają adresów losowych (RFC 8981 temporary, RFC 7217 stable).</text><text x="60" y="372" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Przed użyciem adresu: DAD (Duplicate Address Detection) przez NS do adresu solicited-node — lekcja 03.</text><text x="60" y="394" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Bezpieczeństwo: fałszywe RA (rogue RA) przejmują ruch IPv6 → RA Guard na przełącznikach.</text>
</svg>
