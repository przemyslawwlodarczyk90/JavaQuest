<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Struktura Bridge ID: 4 bity priorytetu, 12 bitów system ID extension równego numerowi VLAN i 48 bitów adresu MAC; przykład 32768 plus VLAN 10 daje 32778. Najważniejsze pola BPDU: Root Identifier, Root Path Cost, Bridge Identifier, Port Identifier, flagi RSTP i timery. Kolejność porównań: Root ID, koszt, Bridge ID nadawcy, Port ID.">
<title>Struktura Bridge ID: 4 bity priorytetu, 12 bitów system ID extension równego numerowi VLAN i 48 bitów adresu MAC; przykład 32768 plus VLAN 10 daje 32778. Najważniejsze pola BPDU: Root Identifier, Root Path Cost, Bridge Identifier, Port Identifier, flagi RSTP i timery. Kolejność porównań: Root ID, koszt, Bridge ID nadawcy, Port ID.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Bridge ID (8 bajtów) i najważniejsze pola BPDU</text><rect x="60" y="60" width="120" height="52" rx="4" fill="#fbe6cf" stroke="#1f1a14" stroke-width="1.5"/><text x="120" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">priorytet</text><text x="120" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">4 bity</text><text x="120" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">0…61440, co 4096</text><rect x="180" y="60" width="200" height="52" rx="4" fill="#dcefe3" stroke="#1f1a14" stroke-width="1.5"/><text x="280" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">system ID ext.</text><text x="280" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">12 bitów</text><text x="280" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">= numer VLAN (PVST+)</text><rect x="380" y="60" width="440" height="52" rx="4" fill="#dce9f7" stroke="#1f1a14" stroke-width="1.5"/><text x="600" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">adres MAC</text><text x="600" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">48 bitów</text><text x="600" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">rozstrzyga remis</text><text x="60" y="160" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" font-weight="700">Przykład: 32768 + VLAN 10 = 32778 · 00:0c:29:aa:00:01  → mniejszy = lepszy</text><rect x="60" y="186" width="255" height="58" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="72" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" font-weight="700">Root Identifier</text><text x="72" y="230" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14">kogo nadawca uważa za roota</text><rect x="330" y="186" width="255" height="58" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="342" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" font-weight="700">Root Path Cost</text><text x="342" y="230" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14">koszt nadawcy do roota</text><rect x="600" y="186" width="255" height="58" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="612" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" font-weight="700">Bridge Identifier</text><text x="612" y="230" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14">kto wysyła</text><rect x="60" y="256" width="255" height="58" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="72" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" font-weight="700">Port Identifier</text><text x="72" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14">z którego portu (128.N)</text><rect x="330" y="256" width="255" height="58" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="342" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" font-weight="700">Flags (RSTP)</text><text x="342" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14">rola portu, proposal, agreement, TC</text><rect x="600" y="256" width="255" height="58" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="612" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" font-weight="700">Timery</text><text x="612" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14">hello 2 s, max age 20 s, forward delay 15 s</text><text x="450" y="356" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Porównanie BPDU: najniższy Root ID → najniższy koszt → najniższy Bridge ID nadawcy → najniższy Port ID.</text>
</svg>
