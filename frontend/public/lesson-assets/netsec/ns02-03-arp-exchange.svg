<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Diagram sekwencji ARP: laptop wysyła rozgłoszeniowe zapytanie o MAC bramy, pozostałe hosty je ignorują, brama odpowiada unicastem ze swoim adresem MAC, obie strony zapisują wpis w cache, potem laptop wysyła ramkę z pakietem IP do MAC bramy">
<title>Diagram sekwencji ARP: laptop wysyła rozgłoszeniowe zapytanie o MAC bramy, pozostałe hosty je ignorują, brama odpowiada unicastem ze swoim adresem MAC, obie strony zapisują wpis w cache, potem laptop wysyła ramkę z pakietem IP do MAC bramy</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">ARP: „kto ma 192.168.1.1?” — „ja, mój MAC to …”</text><rect x="40" y="52" width="220" height="34" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="150" y="74" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">laptop 192.168.1.20</text><line x1="150" y1="88" x2="150" y2="380" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><rect x="340" y="52" width="220" height="34" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="450" y="74" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">inne hosty w VLAN</text><line x1="450" y1="88" x2="450" y2="380" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><rect x="640" y="52" width="220" height="34" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="750" y="74" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">brama 192.168.1.1</text><line x1="750" y1="88" x2="750" y2="380" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><line x1="150" y1="130" x2="440" y2="130" stroke="#c46a12" stroke-width="3" marker-end="url(#arr)"/><line x1="150" y1="130" x2="740" y2="150" stroke="#c46a12" stroke-width="3" marker-end="url(#arr)"/><text x="300" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" text-anchor="middle" font-weight="700">ARP Request (broadcast ff:ff:ff:ff:ff:ff)</text><text x="450" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">ignorują (nie ich adres)</text><line x1="750" y1="220" x2="160" y2="220" stroke="#2e7d4f" stroke-width="3" marker-end="url(#arr)"/><text x="450" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">ARP Reply (unicast do laptopa): 192.168.1.1 is-at 00:1a:2b:3c:4d:5e</text><rect x="30" y="250" width="300" height="70" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="180" y="274" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">cache ARP laptopa</text><text x="180" y="298" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">192.168.1.1 → 00:1a:2b:3c:4d:5e REACHABLE</text><rect x="600" y="250" width="300" height="70" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="750" y="274" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">brama też zapamiętuje</text><text x="750" y="298" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">192.168.1.20 → MAC laptopa</text><line x1="150" y1="350" x2="740" y2="350" stroke="#6a4c9c" stroke-width="3" marker-end="url(#arr)"/><text x="450" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">dopiero teraz: ramka z pakietem IP do MAC bramy</text><text x="450" y="404" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">ARP nie ma uwierzytelnienia: każdy w segmencie może odpowiedzieć — stąd ARP spoofing i obrona DAI.</text>
</svg>
