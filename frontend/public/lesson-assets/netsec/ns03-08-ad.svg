<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Wykres dystansów administracyjnych: connected 0, static 1, eBGP 20, EIGRP 90, OSPF 110, IS-IS 115, RIP 120, EIGRP zewnętrzny 170, iBGP 200, 255 nieużywana. Przykład: ta sama sieć 10.50.0.0/16 z OSPF (AD 110) i statyczna (AD 1) — do RIB trafia statyczna. Kolejność: najdłuższy prefiks, potem AD, potem metryka.">
<title>Wykres dystansów administracyjnych: connected 0, static 1, eBGP 20, EIGRP 90, OSPF 110, IS-IS 115, RIP 120, EIGRP zewnętrzny 170, iBGP 200, 255 nieużywana. Przykład: ta sama sieć 10.50.0.0/16 z OSPF (AD 110) i statyczna (AD 1) — do RIB trafia statyczna. Kolejność: najdłuższy prefiks, potem AD, potem metryka.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Dystans administracyjny (Cisco): komu router bardziej wierzy?</text><rect x="60" y="52" width="40" height="24" rx="3" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="110" y="69" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">0  connected</text><rect x="60" y="82" width="41.6" height="24" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="111.6" y="99" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">1  static</text><rect x="60" y="112" width="72" height="24" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="142" y="129" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">20  eBGP</text><rect x="60" y="142" width="184" height="24" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="254" y="159" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">90  EIGRP (wewn.)</text><rect x="60" y="172" width="216" height="24" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="286" y="189" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">110  OSPF</text><rect x="60" y="202" width="224" height="24" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="294" y="219" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">115  IS-IS</text><rect x="60" y="232" width="232" height="24" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="302" y="249" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">120  RIP</text><rect x="60" y="262" width="312" height="24" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="382" y="279" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">170  EIGRP (zewn.)</text><rect x="60" y="292" width="360" height="24" rx="3" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="430" y="309" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">200  iBGP</text><rect x="60" y="322" width="448" height="24" rx="3" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="518" y="339" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">255  nieosiągalna (unusable)</text><rect x="520" y="60" width="340" height="180" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="536" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">Ta sama sieć z dwóch źródeł:</text><text x="536" y="108" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14">OSPF  10.50.0.0/16 [110/20] via 10.0.0.2</text><text x="536" y="128" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14">static 10.50.0.0/16 [1/0] via 10.0.0.6</text><text x="536" y="154" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2e7d4f" font-weight="700">→ w RIB: 10.50.0.0/16 [1/0] via 10.0.0.6 (Gi0/2)</text><text x="536" y="184" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Najpierw AD (niższy wygrywa), metryka</text><text x="536" y="204" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">porównywana tylko w obrębie protokołu.</text><text x="536" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Prefiks (LPM) i tak jest ważniejszy od AD.</text><text x="60" y="368" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Kolejność: 1) najdłuższy prefiks (w tablicy przekazywania), 2) przy tym samym prefiksie z różnych źródeł — najniższy AD,</text><text x="60" y="390" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">3) w obrębie jednego protokołu — najniższa metryka. AD 255 = trasa nieużywana. Linux (jądro) nie ma AD — ma metrykę;</text><text x="60" y="412" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">AD istnieje w demonach routingu (FRR zebra: „distance”) i w routerach.</text>
</svg>
