<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Obliczenie sumy kontrolnej nagłówka IPv4: pole sumy wyzerowane, 10 słów 16-bitowych zsumowanych do 0x2d914, przeniesienie daje 0xd916, negacja daje 0x26e9. Odbiorca sumuje słowa razem z polem sumy i oczekuje 0xffff. Router przelicza sumę po zmianie TTL; IPv6 nie ma sumy nagłówka.">
<title>Obliczenie sumy kontrolnej nagłówka IPv4: pole sumy wyzerowane, 10 słów 16-bitowych zsumowanych do 0x2d914, przeniesienie daje 0xd916, negacja daje 0x26e9. Odbiorca sumuje słowa razem z polem sumy i oczekuje 0xffff. Router przelicza sumę po zmianie TTL; IPv6 nie ma sumy nagłówka.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Suma kontrolna nagłówka: dodawanie słów 16-bitowych z przeniesieniem i negacja</text><text x="60" y="66" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">1. Pole checksum = 0000, nagłówek dzielimy na 10 słów 16-bitowych:</text><rect x="60" y="78" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="96" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">4500</text><rect x="139" y="78" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="175" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">003c</text><rect x="218" y="78" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="254" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">1c46</text><rect x="297" y="78" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="333" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">4000</text><rect x="376" y="78" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="412" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">4006</text><rect x="455" y="78" width="72" height="32" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="491" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">0000</text><rect x="534" y="78" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="570" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">c0a8</text><rect x="613" y="78" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="649" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">010a</text><rect x="692" y="78" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="728" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">5db8</text><rect x="771" y="78" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="807" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">d822</text><text x="60" y="146" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">2. Suma: 4500 + 003c + 1c46 + 4000 + 4006 + 0000 + c0a8 + 010a + 5db8 + d822 = 0x2d914</text><text x="60" y="180" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">3. Przeniesienie (bity powyżej 16): 0xd914 + 0x2 = 0xd916</text><text x="60" y="214" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2e7d4f" font-weight="700">4. Negacja (NOT, dopełnienie do jedności): ~0xd916 = 0x26e9  ← wpisujemy do nagłówka</text><rect x="60" y="240" width="780" height="160" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="80" y="266" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Weryfikacja u odbiorcy (i na każdym routerze): suma wszystkich 10 słów RAZEM z checksum → 0xffff = OK.</text><text x="80" y="292" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Router zmniejsza TTL, więc MUSI przeliczyć sumę na każdym skoku (RFC 1624 — aktualizacja przyrostowa).</text><text x="80" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Suma chroni tylko NAGŁÓWEK, nie dane — dane chronią TCP/UDP (z pseudo-nagłówkiem IP) i CRC ramki Ethernet.</text><text x="80" y="344" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">W IPv6 nie ma sumy kontrolnej nagłówka — routery pracują szybciej, ochronę dają L2 i L4.</text><text x="80" y="376" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" font-weight="700">Wireshark „checksum incorrect” na pakietach wychodzących = zwykle checksum offload karty sieciowej, nie błąd.</text>
</svg>
