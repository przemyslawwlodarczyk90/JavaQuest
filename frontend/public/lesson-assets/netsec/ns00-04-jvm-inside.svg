<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Łańcuch wewnątrz aplikacji: Tomcat, filtry Spring Security, DispatcherServlet, UserController, UserService, UserRepository, HikariCP i PostgreSQL">
<title>Łańcuch wewnątrz aplikacji: Tomcat, filtry Spring Security, DispatcherServlet, UserController, UserService, UserRepository, HikariCP i PostgreSQL</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Wnętrze aplikacji: od gniazda Tomcata do wiersza w PostgreSQL</text><rect x="40" y="70" width="190" height="100" rx="10" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="135" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">Tomcat</text><text x="135" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">acceptor + wątek z puli</text><text x="135" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">(lub wątek wirtualny)</text><line x1="231" y1="120" x2="248" y2="120" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="250" y="70" width="190" height="100" rx="10" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="345" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">Filtry</text><text x="345" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">Spring Security:</text><text x="345" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">uwierzytelnienie, CSRF, CORS</text><line x1="441" y1="120" x2="458" y2="120" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="460" y="70" width="190" height="100" rx="10" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="555" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">DispatcherServlet</text><text x="555" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">mapowanie</text><text x="555" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">@GetMapping(&quot;/users/{id}&quot;)</text><line x1="651" y1="120" x2="668" y2="120" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="670" y="70" width="190" height="100" rx="10" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="765" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">UserController</text><text x="765" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">walidacja id, wywołanie</text><text x="765" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">serwisu</text><rect x="40" y="220" width="190" height="100" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="135" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">UserService</text><text x="135" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">@Transactional(readOnly =</text><text x="135" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">true)</text><line x1="231" y1="270" x2="248" y2="270" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="250" y="220" width="190" height="100" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="345" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">UserRepository</text><text x="345" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">Spring Data JPA →</text><text x="345" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">Hibernate → SQL</text><line x1="441" y1="270" x2="458" y2="270" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="460" y="220" width="190" height="100" rx="10" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="555" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">HikariCP</text><text x="555" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">połączenie z puli (TCP +</text><text x="555" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">TLS do bazy już otwarte)</text><line x1="651" y1="270" x2="668" y2="270" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="670" y="220" width="190" height="100" rx="10" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="765" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">PostgreSQL</text><text x="765" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">Parse/Bind/Execute →</text><text x="765" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">DataRow → wynik</text><path d="M 765 170 L 765 196 L 135 196 L 135 218" fill="none" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Każdy element ma własną pulę lub kolejkę (wątki, połączenia) i własne timeouty — tam najczęściej rodzą się opóźnienia i awarie.</text>
</svg>
