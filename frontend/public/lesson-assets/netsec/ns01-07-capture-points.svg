m, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">B. bridge docker0</text><text x="622" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">C. eth0 hosta</text><text x="622" y="188" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">D. lo</text><text x="622" y="212" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">E. SPAN/TAP</text><circle cx="490" cy="178" r="11" fill="#b23b3b"/><text x="490" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text><circle cx="395" cy="270" r="11" fill="#b23b3b"/><text x="395" y="274" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text><circle cx="400" cy="330" r="11" fill="#b23b3b"/><text x="400" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">C</text><circle cx="148" cy="330" r="11" fill="#b23b3b"/><text x="148" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">D</text><circle cx="838" cy="250" r="11" fill="#b23b3b"/><text x="838" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">E</text><text x="450" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">A: tylko ta usługa · B: ruch między kontenerami · C: ruch na zewnątrz, już po NAT · D: 127.0.0.1 · E: kopia ruchu z przełącznika (sensor NSM)</text><text x="450" y="418" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font