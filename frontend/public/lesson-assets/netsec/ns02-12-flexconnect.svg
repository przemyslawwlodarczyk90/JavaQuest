<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Dwa panele: w trybie local AP przesyła tunelem CAPWAP zarówno sterowanie, jak i cały ruch klientów do kontrolera WLC w centrali, więc ruch idzie przez WAN; w trybie FlexConnect CAPWAP przenosi tylko sterowanie, a dane klienta trafiają bezpośrednio do lokalnego przełącznika oddziału. CAPWAP używa UDP 5246 i 5247.">
<title>Dwa panele: w trybie local AP przesyła tunelem CAPWAP zarówno sterowanie, jak i cały ruch klientów do kontrolera WLC w centrali, więc ruch idzie przez WAN; w trybie FlexConnect CAPWAP przenosi tylko sterowanie, a dane klienta trafiają bezpośrednio do lokalnego przełącznika oddziału. CAPWAP używa UDP 5246 i 5247.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Gdzie trafia ruch klienta: tryb local (centralny) vs FlexConnect (lokalny)</text><rect x="30" y="56" width="410" height="280" rx="10" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="235" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">Local mode (central switching)</text><rect x="50" y="250" width="90" height="36" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="95" y="273" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">klient</text><rect x="170" y="250" width="70" height="36" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="205" y="273" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP</text><rect x="270" y="250" width="150" height="36" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="345" y="273" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">przełącznik oddziału</text><rect x="290" y="110" width="130" height="40" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="355" y="135" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">WLC (centrala)</text><line x1="140" y1="268" x2="168" y2="268" stroke="#c46a12" stroke-width="2"/><line x1="205" y1="248" x2="320" y2="152" stroke="#2f6fb3" stroke-width="2.5" marker-end="url(#arr)"/><text x="200" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2f6fb3" font-weight="700">CAPWAP: sterowanie + dane</text><text x="235" y="316" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">cały ruch przez kontroler (WAN!)</text><rect x="460" y="56" width="410" height="280" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="665" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">FlexConnect (local switching)</text><rect x="480" y="250" width="90" height="36" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="525" y="273" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">klient</text><rect x="600" y="250" width="70" height="36" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="635" y="273" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">AP</text><rect x="700" y="250" width="150" height="36" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="775" y="273" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">przełącznik oddziału</text><rect x="720" y="110" width="130" height="40" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="785" y="135" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">WLC (centrala)</text><line x1="570" y1="268" x2="598" y2="268" stroke="#c46a12" stroke-width="2"/><line x1="635" y1="248" x2="750" y2="152" stroke="#6a4c9c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="610" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" font-weight="700">CAPWAP: tylko sterowanie</text><line x1="672" y1="268" x2="698" y2="268" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#arr)"/><text x="665" y="316" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">dane wychodzą lokalnie do VLAN-u oddziału</text><text x="450" y="362" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">CAPWAP: UDP 5246 (sterowanie, DTLS) i UDP 5247 (dane). Przy zerwaniu WAN FlexConnect może dalej obsługiwać klientów.</text><text x="450" y="384" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">Kampus z kontrolerem w serwerowni → local; oddziały za WAN → FlexConnect lub AP zarządzane z chmury.</text>
</svg>
