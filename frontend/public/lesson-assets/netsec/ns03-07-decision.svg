<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Kolejność decyzji o trasie: najpierw reguły policy routing wybierają tabelę, potem najdłuższy pasujący prefiks, przy równym prefiksie najniższa metryka, przy pełnej równości ECMP, na końcu wybór następnego skoku i ARP. Polecenia Linux: ip route get, ip rule; Windows: route print, Get-NetRoute, Find-NetRoute.">
<title>Kolejność decyzji o trasie: najpierw reguły policy routing wybierają tabelę, potem najdłuższy pasujący prefiks, przy równym prefiksie najniższa metryka, przy pełnej równości ECMP, na końcu wybór następnego skoku i ARP. Polecenia Linux: ip route get, ip rule; Windows: route print, Get-NetRoute, Find-NetRoute.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Jak system wybiera trasę: reguły → najdłuższy prefiks → metryka</text><rect x="40" y="52" width="820" height="52" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="60" y="74" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" font-weight="700">0. Policy routing (ip rule)</text><text x="60" y="94" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">najpierw wybór TABELI: main, local, tabela VPN/fwmark (np. WireGuard, Kubernetes)</text><rect x="40" y="114" width="820" height="52" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="60" y="136" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700">1. Longest prefix match</text><text x="60" y="156" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">spośród tras pasujących do celu — najdłuższy prefiks (/32 &gt; /24 &gt; /16 &gt; /0)</text><rect x="40" y="176" width="820" height="52" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="60" y="198" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" font-weight="700">2. Metryka / dystans</text><text x="60" y="218" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">przy równym prefiksie: najniższa metryka (Linux), metryka trasy + interfejsu (Windows)</text><rect x="40" y="238" width="820" height="52" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="60" y="260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" font-weight="700">3. ECMP</text><text x="60" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">kilka tras równych we wszystkim → podział ruchu po przepływach (hash 5-tuple)</text><rect x="40" y="300" width="820" height="52" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="60" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" font-weight="700">4. Następny skok</text><text x="60" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">brama (via) → ARP o bramę; brak via (trasa connected) → ARP o sam cel</text><text x="40" y="376" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">Linux:  ip route get 172.18.0.5   ·   ip rule   ·   ip route show table all</text><text x="40" y="400" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">Windows:  route print  ·  Get-NetRoute -DestinationPrefix 0.0.0.0/0  ·  Find-NetRoute -RemoteIPAddress 172.18.0.5</text>
</svg>
