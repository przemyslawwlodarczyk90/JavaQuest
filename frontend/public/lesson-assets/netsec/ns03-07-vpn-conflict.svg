<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Konflikt tras: sieć docker compose 172.18.0.0/16 i trasa VPN 172.18.0.0/17. Kontener 172.18.0.5 trafia do tunelu VPN, bo /17 jest dłuższy, a kontener 172.18.200.5 nadal do mostu Dockera. Dowód: ip route get; naprawa: przeniesienie sieci Dockera poza zakresy firmy.">
<title>Konflikt tras: sieć docker compose 172.18.0.0/16 i trasa VPN 172.18.0.0/17. Kontener 172.18.0.5 trafia do tunelu VPN, bo /17 jest dłuższy, a kontener 172.18.200.5 nadal do mostu Dockera. Dowód: ip route get; naprawa: przeniesienie sieci Dockera poza zakresy firmy.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Debug Lab: VPN „zjada” trasę do sieci Dockera 172.18.0.0/16</text><rect x="60" y="70" width="780" height="46" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="450" y="98" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">docker compose: 172.18.0.0/16 dev br-3f1c</text><rect x="60" y="130" width="390" height="46" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="255" y="158" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">VPN: 172.18.0.0/17 via 10.8.0.1 (tun0)</text><text x="60" y="64" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">172.18.0.0</text><text x="450" y="64" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">172.18.128.0</text><text x="840" y="64" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="end">172.18.255.255</text><rect x="60" y="196" width="380" height="70" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="250" y="222" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">kontener 172.18.0.5 (np. postgres)</text><text x="250" y="246" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#b23b3b" text-anchor="middle">→ 172.18.0.0/17 via 10.8.0.1 dev tun0 metric 50  ✗</text><rect x="460" y="196" width="380" height="70" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="650" y="222" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">kontener 172.18.200.5</text><text x="650" y="246" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2e7d4f" text-anchor="middle">→ 172.18.0.0/16 dev br-3f1c metric 0  ✓</text><text x="60" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Objaw: „po podłączeniu VPN aplikacja nie widzi bazy w Dockerze”, ale tylko dla części kontenerów.</text><text x="60" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">Dowód: ip route get 172.18.0.5 → dev tun0. Przyczyna: /17 z VPN jest dłuższy niż /16 Dockera.</text><text x="60" y="344" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f">Naprawa: przenieś sieci Dockera (daemon.json default-address-pools / networks.ipam w compose) poza zakresy firmy;</text><text x="60" y="366" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f">doraźnie: ip route add 172.18.0.0/17 dev br-3f1c metric 0 — prefiks równy trasie VPN, wygrywa niższa metryka (0 &lt; 50).</text>
</svg>
