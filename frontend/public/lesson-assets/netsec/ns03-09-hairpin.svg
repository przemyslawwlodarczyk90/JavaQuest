<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Hairpin NAT: laptop 192.168.1.20 łączy się z publicznym adresem 203.0.113.5, router robi DNAT na serwer 192.168.1.30 w tym samym LAN, a serwer odpowiada bezpośrednio z adresu prywatnego, więc laptop odrzuca odpowiedź. Rozwiązania: dodatkowy SNAT (hairpin), split-horizon DNS, wewnętrzne endpointy w chmurze.">
<title>Hairpin NAT: laptop 192.168.1.20 łączy się z publicznym adresem 203.0.113.5, router robi DNAT na serwer 192.168.1.30 w tym samym LAN, a serwer odpowiada bezpośrednio z adresu prywatnego, więc laptop odrzuca odpowiedź. Rozwiązania: dodatkowy SNAT (hairpin), split-horizon DNS, wewnętrzne endpointy w chmurze.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">Hairpin NAT (NAT loopback): klient w LAN łączy się z publicznym adresem własnego serwera</text><rect x="60" y="80" width="200" height="60" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="160" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">laptop</text><text x="160" y="126" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">192.168.1.20</text><rect x="350" y="80" width="200" height="60" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="450" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">router NAT</text><text x="450" y="126" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">WAN 203.0.113.5</text><rect x="640" y="80" width="200" height="60" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="740" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">serwer www</text><text x="740" y="126" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">192.168.1.30</text><line x1="262" y1="100" x2="348" y2="100" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="305" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">① do 203.0.113.5:443</text><line x1="552" y1="100" x2="638" y2="100" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="595" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">② DNAT → .30</text><line x1="640" y1="140" x2="262" y2="140" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="450" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" text-anchor="middle">③ bez SNAT: .30 odpowiada BEZPOŚREDNIO do .20 (ten sam LAN) — z adresu .30</text><text x="450" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" text-anchor="middle">laptop czekał na odpowiedź od 203.0.113.5 → odrzuca pakiet (RST / brak połączenia)</text><rect x="60" y="210" width="780" height="170" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="80" y="236" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" font-weight="700">Rozwiązania:</text><text x="80" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• hairpin NAT: dodatkowy SNAT dla ruchu LAN→LAN przez publiczny adres (odpowiedź wraca przez router)</text><text x="80" y="286" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14">  iptables -t nat -A POSTROUTING -s 192.168.1.0/24 -d 192.168.1.30 -p tcp --dport 443 -j MASQUERADE</text><text x="80" y="312" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• split-horizon DNS: www.firma.pl w LAN rozwiązuje się na 192.168.1.30, w Internecie na 203.0.113.5 (lepsze)</text><text x="80" y="338" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• w chmurze: prywatny endpoint / wewnętrzny load balancer zamiast publicznego adresu z wnętrza VPC</text><text x="80" y="362" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">Objaw dla developera: „strona działa z telefonu na LTE, a z biura po domenie nie” (a po IP prywatnym działa).</text>
</svg>
