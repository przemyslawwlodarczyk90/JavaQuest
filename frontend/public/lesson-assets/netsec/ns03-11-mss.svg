<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Tabela narzutów enkapsulacji dla łącza o MTU 1500: PPPoE 8 B (MTU 1492, MSS 1452), GRE 24 B, IPIP 20 B, VXLAN 50 B (1450, MSS 1410), WireGuard 60 lub 80 B (1440 lub 1420), IPsec ESP z NAT-T około 73 B, GENEVE 58 B. MSS clamping przepisuje MSS w pakietach SYN.">
<title>Tabela narzutów enkapsulacji dla łącza o MTU 1500: PPPoE 8 B (MTU 1492, MSS 1452), GRE 24 B, IPIP 20 B, VXLAN 50 B (1450, MSS 1410), WireGuard 60 lub 80 B (1440 lub 1420), IPsec ESP z NAT-T około 73 B, GENEVE 58 B. MSS clamping przepisuje MSS w pakietach SYN.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Narzut tuneli, MTU wewnętrzne i MSS (TCP po IPv4)</text><text x="50" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">enkapsulacja (łącze zewnętrzne MTU 1500)</text><text x="470" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">narzut</text><text x="590" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">MTU wewn.</text><text x="720" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">MSS IPv4</text><rect x="40" y="68" width="820" height="26" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="88" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">PPPoE (DSL/światłowód)</text><text x="470" y="88" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">8 B</text><text x="590" y="88" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">1492</text><text x="720" y="88" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1452</text><rect x="40" y="98" width="820" height="26" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">GRE (bez klucza)</text><text x="470" y="118" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">24 B</text><text x="590" y="118" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">1476</text><text x="720" y="118" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1436</text><rect x="40" y="128" width="820" height="26" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IP-in-IP (IPIP)</text><text x="470" y="148" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">20 B</text><text x="590" y="148" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">1480</text><text x="720" y="148" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1440</text><rect x="40" y="158" width="820" height="26" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">VXLAN (Docker overlay, Flannel, Calico VXLAN)</text><text x="470" y="178" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">50 B</text><text x="590" y="178" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">1450</text><text x="720" y="178" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1410</text><rect x="40" y="188" width="820" height="26" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="208" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">WireGuard (zewnętrzny IPv4)</text><text x="470" y="208" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">60 B</text><text x="590" y="208" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">1440</text><text x="720" y="208" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1400</text><rect x="40" y="218" width="820" height="26" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">WireGuard (zewnętrzny IPv6)</text><text x="470" y="238" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">80 B</text><text x="590" y="238" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">1420</text><text x="720" y="238" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1380</text><rect x="40" y="248" width="820" height="26" rx="3" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IPsec ESP tunnel AES-GCM (IPv4, + NAT-T UDP)</text><text x="470" y="268" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">73 B</text><text x="590" y="268" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">1427</text><text x="720" y="268" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1387</text><rect x="40" y="278" width="820" height="26" rx="3" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">GENEVE (AWS GWLB, OVN)</text><text x="470" y="298" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">58 B</text><text x="590" y="298" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">1442</text><text x="720" y="298" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1402</text><rect x="40" y="336" width="820" height="92" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="60" y="360" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">MSS clamping: router przepisuje opcję MSS w pakietach SYN, więc obie strony od początku wysyłają mniejsze segmenty —</text><text x="60" y="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">działa nawet przy zablokowanym ICMP (dotyczy tylko TCP).</text><text x="60" y="406" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu</text>
</svg>
