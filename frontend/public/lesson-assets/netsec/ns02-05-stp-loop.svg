<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Dwa trójkąty z przełącznikami SW1, SW2 i SW3. Po lewej bez STP: ramki rozgłoszeniowe krążą w pętli i mnożą się, bo Ethernet nie ma TTL. Po prawej z STP: SW1 jest root bridge, a port SW3 w stronę SW2 jest zablokowany, więc topologia jest drzewem; przy awarii łącza STP go odblokuje.">
<title>Dwa trójkąty z przełącznikami SW1, SW2 i SW3. Po lewej bez STP: ramki rozgłoszeniowe krążą w pętli i mnożą się, bo Ethernet nie ma TTL. Po prawej z STP: SW1 jest root bridge, a port SW3 w stronę SW2 jest zablokowany, więc topologia jest drzewem; przy awarii łącza STP go odblokuje.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Pętla L2 bez STP = burza rozgłoszeniowa; STP blokuje jeden port</text><rect x="40" y="56" width="400" height="310" rx="10" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="240" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">Bez STP: ramki krążą w nieskończoność</text><line x1="240" y1="146" x2="130" y2="274" stroke="#b23b3b" stroke-width="4"/><line x1="240" y1="146" x2="350" y2="274" stroke="#b23b3b" stroke-width="4"/><line x1="160" y1="290" x2="320" y2="290" stroke="#b23b3b" stroke-width="4"/><rect x="190" y="114" width="100" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="240" y="135" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">SW1</text><rect x="80" y="274" width="80" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="120" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">SW2</text><rect x="320" y="274" width="80" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="360" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">SW3</text><text x="165" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="30" fill="#b23b3b" font-weight="700">↻</text><text x="295" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="30" fill="#b23b3b" font-weight="700">↻</text><text x="240" y="330" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">broadcast mnoży się na każdym przełączniku</text><text x="240" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">Ethernet nie ma TTL · tablice MAC „skaczą”</text><rect x="460" y="56" width="400" height="310" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="660" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Z STP: drzewo bez pętli</text><line x1="660" y1="146" x2="550" y2="274" stroke="#2e7d4f" stroke-width="4"/><line x1="660" y1="146" x2="770" y2="274" stroke="#2e7d4f" stroke-width="4"/><line x1="580" y1="290" x2="740" y2="290" stroke="#d9d0c3" stroke-width="4" stroke-dasharray="6 5"/><rect x="610" y="114" width="100" height="32" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="660" y="135" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">SW1 root</text><rect x="500" y="274" width="80" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="540" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">SW2</text><rect x="740" y="274" width="80" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="780" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">SW3</text><rect x="710" y="278" width="26" height="24" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="723" y="295" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">✕</text><text x="660" y="330" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="middle" font-weight="700">port SW3 → SW2 zablokowany (alternate)</text><text x="660" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">przy awarii łącza STP go odblokuje</text><text x="450" y="396" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Root bridge = najniższy Bridge ID (priorytet + VLAN + MAC). Szczegóły ról i stanów portów: lekcja 07.</text>
</svg>
