<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Po lewej jeden fizyczny przełącznik SW1 z czterema komputerami: PC-A i PC-B w VLAN 10, PC-C i PC-D w VLAN 20. Po prawej ten sam układ logicznie: dwie oddzielne sieci 192.168.10.0/24 i 192.168.20.0/24. Broadcast z PC-A dociera tylko do PC-B, a ruch między VLAN-ami wymaga routera.">
<title>Po lewej jeden fizyczny przełącznik SW1 z czterema komputerami: PC-A i PC-B w VLAN 10, PC-C i PC-D w VLAN 20. Po prawej ten sam układ logicznie: dwie oddzielne sieci 192.168.10.0/24 i 192.168.20.0/24. Broadcast z PC-A dociera tylko do PC-B, a ruch między VLAN-ami wymaga routera.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">VLAN: jeden fizyczny przełącznik, kilka logicznych domen rozgłoszeniowych</text><rect x="40" y="60" width="380" height="300" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="230" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#1f1a14" text-anchor="middle" font-weight="700">Fizycznie</text><rect x="120" y="154" width="220" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="230" y="175" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="middle" font-weight="700">SW1 (24 porty)</text><line x1="230" y1="186" x2="90" y2="268" stroke="#c46a12" stroke-width="3"/><rect x="56" y="269" width="68" height="32" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="90" y="290" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">PC-A</text><text x="90" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">VLAN 10</text><line x1="230" y1="186" x2="180" y2="268" stroke="#c46a12" stroke-width="3"/><rect x="146" y="269" width="68" height="32" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="180" y="290" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">PC-B</text><text x="180" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">VLAN 10</text><line x1="230" y1="186" x2="280" y2="268" stroke="#2e7d4f" stroke-width="3"/><rect x="246" y="269" width="68" height="32" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="280" y="290" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">PC-C</text><text x="280" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">VLAN 20</text><line x1="230" y1="186" x2="370" y2="268" stroke="#2e7d4f" stroke-width="3"/><rect x="336" y="269" width="68" height="32" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="370" y="290" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">PC-D</text><text x="370" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">VLAN 20</text><text x="230" y="348" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">porty access: każdy port należy do jednego VLAN-u</text><line x1="430" y1="210" x2="470" y2="210" stroke="#6b6257" stroke-width="3" marker-end="url(#arr)"/><rect x="480" y="60" width="380" height="300" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="670" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#1f1a14" text-anchor="middle" font-weight="700">Logicznie</text><rect x="500" y="105" width="340" height="110" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="670" y="128" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="700">VLAN 10 — 192.168.10.0/24</text><rect x="546" y="159" width="68" height="32" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="580" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">PC-A</text><rect x="726" y="159" width="68" height="32" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="760" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">PC-B</text><line x1="614" y1="175" x2="726" y2="175" stroke="#c46a12" stroke-width="3"/><rect x="500" y="230" width="340" height="110" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="670" y="253" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">VLAN 20 — 192.168.20.0/24</text><rect x="546" y="284" width="68" height="32" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="580" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">PC-C</text><rect x="726" y="284" width="68" height="32" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="760" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">PC-D</text><line x1="614" y1="300" x2="726" y2="300" stroke="#2e7d4f" stroke-width="3"/><text x="450" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Broadcast z PC-A dociera tylko do PC-B. Ruch VLAN 10 ↔ VLAN 20 wymaga routera (L3) — i tam stawiasz firewall.</text>
</svg>
