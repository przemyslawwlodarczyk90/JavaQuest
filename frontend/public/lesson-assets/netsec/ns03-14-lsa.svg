<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Przepływ w OSPF: LSA typu 1 (router) i typu 2 (network, od DR) tworzą identyczną bazę LSDB w obszarze, każdy router liczy SPF algorytmem Dijkstry i instaluje trasy O z AD 110. Porównanie link-state z distance-vector, inne typy LSA, polecenia FRR, OSPFv2 i OSPFv3.">
<title>Przepływ w OSPF: LSA typu 1 (router) i typu 2 (network, od DR) tworzą identyczną bazę LSDB w obszarze, każdy router liczy SPF algorytmem Dijkstry i instaluje trasy O z AD 110. Porównanie link-state z distance-vector, inne typy LSA, polecenia FRR, OSPFv2 i OSPFv3.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="360" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Link-state: każdy router ma tę samą mapę (LSDB) i sam liczy najkrótsze ścieżki</text><rect x="30" y="70" width="160" height="90" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="110" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="middle" font-weight="700">LSA typ 1 (Router)</text><text x="110" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">każdy router:</text><text x="110" y="144" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">moje łącza i koszty</text><line x1="192" y1="115" x2="200" y2="115" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="202" y="70" width="160" height="90" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="282" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">LSA typ 2 (Network)</text><text x="282" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">DR opisuje</text><text x="282" y="144" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">segment broadcast</text><line x1="364" y1="115" x2="372" y2="115" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="374" y="70" width="160" height="90" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="454" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="700">LSDB</text><text x="454" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">identyczna</text><text x="454" y="144" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">w całym obszarze</text><line x1="536" y1="115" x2="544" y2="115" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="546" y="70" width="160" height="90" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="626" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">SPF (Dijkstra)</text><text x="626" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">drzewo najkrótszych</text><text x="626" y="144" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">ścieżek od siebie</text><line x1="708" y1="115" x2="716" y2="115" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="718" y="70" width="160" height="90" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="798" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">RIB</text><text x="798" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">trasy „O”</text><text x="798" y="144" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">AD 110 + koszt</text><rect x="40" y="186" width="820" height="156" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Distance-vector (RIP): router zna tylko „odległość i kierunek” od sąsiadów — wolna zbieżność, pętle, limit 15 skoków.</text><text x="60" y="234" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Link-state (OSPF, IS-IS): pełna mapa obszaru → szybka zbieżność, brak pętli, ale więcej pamięci/CPU i flooding przy zmianach.</text><text x="60" y="260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Inne typy LSA (w kolejnych obszarach i redystrybucji): 3 Summary (ABR), 4 ASBR-summary, 5 External, 7 NSSA.</text><text x="60" y="286" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">FRR:  show ip ospf database   ·   show ip ospf route   ·   show ip route ospf   ·   show ip ospf interface</text><text x="60" y="316" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">OSPFv2 = IPv4 (protokół 89, 224.0.0.5/6); OSPFv3 = IPv6 (link-local, ff02::5/6, adresy w osobnych LSA, AF dla IPv4).</text>
</svg>
