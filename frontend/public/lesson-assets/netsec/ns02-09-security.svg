<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Dwie kolumny: LLDP i CDP włączone na łączach między przełącznikami, portach do serwerów, telefonów VoIP, punktów dostępowych i w sieci zarządzania; wyłączone na interfejsach do Internetu, w strefie gości, salach konferencyjnych, DMZ i na nieużywanych portach. Ramka ujawnia nazwę, model, wersję oprogramowania, adres zarządzania i VLAN-y.">
<title>Dwie kolumny: LLDP i CDP włączone na łączach między przełącznikami, portach do serwerów, telefonów VoIP, punktów dostępowych i w sieci zarządzania; wyłączone na interfejsach do Internetu, w strefie gości, salach konferencyjnych, DMZ i na nieużywanych portach. Ramka ujawnia nazwę, model, wersję oprogramowania, adres zarządzania i VLAN-y.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">LLDP/CDP: gdzie włączyć, gdzie wyłączyć</text><rect x="40" y="60" width="400" height="220" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="240" y="88" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2e7d4f" text-anchor="middle" font-weight="700">WŁĄCZONE</text><text x="64" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• łącza między przełącznikami</text><text x="64" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• porty do serwerów i hiperwizorów</text><text x="64" y="184" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• porty do telefonów VoIP (LLDP-MED)</text><text x="64" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• porty do punktów dostępowych</text><text x="64" y="248" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• sieć zarządzania</text><rect x="460" y="60" width="400" height="220" rx="10" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="660" y="88" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#b23b3b" text-anchor="middle" font-weight="700">WYŁĄCZONE</text><text x="484" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• interfejsy do Internetu / operatora</text><text x="484" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• porty w strefie gości</text><text x="484" y="184" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• porty w salach konferencyjnych</text><text x="484" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• porty w DMZ do obcych systemów</text><text x="484" y="248" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">• nieużywane porty</text><rect x="40" y="296" width="820" height="70" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Co ujawnia ramka LLDP/CDP każdemu w segmencie: nazwę i model urządzenia, wersję oprogramowania,</text><text x="60" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">adres zarządzania, VLAN-y, numer portu — gotowa mapa i lista podatnych wersji dla napastnika.</text>
</svg>
