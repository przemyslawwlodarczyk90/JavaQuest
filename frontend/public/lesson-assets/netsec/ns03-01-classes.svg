x="466" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" font-weight="700">CIDR (RFC 1519, 1993; dziś RFC 4632)</text><text x="466" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Prefiks dowolnej długości: /22 = 1022 hosty.</text><text x="466" y="321" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Agregacja tras: 4 sieci /24 → jedna /22.</text><text x="466" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Klasa nie wynika już z adresu — maska</text><text x="466" y="363" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">ZAWSZE podawana jawnie (adres/prefiks).</text><text x="466" y="384" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">„Klasa C” w mowie potocznej = /24.</text>
</svg>
