<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Podział pierwszego oktetu na klasy: A 0–127 z maską /8, B 128–191 z /16, C 192–223 z /24, D 224–239 multicast, E 240–255 zarezerwowane. Klasy zmarnowały adresy i powiększały tablice routingu; w 1993 zastąpił je CIDR z prefiksem dowolnej długości i agregacją tras.">
<title>Podział pierwszego oktetu na klasy: A 0–127 z maską /8, B 128–191 z /16, C 192–223 z /24, D 224–239 multicast, E 240–255 zarezerwowane. Klasy zmarnowały adresy i powiększały tablice routingu; w 1993 zastąpił je CIDR z prefiksem dowolnej długości i agregacją tras.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#fbf8f3"/>
