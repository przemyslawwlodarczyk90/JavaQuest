serif" font-size="12" fill="#1f1a14">128 sieci po 16 777 214 hostów</text><rect x="450" y="56" width="195" height="52" rx="3" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="547.5" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Klasa B</text><text x="547.5" y="98" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">128–191</text><text x="60" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">B</text><text x="120" y="170" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">10</text><text x="240" y="170" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">128–191</text><text x="370" y="170" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">/16</text><text x="500" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">16 384 sieci po 65 534 hosty</text><rect x="645" y="56" width="97.5" height="52" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="693.75" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">Klasa C</text><text x="693.75" y="98" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">192–223</text><text x="60" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" font-weight="700">C</text><text x="120" y="190" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">110</text><text x="240" y="190" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">192–223</text><text x="370" y="190" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">/24</text><text x="500" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">2 097 152 sieci po 254 hosty</text><rect x="742.5" y="56" width="48.75" height="52" rx="3" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="766.875" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">Klasa D</text><text x="766.875" y="98" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" fill="#1f1a14" text-anchor="middle">224–239</text><text x="60" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" font-weight="700">D</text><text x="120" y="210" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1110</text><text x="240" y="210" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">224–239</text><text x="370" y="210" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">—</text><text x="500" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">multicast</text><rect x="791.25" y="56" width="48.75" height="52" rx="3" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="815.625" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle" font-weight="700">Klasa E</text><text x="815.625" y="98" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" fill="#1f1a14" text-anchor="middle">240–255</text><text x="60" y="230" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" font-weight="700">E</text><text x="120" 