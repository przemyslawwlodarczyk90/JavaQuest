<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="Warstwy stanowiska: Windows 11 z narzędziami, w nim WSL2 z Ubuntu i Docker Engine z sieciami edge i backend, obok hypervisor z maszynami wirtualnymi do labów Windows, AD, SIEM i analizy malware">
<title>Warstwy stanowiska: Windows 11 z narzędziami, w nim WSL2 z Ubuntu i Docker Engine z sieciami edge i backend, obok hypervisor z maszynami wirtualnymi do labów Windows, AD, SIEM i analizy malware</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="450" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Stanowisko laboratoryjne: warstwy od Windows do kontenera</text><rect x="20" y="52" width="860" height="360" rx="12" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="36" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">Windows 11 (host): przeglądarka, Wireshark, IntelliJ, Docker Desktop</text><rect x="40" y="92" width="520" height="300" rx="10" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="56" y="114" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">WSL2 — lekka maszyna wirtualna z jądrem Linux</text><text x="56" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Ubuntu: bash, tcpdump, dig, curl, openssl, ip, mtr, nmap, JDK, Maven</text><rect x="60" y="150" width="480" height="226" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="76" y="172" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" font-weight="700">Docker Engine (backend WSL2 Docker Desktop)</text><rect x="80" y="190" width="200" height="170" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="180" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" text-anchor="middle" font-weight="700">sieć edge</text><rect x="110" y="226" width="140" height="44" rx="6" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="180" y="253" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">caddy</text><text x="180" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">caddy należy też do backend</text><rect x="300" y="190" width="200" height="170" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="400" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">sieć backend (internal)</text><rect x="330" y="226" width="140" height="44" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="400" y="253" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">app</text><rect x="330" y="286" width="140" height="44" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="400" y="313" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">postgres</text><line x1="250" y1="248" x2="330" y2="248" stroke="#6b6257" stroke-width="2"/><rect x="580" y="92" width="280" height="300" rx="10" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="720" y="114" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">Hypervisor (Hyper-V / VirtualBox)</text><rect x="600" y="128" width="240" height="46" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="720" y="156" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">VM: kontroler domeny Windows</text><rect x="600" y="188" width="240" height="46" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="720" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">VM: stacja Windows + Sysmon</text><rect x="600" y="248" width="240" height="46" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="720" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">VM: Security Onion / Wazuh</text><rect x="600" y="308" width="240" height="46" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="720" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">VM: REMnux / FLARE (malware)</text><text x="720" y="384" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">od rozdziału 18 (Windows, AD, SIEM)</text><text x="450" y="432" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Część I wymaga tylko WSL2 + Docker; część III dokłada maszyny wirtualne (16 GB RAM to minimum, 32 GB wygodnie).</text>
</svg>
