<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 154" role="img" aria-labelledby="title"><title id="title">Poufność — Kto może odczytać dane?; Integralność — Czy dane są poprawne?; Dostępność — Czy usługa działa na czas?</title><rect width="1000" height="154" rx="18" fill="#eef2ff"/><g fill="#0f172a" font-family="system-ui, sans-serif" text-anchor="middle"><rect x="20" y="30" width="296" height="86" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="168" y="65" font-size="18" font-weight="700">Poufność</text><text x="168" y="92" font-size="15">Kto może odczytać dane?</text><rect x="352" y="30" width="296" height="86" rx="12" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="500" y="65" font-size="18" font-weight="700">Integralność</text><text x="500" y="92" font-size="15">Czy dane są poprawne?</text><rect x="684" y="30" width="296" height="86" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="832" y="65" font-size="18" font-weight="700">Dostępność</text><text x="832" y="92" font-size="15">Czy usługa działa na czas?</text></g></svg>
