m-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">4</text><path d="M242,250 Q337.33333333333337,150 432.6666666666667,250" fill="none" fill-opacity="0" stroke="#d9d0c3" stroke-width="1"/><text x="337.33333333333337" y="208" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">5</text><path d="M285.3333333333333,280 Q380.66666666666663,90 476,280" fill="#dcefe3" fill-opacity="0.6" stroke="#2e7d4f" stroke-width="2.5"/><text x="380.66666666666663" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2e7d4f" text-anchor="middle" font-weight="700">6</text><path d="M328.6666666666667,260 Q424,150 519.3333333333334,260" fill="none" fill-opacity="0" stroke="#d9d0c3" stroke-width="1"/><text x="424" y="194" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">7</text><path d="M372,250 Q467.33333333333337,150 562.6666666666667,250" fill="none" fill-opacity="0" stroke="#d9d0c3" stroke-width="1"/><text x="467.33333333333337" y="208" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">8</text><path d="M415.3333333333333,270 Q510.66666666666663,150 606,270" fill="none" fill-opacity="0" stroke="#d9d0c3" stroke-width="1"/><text x="510.66666666666663" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">9</text><path d="M458.66666666666663,260 Q554,150 649.3333333333334,260" fill="none" fill-opacity="0" stroke="#d9d0c3" stroke-width="1"/><text x="554" y="194" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">10</text><path d="M502,280 Q597.3333333333334,90 692.6666666666666,280" fill="#fbe6cf" fill-opacity="0.6" stroke="#c46a12" stroke-width="2.5"/><text x="597.3333333333334" y="130" font-family="'Se