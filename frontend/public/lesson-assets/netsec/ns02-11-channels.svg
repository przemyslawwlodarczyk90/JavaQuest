<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Widmo pasma 2,4 GHz od 2400 do 2490 MHz z trzynastoma kanałami co 5 MHz o szerokości około 22 MHz; wyróżnione kanały 1, 6 i 11, które się nie nakładają, pozostałe zachodzą na sąsiednie. W pasmach 5 i 6 GHz kanałów jest dużo więcej.">
<title>Widmo pasma 2,4 GHz od 2400 do 2490 MHz z trzynastoma kanałami co 5 MHz o szerokości około 22 MHz; wyróżnione kanały 1, 6 i 11, które się nie nakładają, pozostałe zachodzą na sąsiednie. W pasmach 5 i 6 GHz kanałów jest dużo więcej.</title>
