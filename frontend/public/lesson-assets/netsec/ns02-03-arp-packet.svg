<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Pola pakietu ARP: typ sprzętu, typ protokołu, długości adresów, kod operacji, MAC i IP nadawcy, MAC i IP celu; obok przykład zapytania w Wiresharku i opis gratuitous ARP">
<title>Pola pakietu ARP: typ sprzętu, typ protokołu, długości adresów, kod operacji, MAC i IP nadawcy, MAC i IP celu; obok przykład zapytania w Wiresharku i opis gratuitous ARP</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Pakiet ARP: 28 bajtów w ramce z EtherType 0x0806</text><rect x="40" y="56" width="120" height="30" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="100" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">HTYPE</text><text x="180" y="76" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">2 B</text><text x="240" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">1 = Ethernet</text><rect x="40" y="92" width="120" height="30" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="100" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">PTYPE</text><text x="180" y="112" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">2 B</text><text x="240" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">0x0800 = IPv4</text><rect x="40" y="128" width="120" height="30" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="100" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">HLEN</text><text x="180" y="148" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1 B</text><text x="240" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">6</text><rect x="40" y="164" width="120" height="30" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="100" y="184" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">PLEN</text><text x="180" y="184" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1 B</text><text x="240" y="184" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">4</text><rect x="40" y="200" width="120" height="30" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="100" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">OPER</text><text x="180" y="220" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">2 B</text><text x="240" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">1 = request, 2 = reply</text><rect x="40" y="236" width="120" height="30" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="100" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">SHA</text><text x="180" y="256" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">6 B</text><text x="240" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">MAC nadawcy</text><rect x="40" y="272" width="120" height="30" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="100" y="292" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">SPA</text><text x="180" y="292" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">4 B</text><text x="240" y="292" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IP nadawcy</text><rect x="40" y="308" width="120" height="30" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="100" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">THA</text><text x="180" y="328" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">6 B</text><text x="240" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">MAC celu (00…00 w request)</text><rect x="40" y="344" width="120" height="30" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="100" y="364" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">TPA</text><text x="180" y="364" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">4 B</text><text x="240" y="364" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">IP celu (szukany adres)</text><rect x="520" y="56" width="350" height="316" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="536" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">przykład (Wireshark):</text><text x="536" y="106" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">Address Resolution Protocol (request)</text><text x="536" y="128" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">  Hardware type: Ethernet (1)</text><text x="536" y="150" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">  Protocol type: IPv4 (0x0800)</text><text x="536" y="172" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">  Opcode: request (1)</text><text x="536" y="194" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">  Sender MAC: 3c:52:82:1a:f0:07</text><text x="536" y="216" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">  Sender IP: 192.168.1.20</text><text x="536" y="238" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">  Target MAC: 00:00:00:00:00:00</text><text x="536" y="260" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">  Target IP: 192.168.1.1</text><text x="536" y="282" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14"></text><text x="536" y="304" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Gratuitous ARP: Sender IP = Target IP</text><text x="536" y="326" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">(ogłoszenie własnego adresu, np. po</text><text x="536" y="348" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14"> przełączeniu VRRP lub zmianie karty)</text>
</svg>
