<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" role="img" aria-label="Lejek: filtr BPF tcp port 8080 odrzuca ruch przed zapisem do pliku pcapng; filtr wyświetlania http.response.code &gt;= 500 tylko ukrywa pakiety w zapisanym pliku">
<title>Lejek: filtr BPF tcp port 8080 odrzuca ruch przed zapisem do pliku pcapng; filtr wyświetlania http.response.code &gt;= 500 tylko ukrywa pakiety w zapisanym pliku</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="425" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Filtr przechwytywania (BPF) vs filtr wyświetlania</text><polygon points="60,70 400,70 330,190 130,190" fill="#fbe6cf" stroke="#c46a12" stroke-width="2"/><text x="230" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">cały ruch na interfejsie</text><text x="230" y="130" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#c46a12" text-anchor="middle" font-weight="700">BPF: tcp port 8080</text><text x="230" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">odrzuca w jądrze, zanim zapisze</text><line x1="230" y1="192" x2="230" y2="226" stroke="#c46a12" stroke-width="3" marker-end="url(#arr)"/><rect x="140" y="230" width="180" height="50" rx="8" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="230" y="260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">plik .pcapng</text><line x1="322" y1="255" x2="470" y2="255" stroke="#2e7d4f" stroke-width="3" marker-end="url(#arr)"/><polygon points="480,200 840,200 780,310 540,310" fill="#dcefe3" stroke="#2e7d4f" stroke-width="2"/><text x="660" y="228" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">filtr wyświetlania:</text><text x="660" y="256" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2e7d4f" text-anchor="middle" font-weight="700">http.response.code &gt;= 500</text><text x="660" y="284" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">ukrywa, ale nic nie usuwa</text><text x="260" y="330" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">BPF (tcpdump, dumpcap, -f w Wiresharku):</text><text x="260" y="352" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">prosty, szybki, ustalany PRZED startem</text><text x="660" y="344" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">filtr wyświetlania (Wireshark, tshark -Y):</text><text x="660" y="366" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">pola dekoderów, zmieniany w każdej chwili</text><text x="450" y="410" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">Czego nie przechwyciłeś filtrem BPF, tego już nie odzyskasz.</text>
</svg>
