<title>Adres 192.168.1.77 jako cztery oktety i 32 bity</title>
<rect width="820" height="330" rx="14" fill="#fbf8f3"/>
<text x="410" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Adres IPv4 to 32 bity — zapis z kropkami to tylko wygoda dla ludzi</text><rect x="40" y="60" width="175" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="127.5" y="89" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#1f1a14" text-anchor="middle" font-weight="700">192</text><text x="127.5" y="124" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">oktet 1</text><rect x="40" y="134" width="175" height="44" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="127.5" y="163" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#2f6fb3" text-anchor="middle" font-weight="700">11000000</text><text x="46" y="196" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257">bit 31</text><text x="209" y="196" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257" text-anchor="end">bit 24</text><rect x="225" y="60" width="175" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="312.5" y="89" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#1f1a14" text-anchor="middle" font-weight="700">168</text><text x="312.5" y="124" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">oktet 2</text><rect x="225" y="134" width="175" height="44" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="312.5" y="163" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#c46a12" text-anchor="middle" font-weight="700">10101000</text><text x="231" y="196" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257">bit 23</text><text x="394" y="196" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257" text-anchor="end">bit 16</text><rect x="410" y="60" width="175" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="497.5" y="89" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#1f1a14" text-anchor="middle" font-weight="700">1</text><text x="497.5" y="124" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">oktet 3</text><rect x="410" y="134" width="175" height="44" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="497.5" y="163" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#2f6fb3" text-anchor="middle" font-weight="700">00000001</text><text x="416" y="196" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257">bit 15</text><text x="579" y="196" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257" text-anchor="end">bit 8</text><rect x="595" y="60" width="175" height="44" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="682.5" y="89" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#1f1a14" text-anchor="middle" font-weight="700">77</text><text x="682.5" y="124" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">oktet 4</text><rect x="595" y="134" width="175" height="44" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="682.5" y="163" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#c46a12" text-anchor="middle" font-weight="700">01001101</text><text x="601" y="196" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257">bit 7</text><text x="764" y="196" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257" text-anchor="end">bit 0</text><text x="410" y="234" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">11000000101010000000000101001101</text><text x="410" y="262" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f1a14" text-anchor="middle">jako jedna liczba: 192·2^24 + 168·2^16 + 1·2^8 + 77 = 3 232 235 853</text><text x="410" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6b6257" text-anchor="middle">4 oktety × 8 bitów = 32 bity → 2^32 ≈ 4,29 mld możliwych adresów IPv4</text>
</svg>
