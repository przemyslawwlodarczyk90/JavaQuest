<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Oś adresów 10.13.0.0–255: według routera i hostów sieć to /24, ale host ns-c z maską /28 uważa za lokalne tylko adresy 0–15. Do bramy .1 i hosta .14 wysyła bezpośrednio, a do drukarki .40 i serwera .200 przez bramę, co daje przekierowania ICMP lub brak łączności. Dowód: ip route get 10.13.0.40 pokazuje via 10.13.0.1.">
<title>Oś adresów 10.13.0.0–255: według routera i hostów sieć to /24, ale host ns-c z maską /28 uważa za lokalne tylko adresy 0–15. Do bramy .1 i hosta .14 wysyła bezpośrednio, a do drukarki .40 i serwera .200 przez bramę, co daje przekierowania ICMP lub brak łączności. Dowód: ip route get 10.13.0.40 pokazuje via 10.13.0.1.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Zła maska: host „widzi” mniejszą sieć niż reszta</text><rect x="60" y="80" width="780" height="50" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="450" y="110" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">sieć wg routera i innych: 10.13.0.0/24 (.0–.255)</text><rect x="60" y="150" width="48.75" height="50" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="116.75" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">← ns-c /28: „moja sieć” to tylko 10.13.0.0–.15</text><line x1="63.046875" y1="220" x2="63.046875" y2="240" stroke="#1f1a14" stroke-width="2"/><text x="63.046875" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">brama .1</text><line x1="99.609375" y1="220" x2="99.609375" y2="240" stroke="#1f1a14" stroke-width="2"/><text x="99.609375" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">ns-c .13</text><line x1="102.65625" y1="220" x2="102.65625" y2="240" stroke="#1f1a14" stroke-width="2"/><text x="132.65625" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">ns-d .14</text><line x1="181.875" y1="220" x2="181.875" y2="240" stroke="#1f1a14" stroke-width="2"/><text x="181.875" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">drukarka .40</text><line x1="669.375" y1="220" x2="669.375" y2="240" stroke="#1f1a14" stroke-width="2"/><text x="669.375" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">serwer .200</text><rect x="60" y="290" width="780" height="74" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="80" y="314" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">ns-c → brama .1, ns-d .14: w „jego” sieci → ARP, działa. ns-c → drukarka .40: poza /28 → wysyła do bramy.</text><text x="80" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Router odsyła ramkę z powrotem na ten sam interfejs (ICMP redirect) — działa „dziwnie” albo wcale (firewall).</text><text x="80" y="356" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Objaw: „niektóre hosty w tej samej sieci odpowiadają, inne nie”. Dowód: ip route get 10.13.0.40 → via 10.13.0.1.</text>
</svg>
