<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Trzy panele: hub tworzy jedną domenę kolizyjną i jedną rozgłoszeniową, przełącznik — osobną domenę kolizyjną na każdy port i jedną rozgłoszeniową na VLAN, router — osobną domenę rozgłoszeniową na każdy interfejs">
<title>Trzy panele: hub tworzy jedną domenę kolizyjną i jedną rozgłoszeniową, przełącznik — osobną domenę kolizyjną na każdy port i jedną rozgłoszeniową na VLAN, router — osobną domenę rozgłoszeniową na każdy interfejs</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Domeny kolizyjne i rozgłoszeniowe: hub, przełącznik, router</text><rect x="20" y="56" width="270" height="280" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="155" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">Hub (L1)</text><rect x="121" y="134" width="68" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="155" y="155" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" text-anchor="middle" font-weight="700">HUB</text><line x1="70" y1="216" x2="155" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="70" cy="230" r="15" fill="#f6dcdc" stroke="#1f1a14"/><line x1="125" y1="236" x2="155" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="125" cy="250" r="15" fill="#f6dcdc" stroke="#1f1a14"/><line x1="185" y1="236" x2="155" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="185" cy="250" r="15" fill="#f6dcdc" stroke="#1f1a14"/><line x1="240" y1="216" x2="155" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="240" cy="230" r="15" fill="#f6dcdc" stroke="#1f1a14"/><text x="155" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">kolizyjne: 1 (wszyscy)</text><text x="155" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">rozgłoszeniowe: 1</text><rect x="315" y="56" width="270" height="280" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="450" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">Przełącznik (L2)</text><rect x="416" y="134" width="68" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="450" y="155" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" text-anchor="middle" font-weight="700">SW</text><line x1="365" y1="216" x2="450" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="365" cy="230" r="15" fill="#dcefe3" stroke="#1f1a14"/><line x1="420" y1="236" x2="450" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="420" cy="250" r="15" fill="#fbe6cf" stroke="#1f1a14"/><line x1="480" y1="236" x2="450" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="480" cy="250" r="15" fill="#e9e1f5" stroke="#1f1a14"/><line x1="535" y1="216" x2="450" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="535" cy="230" r="15" fill="#dce9f7" stroke="#1f1a14"/><text x="450" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">kolizyjne: 4 (każdy port)</text><text x="450" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">rozgłoszeniowe: 1 (na VLAN)</text><rect x="610" y="56" width="270" height="280" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="745" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">Router (L3), 2 interfejsy</text><rect x="711" y="134" width="68" height="32" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="745" y="155" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" text-anchor="middle" font-weight="700">R</text><line x1="660" y1="216" x2="745" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="660" cy="230" r="15" fill="#dcefe3" stroke="#1f1a14"/><line x1="715" y1="236" x2="745" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="715" cy="250" r="15" fill="#dcefe3" stroke="#1f1a14"/><line x1="775" y1="236" x2="745" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="775" cy="250" r="15" fill="#e9e1f5" stroke="#1f1a14"/><line x1="830" y1="216" x2="745" y2="166" stroke="#d9d0c3" stroke-width="2"/><circle cx="830" cy="230" r="15" fill="#e9e1f5" stroke="#1f1a14"/><text x="745" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">kolizyjne: osobne per port</text><text x="745" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">rozgłoszeniowe: 2 (każdy interfejs)</text><text x="450" y="362" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Przełącznik dzieli domeny kolizyjne, ale przepuszcza broadcast; router (lub VLAN) dzieli domeny rozgłoszeniowe.</text>
</svg>
