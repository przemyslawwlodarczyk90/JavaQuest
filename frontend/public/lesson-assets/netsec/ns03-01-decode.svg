ace" font-size="13" fill="#c46a12" font-weight="700">40 00</text><text x="220" y="244" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Flags: DF=1, MF=0; Fragment Offset 0</text><text x="80" y="273" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#b23b3b" font-weight="700">40</text><text x="220" y="273" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">TTL 64 (typowo Linux/macOS)</text><text x="80" y="302" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2e7d4f" font-weight="700">06</text><text x="220" y="302" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Protocol 6 = TCP</text><text x="80" y="331" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#b23b3b" font-weight="700">26 e9</text><text x="220" y="331" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Header Checksum 0x26e9 — weryfikacja: suma = 0xffff ✓</text><text x="80" y="360" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2e7d4f" font-weight="700">c0 a8 01 0a</text><text x="220" y="360" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Źródło 192.168.1.10</text><text x="80" y="389" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2e7d4f" font-weight="700">5d b8 d8 22</text><text x="220" y="389" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Cel 93.184.216.34</text><text x="450" y="425" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Hex → dziesiętnie: c0 = 192, a8 = 168, 01 = 1, 0a = 10. Dwie cyfry hex = jeden bajt (oktet).</text>
