<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-label="Tabela przepisów Kodeksu karnego od art. 267 do 269c z krótkim opisem: dostęp do informacji, niszczenie informacji i danych, sabotaż, zakłócanie systemów, narzędzia hakerskie oraz kontratyp działań w celu zabezpieczenia">
<title>Tabela przepisów Kodeksu karnego od art. 267 do 269c z krótkim opisem: dostęp do informacji, niszczenie informacji i danych, sabotaż, zakłócanie systemów, narzędzia hakerskie oraz kontratyp działań w celu zabezpieczenia</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="476" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Kodeks karny: przestępstwa przeciwko ochronie informacji (rozdz. XXXIII)</text><rect x="30" y="56" width="130" height="42" rx="8" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="95" y="83" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">art. 267</text><rect x="170" y="56" width="700" height="42" rx="8" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="182" y="83" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">nieuprawniony dostęp do informacji i systemu (przełamanie zabezpieczeń, dostęp do systemu), podsłuch, ujawnienie</text><rect x="30" y="108" width="130" height="42" rx="8" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="95" y="135" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">art. 268</text><rect x="170" y="108" width="700" height="42" rx="8" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="182" y="135" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">niszczenie, uszkadzanie, zmiana lub utrudnianie dostępu do istotnej informacji</text><rect x="30" y="160" width="130" height="42" rx="8" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="95" y="187" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">art. 268a</text><rect x="170" y="160" width="700" height="42" rx="8" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="182" y="187" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">niszczenie, zmiana, utrudnianie dostępu do danych informatycznych; zakłócanie ich przetwarzania</text><rect x="30" y="212" width="130" height="42" rx="8" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="95" y="239" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">art. 269</text><rect x="170" y="212" width="700" height="42" rx="8" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="182" y="239" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">sabotaż danych o szczególnym znaczeniu (obronność, administracja, bezpieczeństwo komunikacji)</text><rect x="30" y="264" width="130" height="42" rx="8" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="95" y="291" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">art. 269a</text><rect x="170" y="264" width="700" height="42" rx="8" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="182" y="291" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">zakłócanie pracy systemu lub sieci (np. DoS) przez transmisję, zmianę lub usunięcie danych</text><rect x="30" y="316" width="130" height="42" rx="8" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="95" y="343" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">art. 269b</text><rect x="170" y="316" width="700" height="42" rx="8" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="182" y="343" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">wytwarzanie, pozyskiwanie, udostępnianie narzędzi i haseł przystosowanych do tych przestępstw</text><rect x="30" y="368" width="130" height="42" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="95" y="395" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">art. 269c</text><rect x="170" y="368" width="700" height="42" rx="8" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="182" y="395" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">niekaralność (kontratyp) działań wyłącznie w celu zabezpieczenia systemu — przy ścisłych warunkach</text><text x="450" y="436" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Uproszczony opis dydaktyczny — nie zastępuje tekstu ustawy ani porady prawnej. Zawsze sprawdzaj aktualny stan prawny.</text><text x="450" y="458" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Do tego RODO (dane osobowe), Kodeks pracy (monitoring pracowników), KSC/NIS2 i umowy (NDA, regulaminy bug bounty).</text>
</svg>
