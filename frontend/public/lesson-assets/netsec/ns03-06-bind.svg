<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Porównanie adresów nasłuchu: bind 127.0.0.1 dostępny tylko z tego samego hosta, bind 0.0.0.0 ze wszystkich sieci, bind na konkretny adres tylko przez ten interfejs. W kontenerze bind 127.0.0.1 blokuje publikację portu, a -p 8080:8080 publikuje usługę na wszystkich interfejsach hosta; bezpieczniej -p 127.0.0.1:8080:8080.">
<title>Porównanie adresów nasłuchu: bind 127.0.0.1 dostępny tylko z tego samego hosta, bind 0.0.0.0 ze wszystkich sieci, bind na konkretny adres tylko przez ten interfejs. W kontenerze bind 127.0.0.1 blokuje publikację portu, a -p 8080:8080 publikuje usługę na wszystkich interfejsach hosta; bezpieczniej -p 127.0.0.1:8080:8080.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">server.address: kto może się połączyć z aplikacją Spring Boot na porcie 8080?</text><rect x="40" y="56" width="260" height="170" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="170" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">bind 127.0.0.1</text><text x="56" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">✓ ten sam host (curl localhost)</text><text x="56" y="150" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">✗ inny kontener / host Dockera</text><text x="56" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">✗ komputer w LAN</text><rect x="320" y="56" width="260" height="170" rx="10" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="450" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">bind 0.0.0.0</text><text x="336" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">✓ ten sam host</text><text x="336" y="150" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">✓ host Dockera przez -p 8080:8080</text><text x="336" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">✓ LAN i Internet (jeśli firewall pozwoli)</text><rect x="600" y="56" width="260" height="170" rx="10" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="730" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">bind 10.0.1.15 (konkretny interfejs)</text><text x="616" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">✓ tylko przez ten adres/sieć</text><text x="616" y="150" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">✗ localhost (127.0.0.1) — NIE</text><text x="616" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">✓ każdy, kto dotrze do 10.0.1.15</text><rect x="40" y="246" width="820" height="166" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Pułapka kontenera: w Dockerze aplikacja z bind 127.0.0.1 nasłuchuje na loopbacku KONTENERA —</text><text x="60" y="294" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">publikacja portu (-p 8080:8080) przekazuje ruch na interfejs eth0 kontenera, więc połączenie się nie uda.</text><text x="60" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Pułapka odwrotna: docker run -p 8080:8080 publikuje na 0.0.0.0 hosta — usługa „tylko dla mnie” jest w LAN.</text><text x="60" y="344" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" font-weight="700">Bezpiecznie: -p 127.0.0.1:8080:8080 (tylko lokalnie) albo reverse proxy z TLS.</text><text x="60" y="376" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">0.0.0.0 przy bind = „wszystkie interfejsy”; jako adres docelowy — błąd (Linux potraktuje jak lokalny host).</text><text x="60" y="398" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">Sprawdzenie: ss -ltnp | grep 8080  →  127.0.0.1:8080 vs 0.0.0.0:8080 vs [::]:8080</text>
</svg>
