<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Topologia labu: klient Java wysyła żądania na wirtualny adres 10.0.10.100 utrzymywany przez keepalived (VRRP) na dwóch węzłach Nginx — lb1 master z priorytetem 110 i skryptem sprawdzającym Nginx, lb2 backup z priorytetem 100 — przed dwoma aplikacjami Spring Boot. Po zatrzymaniu lb1 lb2 przejmuje VIP; w chmurze VRRP często nie działa i używa się load balancera chmury.">
<title>Topologia labu: klient Java wysyła żądania na wirtualny adres 10.0.10.100 utrzymywany przez keepalived (VRRP) na dwóch węzłach Nginx — lb1 master z priorytetem 110 i skryptem sprawdzającym Nginx, lb2 backup z priorytetem 100 — przed dwoma aplikacjami Spring Boot. Po zatrzymaniu lb1 lb2 przejmuje VIP; w chmurze VRRP często nie działa i używa się load balancera chmury.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Failure Lab: para Nginx z keepalived (VRRP) — wirtualny IP przed aplikacją</text><rect x="330" y="56" width="240" height="50" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="450" y="78" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">klient Java</text><text x="450" y="96" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">GET http://10.0.10.100/</text><line x1="450" y1="108" x2="450" y2="140" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="300" y="140" width="300" height="40" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="450" y="165" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">VIP 10.0.10.100 (VRRP VRID 51)</text><rect x="140" y="210" width="260" height="70" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="270" y="236" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">lb1: Nginx + keepalived</text><text x="270" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">MASTER, priority 110</text><text x="270" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">track_script: nginx żyje?</text><rect x="500" y="210" width="260" height="70" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="630" y="236" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">lb2: Nginx + keepalived</text><text x="630" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">BACKUP, priority 100</text><text x="630" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">przejmuje VIP po awarii</text><line x1="380" y1="182" x2="300" y2="208" stroke="#2e7d4f" stroke-width="2"/><line x1="520" y1="182" x2="600" y2="208" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><rect x="300" y="300" width="300" height="40" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="450" y="325" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">aplikacje Spring Boot (app1, app2)</text><line x1="270" y1="282" x2="400" y2="300" stroke="#6b6257" stroke-width="2"/><line x1="630" y1="282" x2="500" y2="300" stroke="#6b6257" stroke-width="2"/><rect x="40" y="352" width="820" height="56" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="56" y="374" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Test: klient Java wysyła żądanie co 100 ms i loguje czas/błąd; docker stop lb1 (lub systemctl stop keepalived).</text><text x="56" y="396" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Wynik: przerwa ≈ Master_Down_Interval + nowe połączenie TCP. W chmurze VRRP zwykle nie działa → load balancer chmury.</text>
</svg>
