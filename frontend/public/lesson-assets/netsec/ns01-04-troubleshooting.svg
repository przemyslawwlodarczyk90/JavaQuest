<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" role="img" aria-label="Drabina diagnozy od warstwy 1 do 7: pytanie, narzędzie i typowy komunikat błędu dla każdej warstwy">
<title>Drabina diagnozy od warstwy 1 do 7: pytanie, narzędzie i typowy komunikat błędu dla każdej warstwy</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="550" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Diagnoza od dołu: każda warstwa ma swoje pytanie i narzędzie</text><rect x="40" y="440" width="520" height="54" rx="8" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="54" y="473" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#6b6257" font-weight="700">L1</text><text x="120" y="463" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" font-weight="700">Czy jest link?</text><text x="120" y="483" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3">ip link, ethtool, dioda portu</text><text x="580" y="473" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b">błąd: NO-CARRIER, błędy CRC</text><rect x="70" y="374" width="520" height="54" rx="8" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="84" y="407" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#c46a12" font-weight="700">L2</text><text x="150" y="397" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" font-weight="700">Czy znam MAC bramy/sąsiada?</text><text x="150" y="417" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3">ip neigh, arp -a</text><text x="610" y="407" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b">błąd: INCOMPLETE / FAILED</text><rect x="100" y="308" width="520" height="54" rx="8" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="114" y="341" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#2f6fb3" font-weight="700">L3</text><text x="180" y="331" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" font-weight="700">Czy jest trasa i odpowiedź IP?</text><text x="180" y="351" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3">ip route get, ping, traceroute</text><text x="640" y="341" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b">błąd: Network is unreachable, No route to host</text><rect x="130" y="242" width="520" height="54" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="144" y="275" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#2e7d4f" font-weight="700">L4</text><text x="210" y="265" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" font-weight="700">Czy port przyjmuje połączenie?</text><text x="210" y="285" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3">nc -zv host 5432, ss -tlnp</text><text x="670" y="275" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b">błąd: Connection refused / timed out</text><rect x="160" y="176" width="520" height="54" rx="8" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="174" y="209" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#6a4c9c" font-weight="700">L5–6</text><text x="240" y="199" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" font-weight="700">Czy TLS się zestawia?</text><text x="240" y="219" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3">openssl s_client -connect host:443</text><text x="700" y="209" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b">błąd: PKIX path building failed</text><rect x="190" y="110" width="520" height="54" rx="8" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="204" y="143" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#6a4c9c" font-weight="700">L7</text><text x="270" y="133" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" font-weight="700">Czy aplikacja odpowiada poprawnie?</text><text x="270" y="153" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2f6fb3">curl -v, logi aplikacji</text><text x="730" y="143" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b">błąd: 4xx, 5xx, zły JSON</text><line x1="20" y1="490" x2="20" y2="90" stroke="#2e7d4f" stroke-width="3" marker-end="url(#arr)"/><text x="450" y="532" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">Pierwsza warstwa, która nie przechodzi testu, to miejsce problemu — wyżej nie ma sensu szukać.</text>
</svg>
