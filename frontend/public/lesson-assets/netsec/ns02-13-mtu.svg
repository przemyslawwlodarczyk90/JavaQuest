<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Host ns-e ma MTU 9000, a łącze i router MTU 1500: mały ping przechodzi, ramka 4000 bajtów jest odrzucana. Testy ping -M do: 1472 bajty przechodzą, 1473 nie, 3000 host wysyła, ale ramka ginie. TCP wisi po handshake, bo MSS wynegocjowano z MTU 9000. Naprawa: jedno MTU w domenie L2.">
<title>Host ns-e ma MTU 9000, a łącze i router MTU 1500: mały ping przechodzi, ramka 4000 bajtów jest odrzucana. Testy ping -M do: 1472 bajty przechodzą, 1473 nie, 3000 host wysyła, ale ramka ginie. TCP wisi po handshake, bo MSS wynegocjowano z MTU 9000. Naprawa: jedno MTU w domenie L2.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">MTU: małe pakiety przechodzą, duże giną — „SSH działa, a scp i HTTPS wiszą”</text><rect x="40" y="80" width="180" height="60" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="130" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">ns-e</text><text x="130" y="126" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">MTU 9000</text><rect x="360" y="80" width="180" height="60" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="450" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">br-lab / łącze</text><text x="450" y="126" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">MTU 1500</text><rect x="680" y="80" width="180" height="60" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="770" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">ns-router</text><text x="770" y="126" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" text-anchor="middle">MTU 1500</text><line x1="542" y1="110" x2="678" y2="110" stroke="#6b6257" stroke-width="2"/><line x1="222" y1="100" x2="358" y2="100" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="290" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">ping 56 B ✓</text><line x1="222" y1="124" x2="330" y2="124" stroke="#b23b3b" stroke-width="4"/><text x="345" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#b23b3b" font-weight="700">✕</text><text x="276" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" text-anchor="middle" font-weight="700">ramka 4000 B — odrzucona</text><rect x="40" y="180" width="820" height="180" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="206" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">Test: ip netns exec ns-e ping -M do -s 1472 10.13.0.1   → przechodzi (1472 + 28 = 1500)</text><text x="105" y="230" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">ip netns exec ns-e ping -M do -s 1473 10.13.0.1   → nie przechodzi (1501 &gt; 1500)</text><text x="105" y="254" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">ip netns exec ns-e ping -M do -s 3000 10.13.0.1   → host wysyła, bo jego MTU = 9000; ramka ginie na łączu</text><text x="60" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Dlaczego TCP „wisi”: handshake (małe pakiety) przechodzi, MSS wynegocjowane z MTU 9000,</text><text x="60" y="306" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">pierwsze pełne segmenty danych giną bez ICMP „Fragmentation needed” (to nie router, tylko ta sama domena L2).</text><text x="60" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">Naprawa: wszystkie interfejsy w jednej domenie L2 mają to samo MTU → ip link set dev eth0 mtu 1500.</text>
</svg>
