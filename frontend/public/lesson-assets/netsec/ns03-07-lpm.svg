<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Tablica routera z trasami default, 10.0.0.0/8, 10.20.0.0/16, 10.20.30.0/24, 10.20.30.128/25 i trasami do 192.168. Dla adresu 10.20.30.200 pasuje pięć tras, wygrywa najdłuższy prefiks /25 przez 10.255.0.14. Metryka rozstrzyga tylko przy równej długości prefiksu.">
<title>Tablica routera z trasami default, 10.0.0.0/8, 10.20.0.0/16, 10.20.30.0/24, 10.20.30.128/25 i trasami do 192.168. Dla adresu 10.20.30.200 pasuje pięć tras, wygrywa najdłuższy prefiks /25 przez 10.255.0.14. Metryka rozstrzyga tylko przy równej długości prefiksu.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Longest prefix match: dokąd router wyśle pakiet do 10.20.30.200?</text><rect x="60" y="56" width="600" height="30" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="76" y="76" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">default via 203.0.113.1 dev wan0 metric 0</text><text x="680" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12">pasuje (/0)</text><rect x="60" y="92" width="600" height="30" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="76" y="112" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">10.0.0.0/8 via 10.255.0.2 dev eth1 metric 0</text><text x="680" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12">pasuje (/8)</text><rect x="60" y="128" width="600" height="30" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="76" y="148" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">10.20.0.0/16 via 10.255.0.6 dev eth2 metric 0</text><text x="680" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12">pasuje (/16)</text><rect x="60" y="164" width="600" height="30" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="76" y="184" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">10.20.30.0/24 via 10.255.0.10 dev eth3 metric 0</text><text x="680" y="184" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12">pasuje (/24)</text><rect x="60" y="200" width="600" height="30" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="76" y="220" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" font-weight="700">10.20.30.128/25 via 10.255.0.14 dev eth4 metric 0</text><text x="680" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" font-weight="700">✓ WYGRYWA (/25)</text><rect x="60" y="236" width="600" height="30" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="76" y="256" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">192.168.0.0/16 via 10.255.0.2 dev eth1 metric 20</text><text x="680" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257">nie pasuje</text><rect x="60" y="272" width="600" height="30" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="76" y="292" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">192.168.50.0/24 via 10.255.0.18 dev eth5 metric 10</text><text x="680" y="292" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257">nie pasuje</text><rect x="60" y="308" width="600" height="30" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="76" y="328" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">192.168.50.0/24 via 10.255.0.22 dev eth6 metric 30</text><text x="680" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257">nie pasuje</text><text x="60" y="356" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Pasują: /0, /8, /16, /24 i /25 — wybierana jest NAJDŁUŻSZA (najbardziej szczegółowa) trasa.</text><text x="60" y="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">Metryka rozstrzyga dopiero między trasami o tej samej długości prefiksu (192.168.50.0/24: metric 10 &lt; 30).</text>
</svg>
