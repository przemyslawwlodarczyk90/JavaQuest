<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Oś czasu trzech stacji: laptop czeka DIFS i losowy backoff, nadaje ramkę, punkt dostępowy odsyła ACK; telefon sąsiada nadaje swoją ramkę, a laptop czeka; potem obie stacje nadają jednocześnie, dochodzi do kolizji i laptop retransmituje. Wnioski: retransmisje warstwy 2 zwiększają opóźnienie, airtime jest współdzielony, RTT jest zmienne, przepustowość to ok. 50–60% prędkości PHY.">
<title>Oś czasu trzech stacji: laptop czeka DIFS i losowy backoff, nadaje ramkę, punkt dostępowy odsyła ACK; telefon sąsiada nadaje swoją ramkę, a laptop czeka; potem obie stacje nadają jednocześnie, dochodzi do kolizji i laptop retransmituje. Wnioski: retransmisje warstwy 2 zwiększają opóźnienie, airtime jest współdzielony, RTT jest zmienne, przepustowość to ok. 50–60% prędkości PHY.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Wi-Fi to medium współdzielone: czekaj, nadawaj, czekaj na ACK, powtarzaj</text><text x="40" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" font-weight="700">Twój laptop</text><line x1="170" y1="88" x2="860" y2="88" stroke="#d9d0c3" stroke-width="1"/><text x="40" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" font-weight="700">telefon sąsiada</text><line x1="170" y1="148" x2="860" y2="148" stroke="#d9d0c3" stroke-width="1"/><text x="40" y="212" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">punkt dostępowy</text><line x1="170" y1="208" x2="860" y2="208" stroke="#d9d0c3" stroke-width="1"/><rect x="180" y="72" width="40" height="32" rx="4" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="200" y="93" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle" font-weight="700">DIFS</text><rect x="222" y="72" width="60" height="32" rx="4" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="252" y="93" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle" font-weight="700">backoff</text><rect x="284" y="72" width="110" height="32" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="339" y="93" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2f6fb3" text-anchor="middle" font-weight="700">ramka</text><rect x="398" y="192" width="30" height="32" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="413" y="213" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f" text-anchor="middle" font-weight="700">ACK</text><rect x="440" y="132" width="40" height="32" rx="4" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="460" y="153" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle" font-weight="700">DIFS</text><rect x="482" y="132" width="120" height="32" rx="4" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="542" y="153" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#c46a12" text-anchor="middle" font-weight="700">ramka sąsiada</text><rect x="606" y="192" width="30" height="32" rx="4" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="621" y="213" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2e7d4f" text-anchor="middle" font-weight="700">ACK</text><rect x="440" y="72" width="70" height="32" rx="4" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="475" y="93" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle" font-weight="700">czeka…</text><rect x="645" y="72" width="110" height="32" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="700" y="93" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#b23b3b" text-anchor="middle" font-weight="700">ramka (kolizja)</text><rect x="660" y="132" width="90" height="32" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="705" y="153" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#b23b3b" text-anchor="middle" font-weight="700">ramka</text><rect x="762" y="72" width="90" height="32" rx="4" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="807" y="93" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#2f6fb3" text-anchor="middle" font-weight="700">retransmisja</text><rect x="40" y="260" width="820" height="104" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="284" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Brak ACK = retransmisja w warstwie 2 (do kilku razy, coraz dłuższy backoff) — dla TCP i Twojej aplikacji to „tylko” większe opóźnienie.</text><text x="60" y="308" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Wszyscy w kanale dzielą czas antenowy (airtime): wolny klient (daleko, stary standard) spowalnia wszystkich.</text><text x="60" y="332" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Efekt: zmienne RTT (jitter), długi ogon p99, przepustowość realnie ~50–60% prędkości PHY, half-duplex.</text><text x="60" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">Wi-Fi 6/7 (OFDMA, MU-MIMO, BSS coloring) łagodzi problem, ale go nie usuwa.</text>
</svg>
