<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">PAT (NAT overload): wiele hostów, jeden publiczny adres, rozróżnienie po portach</text><text x="50" y="66" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">proto</text><text x="140" y="66" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">wewnątrz (src)</text><text x="330" y="66" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">cel (dst)</text><text x="520" y="66" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">na zewnątrz (src po NAT)</text><text x="720" y="66" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6257" font-weight="700">uwaga</text><rect x="40" y="74" width="820" height="32" rx="4" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="96" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">TCP</text><text x="140" y="96" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">192.168.1.20:51000</text><text x="330" y="96" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">93.184.216.34:443</text><text x="520" y="96" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2e7d4f" font-weight="700">203.0.113.5:51000</text><text x="720" y="96" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">port zachowany</text><rect x="40" y="110" width="820" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="132" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">TCP</text><text x="140" y="132" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">192.168.1.21:51000</text><text x="330" y="132" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">93.184.216.34:443</text><text x="520" y="132" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#b23b3b" font-weight="700">203.0.113.5:1024</text><text x="720" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b">port zmieniony (kolizja)</text><rect x="40" y="146" width="820" height="32" rx="4" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="168" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">TCP</text><text x="140" y="168" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">192.168.1.22:40000</text><text x="330" y="168" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">93.184.216.34:443</text><text x="520" y="168" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2e7d4f" font-weight="700">203.0.113.5:40000</text><text x="720" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">port zachowany</text><rect x="40" y="182" width="820" height="32" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="204" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">UDP</text><text x="140" y="204" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">192.168.1.20:53000</text><text x="330" y="204" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">1.1.1.1:53</text><text x="520" y="204" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2e7d4f" font-weight="700">203.0.113.5:53000</text><text x="720" y="204" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">port zachowany</text><rect x="40" y="218" width="820" height="32" rx="4" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="50" y="240" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">TCP</text><text x="140" y="240" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">192.168.1.20:51000</text><text x="330" y="240" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">140.82.121.4:443</text><text x="520" y="240" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2e7d4f" font-weight="700">203.0.113.5:51000</text><text x="720" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">port zachowany</text><text x="40" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">Dwa laptopy użyły tego samego portu 51000 do tego samego celu — drugi dostał inny port zewnętrzny.</text><text x="40" y="324" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">Unikalność wymagana jest dla (protokół, adres i port po NAT, cel, port celu): do różnych celów port 51000 można użyć wielokrotnie.</text>
