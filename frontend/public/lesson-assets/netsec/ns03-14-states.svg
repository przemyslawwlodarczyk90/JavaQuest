<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Stany sąsiedztwa OSPF: Down, Init, 2-Way (wybór DR/BDR), ExStart (ustalanie master/slave, tu zatrzymuje się przy niezgodnym MTU), Exchange (DBD), Loading (LSR i LSU), Full. Typy pakietów: Hello, DBD, LSR, LSU, LSAck; parametry, które muszą się zgadzać w Hello; adresy multicast 224.0.0.5 i 224.0.0.6.">
<title>Stany sąsiedztwa OSPF: Down, Init, 2-Way (wybór DR/BDR), ExStart (ustalanie master/slave, tu zatrzymuje się przy niezgodnym MTU), Exchange (DBD), Loading (LSR i LSU), Full. Typy pakietów: Hello, DBD, LSR, LSU, LSAck; parametry, które muszą się zgadzać w Hello; adresy multicast 224.0.0.5 i 224.0.0.6.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Od Hello do Full: stany sąsiedztwa i pakiety OSPF</text><rect x="40" y="52" width="140" height="38" rx="6" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="110" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6b6257" text-anchor="middle" font-weight="700">Down</text><text x="196" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">brak Hello od sąsiada</text><line x1="110" y1="90" x2="110" y2="98" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="98" width="140" height="38" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="110" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">Init</text><text x="196" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">dostałem Hello, ale bez mojego RID</text><line x1="110" y1="136" x2="110" y2="144" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="144" width="140" height="38" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="110" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">2-Way</text><text x="196" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">widzimy się nawzajem; wybór DR/BDR</text><line x1="110" y1="182" x2="110" y2="190" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="190" width="140" height="38" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="110" y="214" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">ExStart</text><text x="196" y="214" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">master/slave dla DBD — tu utyka przy złym MTU</text><line x1="110" y1="228" x2="110" y2="236" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="236" width="140" height="38" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="110" y="260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">Exchange</text><text x="196" y="260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">wymiana DBD (spis LSA)</text><line x1="110" y1="274" x2="110" y2="282" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="282" width="140" height="38" rx="6" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="110" y="306" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" text-anchor="middle" font-weight="700">Loading</text><text x="196" y="306" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">LSR → LSU: dociągnięcie brakujących LSA</text><line x1="110" y1="320" x2="110" y2="328" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="328" width="140" height="38" rx="6" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="110" y="352" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Full</text><text x="196" y="352" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">LSDB zsynchronizowane — liczymy SPF</text><rect x="560" y="52" width="300" height="316" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="576" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">Typy pakietów OSPF (protokół IP 89):</text><text x="576" y="97" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">1 Hello — wykrywanie sąsiadów, keepalive</text><text x="576" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">2 DBD — opis bazy (nagłówki LSA)</text><text x="576" y="139" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">3 LSR — żądanie konkretnych LSA</text><text x="576" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">4 LSU — aktualizacja (pełne LSA)</text><text x="576" y="181" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">5 LSAck — potwierdzenie</text><text x="576" y="202" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14"></text><text x="576" y="223" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">Hello musi się zgadzać:</text><text x="576" y="244" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• obszar i typ obszaru</text><text x="576" y="265" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• maska podsieci (sieci broadcast)</text><text x="576" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• Hello/Dead interval (10/40 s)</text><text x="576" y="307" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• uwierzytelnianie</text><text x="576" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">• unikalny Router ID</text><text x="576" y="349" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">MTU sprawdzany w DBD → ExStart</text><text x="40" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Multicast: 224.0.0.5 (AllSPFRouters), 224.0.0.6 (AllDRouters); OSPFv3: ff02::5, ff02::6. Na łączu P2P brak DR/BDR.</text><text x="40" y="414" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">Diagnoza: show ip ospf neighbor (FRR: vtysh -c &quot;show ip ospf neighbor&quot;) — stan, priorytet, Dead time, interfejs.</text>
</svg>
