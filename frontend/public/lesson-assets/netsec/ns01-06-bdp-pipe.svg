<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Rura o średnicy 100 Mb/s i długości RTT 50 ms mieści 625 000 bajtów; okno 64 KiB wypełnia ją w małej części (około 10,5 Mb/s), okno co najmniej równe BDP pozwala wykorzystać pełne 100 Mb/s">
<title>Rura o średnicy 100 Mb/s i długości RTT 50 ms mieści 625 000 bajtów; okno 64 KiB wypełnia ją w małej części (około 10,5 Mb/s), okno co najmniej równe BDP pozwala wykorzystać pełne 100 Mb/s</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Bandwidth-delay product: ile danych mieści się „w rurze”</text><rect x="120" y="70" width="660" height="110" rx="55" fill="#dce9f7" stroke="#2f6fb3" stroke-width="2"/><text x="450" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" text-anchor="middle" font-weight="700">RTT = 50 ms (długość rury)</text><text x="800" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700">100 Mb/s</text><text x="800" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257">(średnica)</text><rect x="140" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="171" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="202" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="233" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="264" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="295" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="326" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="357" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="388" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="419" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="450" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="481" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="512" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="543" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="574" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="605" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="636" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="667" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="698" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="729" y="105" width="24" height="40" rx="4" fill="#2e7d4f" opacity="0.8"/><text x="450" y="208" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#1f1a14" text-anchor="middle" font-weight="700">BDP = 100 Mb/s × 0,05 s = 5 Mb = 625 000 bajtów „w locie”</text><rect x="60" y="236" width="380" height="150" rx="10" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="250" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" text-anchor="middle" font-weight="700">Okno 64 KiB (bez skalowania)</text><rect x="90" y="282" width="24" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="121" y="282" width="24" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><text x="250" y="340" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="middle">65 535 B / 0,05 s ≈ 10,5 Mb/s</text><text x="250" y="364" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rura prawie pusta: nadawca czeka na ACK</text><rect x="460" y="236" width="380" height="150" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="650" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">Okno ≥ BDP (skalowanie okna)</text><rect x="480" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="514" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="548" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="582" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="616" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="650" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="684" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="718" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="752" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><rect x="786" y="282" width="26" height="30" rx="4" fill="#2e7d4f" opacity="0.8"/><text x="650" y="340" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="middle">okno 1 MB → do 100 Mb/s</text><text x="650" y="364" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rura pełna: łącze w pełni wykorzystane</text>
</svg>
