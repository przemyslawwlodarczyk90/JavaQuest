<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Wodospad faz żądania HTTPS z curl: DNS, połączenie TCP, TLS, czekanie na serwer i transfer — przy RTT 2 ms razem 46 ms, po dodaniu 100 ms opóźnienia razem 447 ms">
<title>Wodospad faz żądania HTTPS z curl: DNS, połączenie TCP, TLS, czekanie na serwer i transfer — przy RTT 2 ms razem 46 ms, po dodaniu 100 ms opóźnienia razem 447 ms</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Gdzie ucieka czas żądania HTTPS? (curl -w, przed i po +100 ms opóźnienia)</text><text x="188" y="106" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="end" font-weight="700">przed (RTT 2 ms)</text><rect x="200" y="80" width="6.2" height="40" rx="3" fill="#6b6257" opacity="0.85"/><rect x="206.2" y="80" width="3.1" height="40" rx="3" fill="#2f6fb3" opacity="0.85"/><rect x="209.29999999999998" y="80" width="7.75" height="40" rx="3" fill="#6a4c9c" opacity="0.85"/><rect x="217.04999999999998" y="80" width="49.6" height="40" rx="3" fill="#c46a12" opacity="0.85"/><text x="241.85" y="105" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">32 ms</text><rect x="266.65" y="80" width="4.65" height="40" rx="3" fill="#2e7d4f" opacity="0.85"/><text x="279.29999999999995" y="105" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">razem 46 ms</text><text x="188" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="end" font-weight="700">po netem 100 ms</text><rect x="200" y="190" width="6.2" height="40" rx="3" fill="#6b6257" opacity="0.85"/><rect x="206.2" y="190" width="158.1" height="40" rx="3" fill="#2f6fb3" opacity="0.85"/><text x="285.25" y="215" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">102 ms</text><rect x="364.29999999999995" y="190" width="164.3" height="40" rx="3" fill="#6a4c9c" opacity="0.85"/><text x="446.44999999999993" y="215" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">106 ms</text><rect x="528.5999999999999" y="190" width="204.6" height="40" rx="3" fill="#c46a12" opacity="0.85"/><text x="630.8999999999999" y="215" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">132 ms</text><rect x="733.1999999999999" y="190" width="159.65" height="40" rx="3" fill="#2e7d4f" opacity="0.85"/><text x="813.025" y="215" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">103 ms</text><text x="900.8499999999999" y="215" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">razem 447 ms</text><rect x="60" y="300" width="14" height="14" rx="3" fill="#6b6257"/><text x="80" y="312" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">DNS</text><rect x="225" y="300" width="14" height="14" rx="3" fill="#2f6fb3"/><text x="245" y="312" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">TCP connect</text><rect x="390" y="300" width="14" height="14" rx="3" fill="#6a4c9c"/><text x="410" y="312" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">TLS</text><rect x="555" y="300" width="14" height="14" rx="3" fill="#c46a12"/><text x="575" y="312" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">czekanie na serwer (TTFB)</text><rect x="720" y="300" width="14" height="14" rx="3" fill="#2e7d4f"/><text x="740" y="312" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">transfer</text><text x="450" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">Dodatkowe 100 ms RTT nie dodaje 100 ms — dodaje je w każdej fazie wymagającej wymiany pakietów:</text><text x="450" y="372" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">handshake TCP (1 RTT), TLS 1.3 (1 RTT), żądanie i pierwsza odpowiedź (1 RTT) oraz transfer.</text>
</svg>
