<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Sprawdzenie przynależności w trzech krokach dla 172.30.16.0/23: interesujący oktet to trzeci (maska 254), magiczna liczba 2, blok obejmuje 172.30.16.0–172.30.17.255. Adres 172.30.17.200 należy, 172.30.18.1 leży już w kolejnym bloku.">
<title>Sprawdzenie przynależności w trzech krokach dla 172.30.16.0/23: interesujący oktet to trzeci (maska 254), magiczna liczba 2, blok obejmuje 172.30.16.0–172.30.17.255. Adres 172.30.17.200 należy, 172.30.18.1 leży już w kolejnym bloku.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Czy 172.30.17.200 i 172.30.18.1 należą do 172.30.16.0/23? Trzy kroki w głowie</text><rect x="40" y="56" width="820" height="54" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="70" y="89" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#2f6fb3" text-anchor="middle" font-weight="700">1</text><text x="100" y="79" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700">Interesujący oktet</text><text x="100" y="99" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">/23 = 8 + 8 + 7 → trzeci oktet (maska 254)</text><rect x="40" y="122" width="820" height="54" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="70" y="155" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#c46a12" text-anchor="middle" font-weight="700">2</text><text x="100" y="145" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" font-weight="700">Magiczna liczba</text><text x="100" y="165" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">256 − 254 = 2 → bloki w 3. oktecie: …14, 16, 18, 20…</text><rect x="40" y="188" width="820" height="54" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="70" y="221" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#6a4c9c" text-anchor="middle" font-weight="700">3</text><text x="100" y="211" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" font-weight="700">Zakres bloku</text><text x="100" y="231" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14">16.0 – 17.255 (sieć 172.30.16.0, broadcast 172.30.17.255)</text><rect x="40" y="266" width="400" height="92" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="240" y="294" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">172.30.17.200</text><text x="240" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">trzeci oktet 17 ∈ {16, 17}</text><text x="240" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2e7d4f" text-anchor="middle" font-weight="700">✓ NALEŻY</text><rect x="460" y="266" width="400" height="92" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="660" y="294" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">172.30.18.1</text><text x="660" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">trzeci oktet 18 → następny blok (18–19)</text><text x="660" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#b23b3b" text-anchor="middle" font-weight="700">✕ NIE NALEŻY</text>
</svg>
