<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Sieć IPv6-only: klient pyta DNS64 o AAAA, resolver zwraca syntetyczny adres 64:ff9b::8c52:7904 utworzony z 140.82.121.4, klient łączy się po IPv6 z bramą NAT64, która tłumaczy ruch na IPv4 do serwera. Literały IPv4 wymagają 464XLAT.">
<title>Sieć IPv6-only: klient pyta DNS64 o AAAA, resolver zwraca syntetyczny adres 64:ff9b::8c52:7904 utworzony z 140.82.121.4, klient łączy się po IPv6 z bramą NAT64, która tłumaczy ruch na IPv4 do serwera. Literały IPv4 wymagają 464XLAT.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Sieć IPv6-only: DNS64 syntetyzuje AAAA, NAT64 tłumaczy na IPv4</text><rect x="40" y="70" width="170" height="60" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="125" y="96" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">klient IPv6-only</text><text x="125" y="116" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">2001:db8:1::20</text><rect x="300" y="70" width="170" height="60" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="385" y="96" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">DNS64</text><text x="385" y="116" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">resolver</text><rect x="300" y="170" width="170" height="60" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="385" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">NAT64</text><text x="385" y="216" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">64:ff9b::/96</text><rect x="600" y="170" width="220" height="60" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="710" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">serwer tylko IPv4</text><text x="710" y="216" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">140.82.121.4</text><line x1="212" y1="92" x2="298" y2="92" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="255" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">① AAAA?</text><line x1="298" y1="116" x2="212" y2="116" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="222" y="150" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1f1a14">② AAAA 64:ff9b::8c52:7904</text><line x1="125" y1="132" x2="125" y2="200" stroke="#6b6257" stroke-width="2"/><line x1="125" y1="200" x2="298" y2="200" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="210" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">③ TCP do 64:ff9b::…</text><line x1="472" y1="200" x2="598" y2="200" stroke="#6b6257" stroke-width="2" marker-end="url(#arr)"/><text x="535" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">④ IPv4</text><rect x="40" y="260" width="820" height="124" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="284" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">DNS64: dla domeny bez AAAA zwraca syntetyczny AAAA = prefiks 64:ff9b::/96 + adres IPv4 (140.82.121.4 → 8c52:7904).</text><text x="60" y="306" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">NAT64: stanowa translacja IPv6 → IPv4 (jak PAT). Działa dla aplikacji używających nazw DNS.</text><text x="60" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">Nie działa: literały IPv4 w aplikacji (http://203.0.113.5) i protokoły z adresami w treści → 464XLAT (CLAT na urządzeniu)</text><text x="60" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">tworzy lokalny „IPv4” i tłumaczy go na IPv6 — standard u operatorów mobilnych (Android, iOS) i w AWS (DNS64 + NAT64 w NAT GW).</text><text x="60" y="372" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">DNSSEC: zsyntetyzowane AAAA nie mają podpisu — walidujący klient musi syntetyzować sam (RFC 6147).</text>
</svg>
