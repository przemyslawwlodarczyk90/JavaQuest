<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Porównanie: klient sekwencyjny próbuje IPv6, czeka 10 sekund do timeoutu i dopiero łączy się po IPv4 po 10 028 ms; Happy Eyeballs v2 po 250 ms startuje równolegle IPv4 i łączy się po 278 ms. Klasyczne klienty JDK łączą się z pierwszym adresem z resolvera.">
<title>Porównanie: klient sekwencyjny próbuje IPv6, czeka 10 sekund do timeoutu i dopiero łączy się po IPv4 po 10 028 ms; Happy Eyeballs v2 po 250 ms startuje równolegle IPv4 i łączy się po 278 ms. Klasyczne klienty JDK łączą się z pierwszym adresem z resolvera.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">AAAA istnieje, IPv6 nie działa: klient sekwencyjny vs Happy Eyeballs v2</text><text x="60" y="70" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" font-weight="700">Klient sekwencyjny (najpierw IPv6, timeout 10 s):</text><rect x="60" y="82" width="757.2815533980582" height="30" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="438.6407766990291" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">SYN IPv6 → brak odpowiedzi … timeout 10 000 ms</text><rect x="817.2815533980582" y="82" width="6" height="30" rx="2" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="815.4019417475729" y="128" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="end" font-weight="700">IPv4 OK: 10028 ms</text><text x="60" y="172" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" font-weight="700">Happy Eyeballs v2 (RFC 8305): IPv6, po 250 ms równolegle IPv4, wygrywa pierwszy:</text><rect x="60" y="184" width="48.932038834951456" height="30" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="66" y="204" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14">IPv6…</text><rect x="78.93203883495146" y="222" width="8" height="30" rx="2" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="91.05242718446601" y="242" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">IPv4 OK: 278 ms — użytkownik nic nie zauważa</text><text x="60" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">0 ms</text><line x1="60" y1="262" x2="60" y2="266" stroke="#6b6257" stroke-width="2"/><text x="249.32038834951456" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">2500 ms</text><line x1="249.32038834951456" y1="262" x2="249.32038834951456" y2="266" stroke="#6b6257" stroke-width="2"/><text x="438.6407766990291" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">5000 ms</text><line x1="438.6407766990291" y1="262" x2="438.6407766990291" y2="266" stroke="#6b6257" stroke-width="2"/><text x="627.9611650485436" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">7500 ms</text><line x1="627.9611650485436" y1="262" x2="627.9611650485436" y2="266" stroke="#6b6257" stroke-width="2"/><text x="817.2815533980582" y="276" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">10000 ms</text><line x1="817.2815533980582" y1="262" x2="817.2815533980582" y2="266" stroke="#6b6257" stroke-width="2"/><rect x="40" y="296" width="820" height="90" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Przeglądarki, curl (≥ 7.59), systemowe resolvery Apple, Go, Python asyncio — mają Happy Eyeballs.</text><text x="60" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Klasyczne klienty JDK (Socket, HttpURLConnection, HttpClient) łączą się z pierwszym adresem z resolvera —</text><text x="60" y="364" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">przy zepsutym IPv6 każde nowe połączenie czeka connectTimeout. Objaw: „aplikacja raz na jakiś czas strasznie zwalnia”.</text>
</svg>
