<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Cztery miejsca przechowywania: Flash z obrazem IOS, RAM z running-config działającym teraz, NVRAM ze startup-config ładowanym po restarcie oraz zewnętrzne kopie przez TFTP, SCP lub Git; polecenie copy running-config startup-config zapisuje zmiany; ostrzeżenie, że zmiany działają od razu, ale bez zapisu znikną po restarcie, i porada reload in 10.">
<title>Cztery miejsca przechowywania: Flash z obrazem IOS, RAM z running-config działającym teraz, NVRAM ze startup-config ładowanym po restarcie oraz zewnętrzne kopie przez TFTP, SCP lub Git; polecenie copy running-config startup-config zapisuje zmiany; ostrzeżenie, że zmiany działają od razu, ale bez zapisu znikną po restarcie, i porada reload in 10.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Gdzie żyje konfiguracja: running-config vs startup-config</text><rect x="40" y="70" width="190" height="90" rx="10" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="135" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">Flash</text><text x="135" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">obraz systemu IOS (.bin)</text><rect x="250" y="70" width="190" height="90" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="345" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#2e7d4f" text-anchor="middle" font-weight="700">RAM</text><text x="345" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">running-config — działa TERAZ</text><rect x="460" y="70" width="190" height="90" rx="10" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="555" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#2f6fb3" text-anchor="middle" font-weight="700">NVRAM</text><text x="555" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">startup-config — po restarcie</text><rect x="670" y="70" width="190" height="90" rx="10" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="765" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#6a4c9c" text-anchor="middle" font-weight="700">TFTP/SCP/Git</text><text x="765" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">kopie zapasowe, wersjonowanie</text><line x1="250" y1="210" x2="440" y2="210" stroke="#2e7d4f" stroke-width="3" marker-end="url(#arr)"/><text x="345" y="200" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle" font-weight="700">copy running-config startup-config</text><text x="345" y="228" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6257" text-anchor="middle">(write memory)</text><line x1="555" y1="250" x2="365" y2="250" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><text x="460" y="270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2f6fb3" text-anchor="middle">przy starcie: startup → running</text><line x1="650" y1="210" x2="740" y2="170" stroke="#6a4c9c" stroke-width="2" marker-end="url(#arr)"/><text x="700" y="222" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6a4c9c">copy run scp://…</text><rect x="40" y="296" width="820" height="80" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="60" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b23b3b" font-weight="700">Zmiany w trybie konfiguracji działają natychmiast, ale tylko w RAM.</text><text x="60" y="346" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Brak zapisu → utrata zmian po restarcie. Zły zapis → błąd przetrwa restart. Zanim zapiszesz: sprawdź.</text><text x="60" y="366" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Bezpiecznik: reload in 10 przed ryzykowną zmianą zdalną (cofnie do startup-config, jeśli stracisz dostęp).</text>
</svg>
