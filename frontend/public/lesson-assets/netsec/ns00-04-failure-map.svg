<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Tabela: dla każdego z dwunastu etapów typowy błąd (np. UnknownHostException przy DNS, Connection refused przy TCP, PKIX przy TLS, 502 i 504 przy proxy, 401 i 403 przy filtrach, wyczerpana pula przy HikariCP) i numer rozdziału toru">
<title>Tabela: dla każdego z dwunastu etapów typowy błąd (np. UnknownHostException przy DNS, Connection refused przy TCP, PKIX przy TLS, 502 i 504 przy proxy, 401 i 403 przy filtrach, wyczerpana pula przy HikariCP) i numer rozdziału toru</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Każdy etap ma swój typowy błąd — i swój rozdział toru</text><rect x="30" y="52" width="260" height="32" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="73" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" font-weight="700">1. Parsowanie URL</text><rect x="300" y="52" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="73" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">zły schemat lub port, literówka w hoście</text><rect x="780" y="52" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="73" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 06</text><rect x="30" y="90" width="260" height="32" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="111" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" font-weight="700">2. Cache i HSTS</text><rect x="300" y="90" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="111" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">nieaktualna odpowiedź z cache, ostrzeżenie HSTS</text><rect x="780" y="90" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="111" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 06</text><rect x="30" y="128" width="260" height="32" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="149" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" font-weight="700">3. Rozwiązanie nazwy (DNS)</text><rect x="300" y="128" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="149" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">UnknownHostException, zły rekord, stary cache</text><rect x="780" y="128" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="149" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 05</text><rect x="30" y="166" width="260" height="32" rx="6" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="42" y="187" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" font-weight="700">4. Trasa i ARP</text><rect x="300" y="166" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="187" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">No route to host, brak odpowiedzi ARP</text><rect x="780" y="166" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="187" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 02</text><rect x="30" y="204" width="260" height="32" rx="6" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="42" y="225" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">5. Handshake TCP</text><rect x="300" y="204" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="225" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Connection refused, connect timed out</text><rect x="780" y="204" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="225" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 04</text><rect x="30" y="242" width="260" height="32" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="42" y="263" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" font-weight="700">6. Handshake TLS 1.3</text><rect x="300" y="242" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="263" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">SSLHandshakeException, PKIX, wygasły certyfikat</text><rect x="780" y="242" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="263" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 07</text><rect x="30" y="280" width="260" height="32" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="301" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" font-weight="700">7. Żądanie HTTP/2</text><rect x="300" y="280" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="301" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">400, 413, problemy z HTTP/2</text><rect x="780" y="280" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="301" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 06</text><rect x="30" y="318" width="260" height="32" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="339" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" font-weight="700">8. Reverse proxy</text><rect x="300" y="318" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="339" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">502, 503, 504</text><rect x="780" y="318" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="339" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 11</text><rect x="30" y="356" width="260" height="32" rx="6" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="42" y="377" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">9. Tomcat i filtry</text><rect x="300" y="356" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="377" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">401, 403, wyczerpana pula wątków</text><rect x="780" y="356" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="377" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 12</text><rect x="30" y="394" width="260" height="32" rx="6" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="42" y="415" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">10. DispatcherServlet i kontroler</text><rect x="300" y="394" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="415" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">404, 400, 500 z wyjątku</text><rect x="780" y="394" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="415" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 06</text><rect x="30" y="432" width="260" height="32" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="453" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" font-weight="700">11. HikariCP i protokół PostgreSQL</text><rect x="300" y="432" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="453" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">SQLTransientConnectionException, timeout zapytania</text><rect x="780" y="432" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="453" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 12</text><rect x="30" y="470" width="260" height="32" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="42" y="491" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3" font-weight="700">12. Odpowiedź i droga powrotna</text><rect x="300" y="470" width="470" height="32" rx="6" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="312" y="491" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">błędy serializacji, ucięta odpowiedź, timeouty</text><rect x="780" y="470" width="90" height="32" rx="6" fill="#fbf8f3" stroke="#d9d0c3" stroke-width="1.5"/><text x="825" y="491" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">rozdz. 06</text>
</svg>
