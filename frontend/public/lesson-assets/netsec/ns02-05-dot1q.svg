<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Ramka Ethernet z 4-bajtowym znacznikiem 802.1Q między adresem źródłowym a polem EtherType; znacznik składa się z TPID 0x8100 (16 bitów) oraz pól PCP (3 bity priorytetu), DEI (1 bit) i VID (12 bitów numeru VLAN). Przykład: TCI 0xA014 oznacza priorytet 5 i VLAN 20.">
<title>Ramka Ethernet z 4-bajtowym znacznikiem 802.1Q między adresem źródłowym a polem EtherType; znacznik składa się z TPID 0x8100 (16 bitów) oraz pól PCP (3 bity priorytetu), DEI (1 bit) i VID (12 bitów numeru VLAN). Przykład: TCI 0xA014 oznacza priorytet 5 i VLAN 20.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Znacznik 802.1Q: 4 bajty wstawione między adres źródłowy a EtherType</text><rect x="60" y="66" width="120" height="50" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="120" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">MAC docelowy</text><text x="120" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">6 B</text><rect x="184" y="66" width="120" height="50" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="244" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">MAC źródłowy</text><text x="244" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">6 B</text><rect x="308" y="66" width="100" height="50" rx="4" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="358" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">802.1Q tag</text><text x="358" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">4 B</text><line x1="308" y1="118" x2="160" y2="180" stroke="#6a4c9c" stroke-width="2"/><line x1="408" y1="118" x2="840" y2="180" stroke="#6a4c9c" stroke-width="2"/><rect x="412" y="66" width="90" height="50" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="457" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">EtherType</text><text x="457" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">2 B</text><rect x="506" y="66" width="240" height="50" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="626" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">dane</text><text x="626" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">46–1500 B</text><rect x="750" y="66" width="70" height="50" rx="4" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="785" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">FCS</text><text x="785" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">4 B</text><rect x="160" y="182" width="280" height="50" rx="3" fill="#e9e1f5" stroke="#1f1a14" stroke-width="1.5"/><text x="300" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">TPID = 0x8100</text><text x="300" y="223" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">16 bitów</text><text x="300" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">mówi: „tu jest znacznik VLAN”</text><rect x="440" y="182" width="110" height="50" rx="3" fill="#fbe6cf" stroke="#1f1a14" stroke-width="1.5"/><text x="495" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">PCP</text><text x="495" y="223" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">3 bity</text><text x="495" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">priorytet 0–7 (802.1p)</text><rect x="550" y="182" width="70" height="50" rx="3" fill="#f6dcdc" stroke="#1f1a14" stroke-width="1.5"/><text x="585" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">DEI</text><text x="585" y="223" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">1 bit</text><text x="585" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">do odrzucenia</text><rect x="620" y="182" width="220" height="50" rx="3" fill="#dcefe3" stroke="#1f1a14" stroke-width="1.5"/><text x="730" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">VID</text><text x="730" y="223" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">12 bitów</text><text x="730" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">numer VLAN 0–4095</text><rect x="60" y="296" width="780" height="66" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="80" y="320" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" font-weight="700">Przykład TCI = 0xA014 → 1010 0000 0001 0100 → PCP = 5 (głos), DEI = 0, VID = 0x014 = 20</text><text x="80" y="344" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Ramka z tagiem: maks. 1522 B zamiast 1518 B. VID 0 i 4095 są zarezerwowane → 4094 użyteczne VLAN-y.</text>
</svg>
