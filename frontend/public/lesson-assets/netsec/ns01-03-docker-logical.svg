<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Ten sam host fizyczny z kontenerami proxy, app i db oraz logiczna topologia dwóch sieci Docker: frontend i backend, gdzie tylko app należy do obu">
<title>Ten sam host fizyczny z kontenerami proxy, app i db oraz logiczna topologia dwóch sieci Docker: frontend i backend, gdzie tylko app należy do obu</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Jeden host fizycznie, dwie sieci logicznie (Docker Compose)</text><rect x="20" y="56" width="270" height="320" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="155" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">Fizycznie</text><rect x="50" y="110" width="210" height="200" rx="10" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="155" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle">jeden laptop / VM</text><rect x="80" y="150" width="150" height="36" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="155" y="173" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">proxy</text><rect x="80" y="198" width="150" height="36" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="155" y="221" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">app</text><rect x="80" y="246" width="150" height="36" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="155" y="269" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">db</text><text x="155" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">jedna karta sieciowa, jeden kabel</text><rect x="310" y="56" width="570" height="320" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="595" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">Logicznie: dwa bridge’e = dwie gwiazdy</text><rect x="330" y="110" width="250" height="210" rx="10" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="455" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">sieć frontend</text><rect x="610" y="110" width="250" height="210" rx="10" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="735" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#6a4c9c" text-anchor="middle" font-weight="700">sieć backend (internal: true)</text><rect x="407" y="164" width="96" height="32" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="455" y="185" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2f6fb3" text-anchor="middle" font-weight="700">br-frontend</text><rect x="687" y="164" width="96" height="32" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.5"/><text x="735" y="185" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">br-backend</text><line x1="455" y1="196" x2="400" y2="254" stroke="#2f6fb3" stroke-width="2"/><rect x="366" y="254" width="68" height="32" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="400" y="275" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">proxy</text><line x1="455" y1="196" x2="595" y2="254" stroke="#2f6fb3" stroke-width="2"/><line x1="735" y1="196" x2="595" y2="254" stroke="#6a4c9c" stroke-width="2"/><rect x="561" y="254" width="68" height="32" rx="6" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="595" y="275" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#c46a12" text-anchor="middle" font-weight="700">app</text><line x1="735" y1="196" x2="800" y2="254" stroke="#6a4c9c" stroke-width="2"/><rect x="770" y="254" width="60" height="32" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="800" y="275" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">db</text><text x="595" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">proxy nie ma żadnej ścieżki do bazy; tylko app należy do obu sieci</text>
</svg>
