s, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">172.17.0.3</text><text x="290" y="126" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">172.17.0.2</text><text x="410" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">TCP</text><text x="480" y="126" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">51334 → 8080 [SYN] Seq=0 Win=64240 MSS=1460</text><rect x="32" y="135" width="836" height="23" fill="#e7e6ff"/><text x="38" y="151" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">2</text><text x="80" y="151" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">0.000041</text><text x="170" y="151" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">172.17.0.2</text><text x="290" y="151" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">172.17.0.3</text><text x="410" y="151" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">TCP</text><text x="480" y="151" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">8080 → 51334 [SYN, ACK] Seq=0 Ack=1</text><rect x="32" y="160" width="836" height="23" fill="#e4ffc7"/><text x="38" y="176" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">4</text><text x="80" y="176" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">0.000312</text><text x="170" y="176" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">172.17.0.3</text><text x="290" y="176" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">172.17.0.2</text><text x="410" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">HTTP</text><text x="480" y="176" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">GET /users/42 HTTP/1.1</text><rect x="32" y="185" width="836" height="23" fill="#e4ffc7"/><text x="38" y="201" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">6</text><text x="80" y="201" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">0.012877</text><text x="170" y="201" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">172.17.0.2</text><text x="290" y="201" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">172.17.0.3</text><text x="410" y="201" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">HTTP</text><text x="480" y="201" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">HTTP/1.1 200  (application/json)</text><rect x="30" y="224" width="840" height="116" rx="4" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="40" y="244" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">▸ Frame 4: 133 bytes on wire (1064 bits), 133 bytes captured</text><text x="40" y="265" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">▸ Ethernet II, Src: 02:42:ac:11:00:03, Dst: 02:42:ac:11:00:02</text><text x="40" y="286" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">▸ Internet Protocol Version 4, Src: 172.17.0.3, Dst: 172.17.0.2</text><text x="40" y="307" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">▸ Transmission Control Protocol, Sr