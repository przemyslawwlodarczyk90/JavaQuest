, AWS</text><text x="598" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">11 proxy i load balancing</text><text x="34" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">12 sieci w Javie</text><rect x="20" y="218" width="860" height="56" rx="10" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="34" y="239" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" font-weight="700">II. Infrastruktura i operacje</text><text x="34" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">13 infrastruktura, Wi-Fi, WAN</text><text x="316" y="262" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">14 operacje i automatyzacja</text><rect x="20" y="284" width="860" height="264" rx="10" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="34" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#6a4c9c" font-weight="700">III. Cyberbezpieczeństwo blue team</text><text x="34" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">15 fundamenty bezpieczeństwa</text><text x="316" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">16 tożsamość i dostęp</text><text x="598" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">17 kryptografia stosowana</text><text x="34" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">18 Windows i Active Directory</text><text x="316" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">19 Linux: telemetria i detekcja</text><text x="598" y="354" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a