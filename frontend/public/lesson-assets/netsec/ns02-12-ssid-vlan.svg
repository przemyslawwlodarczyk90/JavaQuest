<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Projekt mapowania: SSID CORP z WPA3-Enterprise i EAP-TLS do VLAN 10 z dostępem do aplikacji wewnętrznych; SSID GUEST z OWE lub portalem i izolacją klientów do VLAN 60 tylko z dostępem do Internetu i limitem; SSID IOT z osobnym PSK do VLAN 50 z dostępem tylko do brokera MQTT i NTP. Każdy SSID kosztuje czas antenowy, więc 3–4 SSID to rozsądne maksimum.">
<title>Projekt mapowania: SSID CORP z WPA3-Enterprise i EAP-TLS do VLAN 10 z dostępem do aplikacji wewnętrznych; SSID GUEST z OWE lub portalem i izolacją klientów do VLAN 60 tylko z dostępem do Internetu i limitem; SSID IOT z osobnym PSK do VLAN 50 z dostępem tylko do brokera MQTT i NTP. Każdy SSID kosztuje czas antenowy, więc 3–4 SSID to rozsądne maksimum.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Zadanie z planu: trzy SSID, trzy VLAN-y, trzy polityki</text><rect x="40" y="60" width="160" height="90" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="120" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2f6fb3" text-anchor="middle" font-weight="700">SSID CORP</text><text x="120" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">(wszystkie AP)</text><line x1="202" y1="105" x2="248" y2="105" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><rect x="250" y="60" width="270" height="90" rx="8" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><text x="266" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">WPA3-Enterprise · EAP-TLS</text><text x="266" y="112" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">VLAN 10 · 10.10.0.0/22</text><text x="266" y="136" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257">trunk AP ↔ przełącznik</text><line x1="522" y1="105" x2="568" y2="105" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><rect x="570" y="60" width="290" height="90" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="586" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">polityka na firewallu/WLC:</text><text x="586" y="114" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" font-weight="700">dostęp do aplikacji wewnętrznych, 802.11r/k/v</text><rect x="40" y="170" width="160" height="90" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="120" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#c46a12" text-anchor="middle" font-weight="700">SSID GUEST</text><text x="120" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">(wszystkie AP)</text><line x1="202" y1="215" x2="248" y2="215" stroke="#c46a12" stroke-width="2" marker-end="url(#arr)"/><rect x="250" y="170" width="270" height="90" rx="8" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><text x="266" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">OWE / portal · izolacja klientów</text><text x="266" y="222" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">VLAN 60 · 10.60.0.0/22</text><text x="266" y="246" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257">trunk AP ↔ przełącznik</text><line x1="522" y1="215" x2="568" y2="215" stroke="#c46a12" stroke-width="2" marker-end="url(#arr)"/><rect x="570" y="170" width="290" height="90" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="586" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">polityka na firewallu/WLC:</text><text x="586" y="224" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" font-weight="700">tylko Internet, limit 10 Mb/s, krótka dzierżawa</text><rect x="40" y="280" width="160" height="90" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="120" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2e7d4f" text-anchor="middle" font-weight="700">SSID IOT</text><text x="120" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257" text-anchor="middle">(wszystkie AP)</text><line x1="202" y1="325" x2="248" y2="325" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><rect x="250" y="280" width="270" height="90" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="266" y="306" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">WPA2/3-Personal · osobne PSK</text><text x="266" y="332" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">VLAN 50 · 10.50.0.0/24</text><text x="266" y="356" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#6b6257">trunk AP ↔ przełącznik</text><line x1="522" y1="325" x2="568" y2="325" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><rect x="570" y="280" width="290" height="90" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="586" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257">polityka na firewallu/WLC:</text><text x="586" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" font-weight="700">tylko do brokera MQTT i NTP, brak Internetu</text><text x="450" y="404" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Zasada: każdy SSID kosztuje czas antenowy (beacony) — 3–4 SSID to rozsądne maksimum; rozdzielaj ruch VLAN-ami i rolami z 802.1X.</text>
