<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Wynik ip -6 addr: adres globalny tymczasowy do połączeń wychodzących, adres globalny stabilny z SLAAC, adres ULA fd5a:3c91:7e04:12::20 i adres link-local fe80::. Interfejs należy do grup multicast ff02::1 i solicited-node, brama domyślna fe80::1 z Router Advertisement.">
<title>Wynik ip -6 addr: adres globalny tymczasowy do połączeń wychodzących, adres globalny stabilny z SLAAC, adres ULA fd5a:3c91:7e04:12::20 i adres link-local fe80::. Interfejs należy do grup multicast ff02::1 i solicited-node, brama domyślna fe80::1 z Router Advertisement.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#1f1a14" text-anchor="middle" font-weight="700">Jeden interfejs, wiele adresów IPv6: wynik ip -6 addr na laptopie</text><rect x="40" y="52" width="820" height="62" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="56" y="76" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">inet6 2001:db8:abcd:12:9c4e:1f2a:77b0:3d11/64 scope global temporary dynamic</text><text x="56" y="98" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f">tymczasowy (RFC 8981) — źródło połączeń wychodzących, zmienia się co dobę</text><rect x="40" y="122" width="820" height="62" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="56" y="146" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">inet6 2001:db8:abcd:12:5f1:2a7c:e3d9:8b44/64 scope global dynamic mngtmpaddr</text><text x="56" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f">stabilny (RFC 7217) — z SLAAC, stały w tej sieci, do połączeń przychodzących</text><rect x="40" y="192" width="820" height="62" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="56" y="216" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">inet6 fd5a:3c91:7e04:12::20/64 scope global</text><text x="56" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c">ULA — adres wewnętrzny firmy (odpowiednik RFC 1918)</text><rect x="40" y="262" width="820" height="62" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="56" y="286" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14" font-weight="700">inet6 fe80::5f1:2a7c:e3d9:8b44/64 scope link</text><text x="56" y="308" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2f6fb3">link-local — zawsze; ND, RA, brama domyślna (fe80::1)</text><rect x="40" y="340" width="820" height="66" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="56" y="364" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Grupy multicast interfejsu (ip -6 maddr): ff02::1 (wszystkie węzły), ff02::1:ff… (solicited-node dla każdego adresu),</text><text x="56" y="386" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">routery dodatkowo ff02::2. Brama domyślna: default via fe80::1 dev wlan0 proto ra — z Router Advertisement.</text>
</svg>
