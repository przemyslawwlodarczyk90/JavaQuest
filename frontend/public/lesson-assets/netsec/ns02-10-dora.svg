<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Wymiana DORA między klientem bez adresu a serwerem DHCP 10.20.0.2: DHCPDISCOVER jako broadcast z portu 68 na port 67, DHCPOFFER z propozycją adresu 10.20.0.57/24, bramy, DNS i dzierżawy 8 godzin, DHCPREQUEST jako broadcast potwierdzający wybór serwera i DHCPACK zatwierdzający dzierżawę.">
<title>Wymiana DORA między klientem bez adresu a serwerem DHCP 10.20.0.2: DHCPDISCOVER jako broadcast z portu 68 na port 67, DHCPOFFER z propozycją adresu 10.20.0.57/24, bramy, DNS i dzierżawy 8 godzin, DHCPREQUEST jako broadcast potwierdzający wybór serwera i DHCPACK zatwierdzający dzierżawę.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">DORA: Discover → Offer → Request → Ack</text><rect x="80" y="56" width="200" height="50" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="180" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">klient (0.0.0.0)</text><rect x="620" y="56" width="200" height="50" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="720" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">serwer 10.20.0.2</text><line x1="180" y1="108" x2="180" y2="400" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><line x1="720" y1="108" x2="720" y2="400" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><line x1="184" y1="140" x2="716" y2="140" stroke="#c46a12" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">DHCPDISCOVER</text><text x="450" y="158" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">0.0.0.0:68 → 255.255.255.255:67 · „szukam serwera”</text><line x1="716" y1="210" x2="184" y2="210" stroke="#2f6fb3" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2f6fb3" text-anchor="middle" font-weight="700">DHCPOFFER</text><text x="450" y="228" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">proponuję 10.20.0.57/24, brama .1, DNS, lease 8 h</text><line x1="184" y1="280" x2="716" y2="280" stroke="#c46a12" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c46a12" text-anchor="middle" font-weight="700">DHCPREQUEST</text><text x="450" y="298" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">broadcast: „biorę ofertę serwera 10.20.0.2”</text><line x1="716" y1="350" x2="184" y2="350" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="700">DHCPACK</text><text x="450" y="368" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1f1a14" text-anchor="middle">potwierdzam — adres Twój do T1/T2/końca dzierżawy</text><text x="450" y="416" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Request jest broadcastem, by inne serwery wiedziały, że ich oferta odpada. Potem klient sprawdza adres (ARP probe/DAD).</text>
</svg>
