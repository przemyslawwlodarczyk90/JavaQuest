<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Drzewo decyzji: jeśli system jest wyłącznie mój — ćwiczę w izolowanym labie; jeśli nie, potrzebna jest pisemna zgoda właściciela, a bez niej stop; ze zgodą działam tylko w zakresie i oknie czasowym, w przeciwnym razie stop i pisemne rozszerzenie zakresu">
<title>Drzewo decyzji: jeśli system jest wyłącznie mój — ćwiczę w izolowanym labie; jeśli nie, potrzebna jest pisemna zgoda właściciela, a bez niej stop; ze zgodą działam tylko w zakresie i oknie czasowym, w przeciwnym razie stop i pisemne rozszerzenie zakresu</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Czy wolno mi to zrobić? Drzewo decyzji przed każdym testem</text><polygon points="300,56 450,90 300,124 150,90" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="300" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Czy system jest mój</text><text x="300" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">(i tylko mój)?</text><line x1="450" y1="90" x2="610" y2="90" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="530" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">TAK</text><rect x="620" y="60" width="250" height="60" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="745" y="85" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">Własny, izolowany lab</text><text x="745" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">ćwicz — z zachowaniem izolacji</text><line x1="300" y1="124" x2="300" y2="176" stroke="#b23b3b" stroke-width="2" marker-end="url(#arr)"/><text x="312" y="154" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">NIE</text><polygon points="300,180 450,214 300,248 150,214" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="300" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Czy mam pisemną zgodę</text><text x="300" y="228" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">właściciela systemu?</text><line x1="150" y1="214" x2="140" y2="214" stroke="#6b6257" stroke-width="2"/><line x1="140" y1="214" x2="140" y2="300" stroke="#b23b3b" stroke-width="2" marker-end="url(#arr)"/><text x="128" y="260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" text-anchor="end" font-weight="700">NIE</text><rect x="20" y="302" width="240" height="60" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="140" y="326" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">STOP</text><text x="140" y="346" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">nie testuj; możesz zgłosić obserwację (VDP)</text><line x1="300" y1="248" x2="300" y2="300" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="312" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">TAK</text><polygon points="450,304 600,338 450,372 300,338" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="450" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">Czy czynność mieści się</text><text x="450" y="352" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">w zakresie i oknie czasu?</text><line x1="300" y1="300" x2="300" y2="338" stroke="#6b6257" stroke-width="2"/><line x1="300" y1="338" x2="300" y2="338" stroke="#6b6257" stroke-width="2"/><line x1="600" y1="338" x2="700" y2="338" stroke="#b23b3b" stroke-width="2"/><line x1="700" y1="338" x2="700" y2="300" stroke="#b23b3b" stroke-width="2" marker-end="url(#arr)"/><rect x="625" y="240" width="240" height="60" rx="8" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1.5"/><text x="745" y="264" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" text-anchor="middle" font-weight="700">STOP i zapytaj</text><text x="745" y="284" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">rozszerzenie zakresu tylko pisemnie</text><text x="640" y="330" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b23b3b" font-weight="700">NIE</text><line x1="450" y1="372" x2="450" y2="410" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="462" y="396" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">TAK</text><rect x="300" y="412" width="300" height="64" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="450" y="436" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="700">Działaj wg rules of engagement</text><text x="450" y="456" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">loguj czynności, zgłaszaj krytyczne odkrycia</text>
</svg>
