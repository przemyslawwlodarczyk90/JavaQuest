<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Pięć routerów w jednym VLAN-ie: R3 z priorytetem 100 zostaje DR, R2 z najwyższym Router ID wśród pozostałych BDR, R1 i R4 DROTHER, R5 z priorytetem 0 nigdy nie zostanie DR. Brak wywłaszczania, liczba pełnych sąsiedztw spada z 10 do 7, kolejność wyboru Router ID.">
<title>Pięć routerów w jednym VLAN-ie: R3 z priorytetem 100 zostaje DR, R2 z najwyższym Router ID wśród pozostałych BDR, R1 i R4 DROTHER, R5 z priorytetem 0 nigdy nie zostanie DR. Brak wywłaszczania, liczba pełnych sąsiedztw spada z 10 do 7, kolejność wyboru Router ID.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Segment broadcast: DR i BDR ograniczają liczbę pełnych sąsiedztw</text><rect x="330" y="70" width="240" height="30" rx="6" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="450" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle" font-weight="700">przełącznik / VLAN 10</text><line x1="90" y1="140" x2="450" y2="100" stroke="#d9d0c3" stroke-width="2"/><rect x="20" y="140" width="140" height="70" rx="8" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="90" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R1</text><text x="90" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">prio 1, RID 1.1.1.1</text><text x="90" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle" font-weight="700">DROTHER</text><line x1="270" y1="140" x2="450" y2="100" stroke="#d9d0c3" stroke-width="2"/><rect x="200" y="140" width="140" height="70" rx="8" fill="#e9e1f5" stroke="#6a4c9c" stroke-width="1.5"/><text x="270" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R2</text><text x="270" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">prio 1, RID 2.2.2.2</text><text x="270" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6a4c9c" text-anchor="middle" font-weight="700">BDR</text><line x1="450" y1="140" x2="450" y2="100" stroke="#d9d0c3" stroke-width="2"/><rect x="380" y="140" width="140" height="70" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="450" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R3</text><text x="450" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">prio 100, RID 3.3.3.3</text><text x="450" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="700">DR</text><line x1="630" y1="140" x2="450" y2="100" stroke="#d9d0c3" stroke-width="2"/><rect x="560" y="140" width="140" height="70" rx="8" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="630" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R4</text><text x="630" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">prio 1, RID 4.4.4.4</text><text x="630" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle" font-weight="700">DROTHER</text><line x1="810" y1="140" x2="450" y2="100" stroke="#d9d0c3" stroke-width="2"/><rect x="740" y="140" width="140" height="70" rx="8" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><text x="810" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R5</text><text x="810" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#1f1a14" text-anchor="middle">prio 0</text><text x="810" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle" font-weight="700">nigdy DR</text><rect x="40" y="236" width="820" height="148" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Wybór: najwyższy priorytet interfejsu (0 = nie kandyduje), przy remisie najwyższy Router ID. Brak wywłaszczania —</text><text x="60" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">nowy router z wyższym priorytetem NIE przejmie roli DR, dopóki obecny DR działa (restart procesu: clear ip ospf process).</text><text x="60" y="306" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">Bez DR: n(n−1)/2 sąsiedztw Full (5 routerów → 10). Z DR/BDR: każdy DROTHER Full tylko z DR i BDR (5 → 7), między DROTHER — 2-Way.</text><text x="60" y="332" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Router ID: ręcznie (router-id) &gt; najwyższy adres loopback &gt; najwyższy adres aktywnego interfejsu. Zmiana RID = restart procesu.</text><text x="60" y="358" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2e7d4f" font-weight="700">Na łączach P2P (i w Kubernetes/chmurze z /31) ustaw ip ospf network point-to-point — szybciej, bez wyboru DR.</text>
</svg>
