<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Pasek ramki Ethernet: preambuła 7 bajtów, SFD 1 bajt, MAC docelowy 6, MAC źródłowy 6, EtherType 2, dane 46–1500, FCS 4, przerwa międzyramkowa 12, z opisem roli każdego pola">
<title>Pasek ramki Ethernet: preambuła 7 bajtów, SFD 1 bajt, MAC docelowy 6, MAC źródłowy 6, EtherType 2, dane 46–1500, FCS 4, przerwa międzyramkowa 12, z opisem roli każdego pola</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Ramka Ethernet II na kablu</text><rect x="40" y="80" width="65.8" height="46" rx="3" fill="#ece7df" stroke="#6b6257" stroke-width="1.5"/><text x="72.9" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle" font-weight="700">preamb.</text><text x="72.9" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">7 B</text><rect x="105.8" y="80" width="38" height="46" rx="3" fill="#ece7df" stroke="#6b6257" stroke-width="1.5"/><text x="124.8" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle" font-weight="700">SFD</text><text x="124.8" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">1 B</text><rect x="143.8" y="80" width="56.400000000000006" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="172" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">MAC dst</text><text x="172" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">6 B</text><rect x="200.20000000000002" y="80" width="56.400000000000006" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="228.40000000000003" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">MAC src</text><text x="228.40000000000003" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">6 B</text><rect x="256.6" y="80" width="38" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="275.6" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">Type</text><text x="275.6" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">2 B</text><rect x="294.6" y="80" width="376" height="46" rx="3" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="482.6" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2f6fb3" text-anchor="middle" font-weight="700">dane (payload)</text><text x="482.6" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">46–1500 B</text><rect x="670.6" y="80" width="38" height="46" rx="3" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="689.6" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">FCS</text><text x="689.6" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">4 B</text><rect x="708.6" y="80" width="112.80000000000001" height="46" rx="3" fill="#ece7df" stroke="#6b6257" stroke-width="1.5"/><text x="765" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle" font-weight="700">IFG</text><text x="765" y="117" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">12 B</text><text x="330" y="172" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="700">ramka: 64–1518 B (z FCS)</text><text x="330" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">to widzi przełącznik i (bez FCS) Wireshark</text><rect x="40" y="220" width="820" height="160" rx="10" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="56" y="248" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">MAC docelowy / źródłowy</text><text x="250" y="248" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">kto ma odebrać ramkę w tym segmencie i kto ją wysłał (6 bajtów, np. 02:42:ac:11:00:02)</text><text x="56" y="275" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">EtherType</text><text x="250" y="275" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">co jest w środku: 0x0800 IPv4, 0x86DD IPv6, 0x0806 ARP, 0x8100 tag VLAN; wartość ≤ 1500 = długość (802.3)</text><text x="56" y="302" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">dane</text><text x="250" y="302" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">pakiet warstwy wyżej; krótsze niż 46 B dopełniane zerami (padding) do minimalnej ramki 64 B</text><text x="56" y="329" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">FCS</text><text x="250" y="329" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">CRC-32 liczony przez kartę; błędna suma = ramka odrzucona po cichu (licznik CRC errors)</text><text x="56" y="356" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">preambuła, SFD, IFG</text><text x="250" y="356" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">warstwa fizyczna: synchronizacja zegara i przerwa między ramkami — nie trafiają do przechwycenia</text>
</svg>
