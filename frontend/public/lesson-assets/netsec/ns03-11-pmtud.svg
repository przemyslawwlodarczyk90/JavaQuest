<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Path MTU Discovery: serwer wysyła pakiet 1500 bajtów z flagą DF, router R2 przed łączem tunelowym o MTU 1420 odrzuca go i odsyła ICMP fragmentation needed z MTU 1420, serwer zapamiętuje PMTU i zmniejsza pakiety; w IPv6 analogicznie Packet Too Big. Polecenia tracepath, ip route get, ping -M do.">
<title>Path MTU Discovery: serwer wysyła pakiet 1500 bajtów z flagą DF, router R2 przed łączem tunelowym o MTU 1420 odrzuca go i odsyła ICMP fragmentation needed z MTU 1420, serwer zapamiętuje PMTU i zmniejsza pakiety; w IPv6 analogicznie Packet Too Big. Polecenia tracepath, ip route get, ping -M do.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#1f1a14" text-anchor="middle" font-weight="700">Path MTU Discovery: DF=1, router odsyła „fragmentation needed” z MTU następnego łącza</text><rect x="20" y="60" width="120" height="40" rx="8" fill="#dce9f7" stroke="#2f6fb3" stroke-width="1.5"/><text x="80" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">serwer</text><rect x="260" y="60" width="120" height="40" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="320" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R1</text><rect x="500" y="60" width="120" height="40" rx="8" fill="#fbe6cf" stroke="#c46a12" stroke-width="1.5"/><text x="560" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">R2 (tunel)</text><rect x="740" y="60" width="120" height="40" rx="8" fill="#dcefe3" stroke="#2e7d4f" stroke-width="1.5"/><text x="800" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#1f1a14" text-anchor="middle" font-weight="700">klient</text><line x1="142" y1="80" x2="258" y2="80" stroke="#6b6257" stroke-width="2"/><text x="200" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">MTU 1500</text><line x1="382" y1="80" x2="498" y2="80" stroke="#6b6257" stroke-width="2"/><text x="440" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">MTU 1500</text><line x1="622" y1="80" x2="738" y2="80" stroke="#b23b3b" stroke-width="3"/><text x="680" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" text-anchor="middle" font-weight="700">MTU 1420</text><text x="60" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">① serwer wysyła segment TCP 1500 B z DF=1</text><text x="60" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b23b3b" font-weight="700">② R2: 1500 &gt; 1420 i DF=1 → odrzuca i odsyła ICMP 3/4 „fragmentation needed, next-hop MTU 1420”</text><text x="60" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f">③ serwer zapisuje PMTU 1420 dla tego celu (ip route get → cache mtu 1420) i zmniejsza segmenty</text><text x="60" y="230" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2e7d4f">④ kolejne pakiety 1420 B przechodzą; IPv6: to samo z ICMPv6 Packet Too Big (routery nigdy nie fragmentują)</text><rect x="40" y="270" width="820" height="110" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="60" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" font-weight="700">Sprawdzenie w Linuksie:</text><text x="60" y="320" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">tracepath -n klient.example          # pokazuje pmtu na każdym skoku</text><text x="60" y="342" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">ip route get 203.0.113.50             # po otrzymaniu ICMP: „cache expires 598sec mtu 1420”</text><text x="60" y="364" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f1a14">ping -M do -s 1392 203.0.113.50       # 1392 + 28 = 1420 przechodzi, 1393 nie</text>
</svg>
