<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Wykres zajętych portów SNAT w funkcji tempa nowych połączeń do jednego celu przy czasie trzymania 60 s: limit 55 000 połączeń na adres AWS NAT Gateway osiągany przy około 917 połączeniach na sekundę, dwa adresy dają 110 000. Przy 2000 połączeń na sekundę potrzeba 3 adresów. Rozwiązanie: pule połączeń i keep-alive.">
<title>Wykres zajętych portów SNAT w funkcji tempa nowych połączeń do jednego celu przy czasie trzymania 60 s: limit 55 000 połączeń na adres AWS NAT Gateway osiągany przy około 917 połączeniach na sekundę, dwa adresy dają 110 000. Przy 2000 połączeń na sekundę potrzeba 3 adresów. Rozwiązanie: pule połączeń i keep-alive.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#fbf8f3"/>
<text x="450" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#1f1a14" text-anchor="middle" font-weight="700">Wyczerpanie portów SNAT: dużo krótkich połączeń do JEDNEGO celu</text><line x1="80" y1="300" x2="720" y2="300" stroke="#1f1a14" stroke-width="2"/><line x1="80" y1="300" x2="80" y2="90" stroke="#1f1a14" stroke-width="2"/><text x="400" y="336" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" text-anchor="middle">nowe połączenia na sekundę do tego samego ip:port</text><text x="70" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">zajęte porty (czas trzymania 60 s)</text><text x="80" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">0</text><text x="240" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">500</text><text x="400" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">1000</text><text x="560" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">1500</text><text x="720" y="318" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#1f1a14" text-anchor="middle">2000</text><line x1="80" y1="211.15384615384616" x2="720" y2="211.15384615384616" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5"/><text x="726" y="215.15384615384616" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b">1 IP AWS NAT GW (55 000)</text><line x1="80" y1="122.30769230769232" x2="720" y2="122.30769230769232" stroke="#6a4c9c" stroke-width="2" stroke-dasharray="6 5"/><text x="726" y="126.30769230769232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c">2 IP (110 000)</text><line x1="80" y1="300" x2="720" y2="106.15384615384613" stroke="#c46a12" stroke-width="3"/><text x="365.44" y="201.15384615384616" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#b23b3b" text-anchor="end" font-weight="700">~917/s → limit 1 IP</text><rect x="40" y="352" width="820" height="66" rx="8" fill="#ffffff" stroke="#d9d0c3" stroke-width="1.5"/><text x="56" y="376" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14">Przykład: 2000 nowych połączeń/s do bazy w Internecie × 60 s TIME_WAIT/conntrack = 120 000 portów → potrzeba 3 adresów IP NAT.</text><text x="56" y="400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#1f1a14" font-weight="700">Objawy: sporadyczne timeouty wychodzące, ErrorPortAllocation (AWS), „nf_conntrack: table full”. Lek: pule połączeń, keep-alive.</text>
</svg>
