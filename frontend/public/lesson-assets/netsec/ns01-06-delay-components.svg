<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Cztery składowe opóźnienia: przetwarzanie, kolejkowanie, transmisja i propagacja z przykładowymi wartościami">
<title>Cztery składowe opóźnienia: przetwarzanie, kolejkowanie, transmisja i propagacja z przykładowymi wartościami</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#fbf8f3"/>
<text x="450" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Cztery składowe opóźnienia jednego pakietu</text><rect x="30" y="64" width="840" height="60" rx="8" fill="#ffffff" stroke="#6b6257" stroke-width="1.5"/><rect x="30" y="64" width="10" height="60" rx="4" fill="#6b6257"/><text x="56" y="89" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#6b6257" font-weight="700">Przetwarzanie</text><text x="56" y="111" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">router czyta nagłówek, szuka trasy</text><text x="855" y="101" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="end">µs</text><rect x="30" y="136" width="840" height="60" rx="8" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><rect x="30" y="136" width="10" height="60" rx="4" fill="#b23b3b"/><text x="56" y="161" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#b23b3b" font-weight="700">Kolejkowanie</text><text x="56" y="183" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">pakiet czeka w buforze na wolne łącze</text><text x="855" y="173" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="end">0 – setki ms</text><rect x="30" y="208" width="840" height="60" rx="8" fill="#ffffff" stroke="#c46a12" stroke-width="1.5"/><rect x="30" y="208" width="10" height="60" rx="4" fill="#c46a12"/><text x="56" y="233" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#c46a12" font-weight="700">Transmisja (serializacja)</text><text x="56" y="255" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">wypchnięcie bitów: rozmiar × 8 / przepustowość</text><text x="855" y="245" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="end">1500 B @ 10 Mb/s = 1,2 ms</text><rect x="30" y="280" width="840" height="60" rx="8" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/><rect x="30" y="280" width="10" height="60" rx="4" fill="#2f6fb3"/><text x="56" y="305" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2f6fb3" font-weight="700">Propagacja</text><text x="56" y="327" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14">sygnał biegnie przez medium: odległość / prędkość</text><text x="855" y="317" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f1a14" text-anchor="end">1000 km światłowodu ≈ 5 ms</text><text x="450" y="370" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">opóźnienie jednokierunkowe = przetwarzanie + kolejkowanie + transmisja + propagacja (na każdym odcinku)</text><text x="450" y="392" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#6b6257" text-anchor="middle">Szybsze łącze skraca tylko transmisję; propagacji nie skróci nic poza krótszą trasą (bliższy region, CDN).</text>
</svg>
