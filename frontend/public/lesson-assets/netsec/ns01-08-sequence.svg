<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Diagram sekwencji: laptop pyta ARP o bramę, zestawia połączenie TCP z proxy przez router z NAT i wysyła GET; proxy otwiera osobne połączenie do aplikacji, przekazuje żądanie z X-Forwarded-For i odsyła odpowiedź 200">
<title>Diagram sekwencji: laptop pyta ARP o bramę, zestawia połączenie TCP z proxy przez router z NAT i wysyła GET; proxy otwiera osobne połączenie do aplikacji, przekazuje żądanie z X-Forwarded-For i odsyła odpowiedź 200</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6257"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#fbf8f3"/>
<text x="450" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" fill="#1f1a14" text-anchor="middle" font-weight="700">Kolejność zdarzeń: ARP, handshake, żądanie, drugie połączenie</text><rect x="55" y="48" width="110" height="30" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="110" y="68" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">laptop</text><line x1="110" y1="80" x2="110" y2="500" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><rect x="285" y="48" width="110" height="30" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="340" y="68" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">router</text><line x1="340" y1="80" x2="340" y2="500" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><rect x="515" y="48" width="110" height="30" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="570" y="68" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">proxy</text><line x1="570" y1="80" x2="570" y2="500" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><rect x="745" y="48" width="110" height="30" rx="6" fill="#ffffff" stroke="#1f1a14" stroke-width="1.5"/><text x="800" y="68" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#1f1a14" text-anchor="middle" font-weight="700">app</text><line x1="800" y1="80" x2="800" y2="500" stroke="#d9d0c3" stroke-width="2" stroke-dasharray="6 5"/><line x1="110" y1="104" x2="340" y2="104" stroke="#c46a12" stroke-width="2" marker-end="url(#arr)"/><text x="225" y="98" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">ARP: kto ma 10.10.1.1?</text><line x1="340" y1="140" x2="110" y2="140" stroke="#c46a12" stroke-width="2" marker-end="url(#arr)"/><text x="225" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">ARP: 10.10.1.1 is-at …01:01</text><line x1="110" y1="176" x2="570" y2="176" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="340" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">SYN → 10.20.0.10:80 (przez router, NAT)</text><line x1="570" y1="212" x2="110" y2="212" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="340" y="206" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">SYN-ACK</text><line x1="110" y1="248" x2="570" y2="248" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="340" y="242" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">ACK</text><line x1="110" y1="284" x2="570" y2="284" stroke="#6a4c9c" stroke-width="2" marker-end="url(#arr)"/><text x="340" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">GET /users/42</text><line x1="570" y1="320" x2="800" y2="320" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="685" y="314" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">SYN → 10.30.0.20:8080 (nowe połączenie)</text><line x1="800" y1="356" x2="570" y2="356" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/><text x="685" y="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="700">SYN-ACK</text><line x1="570" y1="392" x2="800" y2="392" stroke="#6a4c9c" stroke-width="2" marker-end="url(#arr)"/><text x="685" y="386" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">ACK + GET /users/42, X-Forwarded-For</text><line x1="800" y1="428" x2="570" y2="428" stroke="#6a4c9c" stroke-width="2" marker-end="url(#arr)"/><text x="685" y="422" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">200 OK {json}</text><line x1="570" y1="464" x2="110" y2="464" stroke="#6a4c9c" stroke-width="2" marker-end="url(#arr)"/><text x="340" y="458" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6a4c9c" text-anchor="middle" font-weight="700">200 OK {json}</text><text x="340" y="508" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6257" text-anchor="middle">router nie tworzy nowych połączeń — tylko podmienia adres źródłowy (NAT)</text>
</svg>
