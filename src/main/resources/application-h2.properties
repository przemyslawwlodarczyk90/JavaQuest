# Profil awaryjny/dev: platforma na bazie w pamieci H2 zamiast PostgreSQL (np. gdy Docker nie dziala).
# Uruchomienie: --spring.profiles.active=h2. Dane znikaja po zatrzymaniu aplikacji. Aktywowany
# wylacznie jawnie - lekcje kursu go nie uzywaja.
spring.datasource.url=jdbc:h2:mem:javaquest_platform;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
