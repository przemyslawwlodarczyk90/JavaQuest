# Konfiguracja WYLACZNIE platformy edukacyjnej (com.example.javaquest.web.JavaQuestApplication):
# baza danych, Hibernate, SMTP i JWT logowania. Ladowana przez @PropertySource w
# PlatformPropertiesConfig - NIE przez globalny application.properties, bo ten wspoldzielony jest
# z wszystkimi 31 rozdzialami kursu (lekcje ustawiaja wlasne datasource/jpa w izolowanych
# kontekstach, a wartosci z globalnego pliku mialyby WYZSZY priorytet i by je nadpisaly).
#
# Wrazliwe dane (haslo SMTP, sekret JWT) NIE leza tutaj - patrz
# javaquest-platform-secrets.properties (w .gitignore) i wzor
# javaquest-platform-secrets.properties.example.

# --- Baza danych (PostgreSQL; docker compose up -d z compose.yaml w korzeniu repo) ---
spring.datasource.url=${JAVAQUEST_DB_URL:jdbc:postgresql://localhost:5432/pgDB}
spring.datasource.username=${JAVAQUEST_DB_USER:user}
spring.datasource.password=${JAVAQUEST_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate: tryb update - schemat (users, tokeny, tresc lekcji) przetrwa restart ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- SMTP (login/haslo w pliku secrets) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Actuator domyslnie wlaczylby "mail" w /actuator/health i przy braku dostepu do SMTP ustawil
# caly status na DOWN.
management.health.mail.enabled=false

# --- Logowanie / JWT ---
auth.jwt.expiration-days=7
auth.jwt.issuer=JavaQuest
# Adres, pod ktorym uzytkownik otwiera aplikacje - wchodzi do linku potwierdzajacego w mailu.
app.base-url=${JAVAQUEST_BASE_URL:http://localhost:8082}
app.mail.from-name=JavaQuest
# Domyslnie WYMAGANE (jak w produkcji) - rejestracja wysyla mail z linkiem, konto jest nieaktywne
# do czasu kliknicia. Nadpisz na "false" w LOKALNYM javaquest-platform-secrets.properties (nie tutaj!),
# jesli SMTP nie dziala (patrz AuthService.register() javadoc) - konto bedzie aktywowane od razu, bez
# maila. Trzymane tu (nie tylko w kodzie), zeby default byl widoczny i jawnie dokumentowany.
app.mail.confirmation-required=true

# --- Quiz: ile pytan losowac z puli lekcji i ile % poprawnych zalicza (zaokraglane w gore) ---
platform.quiz.draw-size=20
platform.quiz.pass-percent=80
# Ile pytan "do poprawy" (ostatnia odpowiedz byla bledna) trafia najpierw do nowego losowania.
platform.quiz.retry-wrong-max=5

# --- Mastery (gwiazdki 0..3) - JEDYNE miejsce z interwalami, patrz MasteryProperties i
# MASTERY_V1_PLAN.md. Daty sa wylacznie wewnetrzne - uzytkownik widzi tylko gwiazdki.
# spacing-levelN: min. odstep od ostatniego policzonego zaliczenia, zeby zaliczenie na poziomie N
#   podnioslo poziom (dla 3 - odswiezylo zegar starzenia). Zaliczenia "za wczesnie" nic nie zmieniaja.
# retention-levelN: jak dlugo poziom N trwa bez potwierdzenia, zanim spadnie o jeden (1 = podloga).
platform.mastery.min-questions=10
platform.mastery.spacing-level1=20h
platform.mastery.spacing-level2=6d
platform.mastery.spacing-level3=30d
platform.mastery.retention-level2=30d
platform.mastery.retention-level3=60d

# --- Swagger / OpenAPI (springdoc juz na WSPOLNYM classpath - patrz komentarz w pom.xml przy
# springdoc-openapi-starter-webmvc-ui, dodany dla _22_spring_web/Lesson18). Bez jawnego
# packagesToScan springdoc i tak dziala (skanuje beany @RestController juz zarejestrowane w TYM
# kontekscie, a component-scan JavaQuestApplication jest ograniczony do "web"+"platform" - patrz
# jej javadoc), ale wypisujemy to explicite (jak w dodatkowe materialy/UserBridge, z ktorego
# porcowany byl modul logowania), zeby zasieg byl jawny i nie zalezal od domyslnego zachowania
# auto-konfiguracji. Obejmuje WSZYSTKIE kontrolery platformy (auth/chapter/content/quiz/progress/
# topics) - wszystkie leza pod tym jednym pakietem nadrzednym.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.example.javaquest.platform
