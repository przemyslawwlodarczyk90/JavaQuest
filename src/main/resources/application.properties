spring.application.name=Java Quest

# UWAGA: nie dodawaj tu "server.port" globalnie - to zlamaloby WSZYSTKIE 31 rozdzialow
# kursu, ktore polegaja na "server.port=0" (losowy wolny port) ustawianym WEWNATRZ
# wlasnych, izolowanych kontekstow lekcji (ta wlasciwosc w tym pliku ma WYZSZY priorytet
# niz SpringApplicationBuilder.properties(...) danej lekcji, wiec globalny "server.port"
# nadpisalby KAZDA lekcje naraz - dokladnie ta sama pulapka priorytetow, co przy
# "spring.autoconfigure.exclude" opisanym nizej). Platforma edukacyjna
# (com.example.javaquest.web.JavaQuestApplication) ma WLASNY, domyslny port 8082
# ustawiony PRZEZ System.setProperty w main() (WYZSZY priorytet niz ten plik) - patrz
# komentarz w JavaQuestApplication.java. Powod niestandardowego portu: port 8080 na tej
# maszynie jest TRWALE zajety przez systemowy proces "AgentService".

# Domyslnie WYLACZAMY auto-konfiguracje Spring Security dla CALEGO projektu. Powod: dodanie
# spring-boot-starter-security (potrzebne dla rozdzialu _24_spring_security) sprawia, ze KAZDA
# aplikacja Spring Boot w tym repo (embedded Tomcat + realne zadania HTTP) domyslnie zabezpiecza
# WSZYSTKIE endpointy (401 Unauthorized) - dokladnie ta sama kategoria regresji co ze springdoc
# w _22_spring_web (zobacz CLAUDE.md), zweryfikowane empirycznie na _22_spring_web/Lesson19
# (kapszton), ktory zaczal zwracac 401 zamiast 200/201/404 po dodaniu tego startera.
# _24_spring_security musi jawnie NADPISAC ta wlasciwosc W SWOICH WLASNYCH Properties
# (spring.autoconfigure.exclude= - pusta wartosc), zeby faktycznie demonstrowac Spring Security.
#
# ROZSZERZONE 2026-07-20 (rozdzial _29_spring_reactive): wymuszenie WebApplicationType.REACTIVE
# (np. Lesson09_WebFluxVsSpringMvc) odslania REAKTYWNY odpowiednik TEJ SAMEJ pulapki - Spring
# Security ma OSOBNA auto-konfiguracje dla WebFlux (ReactiveSecurityAutoConfiguration/
# ReactiveUserDetailsServiceAutoConfiguration w pakiecie security.reactive, NIE security.servlet) -
# wykluczenie TYLKO servletowej wersji NIE WYSTARCZYLO, dalo 401 Unauthorized na KAZDYM
# reaktywnym endpoincie. Lekcje _29_spring_reactive/Lesson14_ReactiveSecurity musza jawnie
# PRZYWROCIC te wlasciwosc (tak jak _24_spring_security), zeby faktycznie demonstrowac
# zabezpieczenia WebFlux.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration,org.springframework.boot.autoconfigure.jms.activemq.ActiveMQAutoConfiguration,org.springframework.boot.actuate.autoconfigure.jms.JmsHealthContributorAutoConfiguration

# ROZSZERZONE 2026-07-20 (rozdzial _30_spring_messaging_and_async): dodanie spring-boot-starter-amqp
# (potrzebne dla Lesson08-09, RabbitMQ) sprawilo, ze Actuator AUTOMATYCZNIE dodaje "rabbit" jako
# skladnik /actuator/health - PRZY BRAKU dzialajacego brokera (Docker niedostepny na tej maszynie,
# jak w _26_integration_testing) CALY status zdrowia aplikacji staje sie "DOWN" zamiast "UP",
# nawet jesli reszta aplikacji dziala poprawnie - zepsulo to _21_spring_boot/Lesson16_SpringBootCapstone
# (zweryfikowane empirycznie: status DOWN po dodaniu AMQP, mimo ze demo samo w sobie nie uzywa
# RabbitMQ). RabbitHealthContributorAutoConfiguration wylaczona powyzej - jesli kiedys lekcja
# _30_spring_messaging_and_async zechce faktycznie pokazac ten health-indicator (np. z dzialajacym
# Dockerem), musi jawnie przywrocic go tak samo jak Security robi to w swoich lekcjach.
#
# ROWNIEZ wylaczona ActiveMQAutoConfiguration (KLASYCZNA, javax.jms-owa) - `_30_spring_messaging_
# and_async/Lesson06` dodal `activemq-client`/`activemq-broker` (javax.jms) DO WSPOLNEGO classpath
# (potrzebne DLA surowego API JMS BEZ Springa) - ale Spring Boot WYKRYWA klase
# `org.apache.activemq.ActiveMQConnectionFactory` (Classic) I AUTOMATYCZNIE probuje jej uzyc DLA
# KAZDEJ aplikacji Spring Boot Z `@EnableJms`/JmsTemplate NA classpath - W TYM Lesson07 (Artemis,
# jakarta.jms) - dajac `IncompatibleClassChangeError: ... does not implement jakarta.jms.
# ConnectionFactory` (Classic NIE implementuje jakarta.jms, tylko javax.jms). Lesson06 NIE UZYWA
# Spring Boot auto-konfiguracji WCALE (czyste API JMS, bez @SpringBootApplication), wiec to
# wykluczenie NIC mu NIE ZABIERA - Lesson07 (Artemis + Spring JmsTemplate) dziala poprawnie PO
# tym wykluczeniu.

# ROZSZERZONE 2026-07-25 (rozdzial _31_spring_cloud_microservices): dodanie
# spring-cloud-starter-netflix-eureka-client sprawilo, ze KAZDA aplikacja Spring Boot w calym
# projekcie probuje sie ZAREJESTROWAC w Eurece (i pobrac rejestr) PRZY STARCIE - bez dzialajacego
# serwera Eureka dawalo to NullPointerException w EurekaServiceRegistry.maybeInitializeClient
# (CloudEurekaClient nie zdazyl sie zainicjalizowac) i wywalalo start KAZDEGO kontekstu Spring Boot
# w repo (zweryfikowane empirycznie regresja na _21_spring_boot/Lesson16_SpringBootCapstone).
# Domyslnie WYLACZONE ponizej - lekcje _31_spring_cloud_microservices demonstrujace Eureke musza
# jawnie PRZYWROCIC te wlasciwosci (System.setProperty przed .run(), ten sam wzorzec co Security).
eureka.client.enabled=false

# Podobnie spring-cloud-starter-config (klient Config Servera) probuje polaczyc sie z
# Config Serverem PRZY STARCIE - domyslnie NIE jest to fail-fast (spring.cloud.config.fail-fast=
# false), wiec nie wywraca kontekstu, ale jest to NIEPOTRZEBNE opoznienie/log bledu dla KAZDEJ
# innej lekcji w repo. Wylaczone prewencyjnie - lekcje _31_spring_cloud_microservices/Lesson05
# musza jawnie przywrocic.
spring.cloud.config.enabled=false

# spring-cloud-starter-gateway-mvc rejestruje WLASNE globalne filtry naglowkow HTTP
# (forwardedRequestHeadersFilter/removeContentLengthRequestHeadersFilter/itd.) BEZPOSREDNIO w
# kontekscie Spring MVC NIEZALEZNIE od tego, czy zdefiniowano jakiekolwiek trasy Gateway - to
# NIE jest kontrolowane przez spring.autoconfigure.exclude (ktory niektore lekcje jak
# _24_spring_security CZYSCA CALKOWICIE, wiec wpis tam i tak by "wyciekl" z powrotem). Uzyto
# WLASNEJ flagi wlasciwosci Gateway MVC (niezaleznej od exclude-list) - zweryfikowane empirycznie
# regresja na _24_spring_security/Lesson17 (POST /api/login z form-urlencoded body przestal
# dzialac - parametry przychodzily jako puste stringi, "username=[]", zamiast "kasia" -
# najpewniej filtr Gateway MVC czytal/normalizowal body/naglowki PRZED Spring MVC).
spring.cloud.gateway.mvc.enabled=false

